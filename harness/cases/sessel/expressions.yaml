- id: sessel.expr.compose.putting-it-together
  context_html: '<!DOCTYPE html><html><body><div itemprop="product" data-name="Anvil">150</div><div itemprop="product" data-name="Nail">20</div></body></html>'
  expr: |-
    @namespace p url("https://pagelove.org/Binding/CSS");
    let products = ${[itemprop="product"]};
    let count = products.count();
    let header = new h2 { text: "Found " + count.String() + " products" };
    let items = products.map(el =>
      let name = el.attr("data-name");
      let price = el.value().Number();
      let badge = if (price > 100) { new span.premium { text: "Premium" } } else { new span.value { text: "Great value" } };
      new li.product {
        new span[itemprop="name"] { text: name },
        new span[itemprop="price"] { text: price },
        badge
      }
    );
    new section.results[p|transient] {
      header,
      new ul { items }
    }
  expect_html: |-
    <section class="results" p:transient>
      <h2>Found 2 products</h2>
      <ul>
        <li class="product"><span itemprop="name">Anvil</span><span itemprop="price">150</span><span class="premium">Premium</span></li>
        <li class="product"><span itemprop="name">Nail</span><span itemprop="price">20</span><span class="value">Great value</span></li>
      </ul>
    </section>
  source: "[SES-V] §Putting it all together"
  confidence: medium
