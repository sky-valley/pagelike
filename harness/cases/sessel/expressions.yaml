# Sessel pure-expression tests (spec: docs/spec/sessel.md, area: sessel).
#
# This file is NOT an HTTP case file (harness.Load skips files named
# expressions.yaml). It is a flat list of tests for the Sessel interpreter,
# run in-process by internal/sessel tests against an isolated in-memory site,
# which is why paths here are plain site paths ("/doc.html") rather than
# ${P}-prefixed. Live verification goes through the HTTP cases in this
# directory (query-*.yaml); a test can be replayed live by storing its
# documents under ${P}, prefixing every absolute path in `expr` with ${P}, and
# sending `expr` as `QUERY ${P}<context_path>` with Content-Type: text/sessel.
#
# Fields of each item:
#   id              unique, `sessel.expr.<group>.<name>`
#   expr            the Sessel program
#   context_html    optional: the current document (self / document); it is
#                   also part of the site. Absent → self is unbound.
#   context_path    path of the current document (default "/doc.html")
#   site            optional list of {path, body}: more stored documents.
#                   Bare selector literals search context doc + site.
#   prior_html      optional: pre-mutation version of the current document
#                   (enables `from prior`); absent → prior is null.
#   request         optional: {method, path, headers, query, params, body}
#                   bound as `request` and `Context.request`.
#   expect_json     expected result, compared as JSON after encoding with
#                   application/sessel+json (numbers compare numerically, so
#                   42 == 42.0 — Integer/Float distinctions are asserted via
#                   `.String()`). Elements appear as
#                   {"$type": "element", "$html": ..., "$source": ...}.
#   expect_html     expected single-Element result, DOM-equivalent outer HTML
#                   (whitespace between tags ignored, attribute order ignored,
#                   `required` == `required=""`).
#   expect_match    RE2 regexp the (String) result must match (random or
#                   locale-dependent output).
#   expect_error    the program must fail: `parse` (rejected before running),
#                   `TypeError`, `RuntimeError`, or `any`.
#   evidence        documented (default) | client-source | demo-source | inferred
#   confidence      high (default) | medium | low
#   status          disputed → losing side of a contradiction (spec §20)
#   source          doc page tag + section (tags defined in spec §0.1)
#   notes           free text
