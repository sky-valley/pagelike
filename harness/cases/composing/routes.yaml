# Composing: parameterized routes.
# Spec: docs/spec/composing.md §15 (R-COMP-100..109).
# Template paths contain a literal ':' segment; the runner writes them as-is.
cases:
  - id: comp.route.basic-id
    title: One template stored at a :id path serves every concrete URL with request.params
    area: composing
    feature: parameterized routes
    evidence: documented
    source: "docs reference/composing-pages/Parameterized-Routes §Example (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/users/:id/profile.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:p="https://pagelove.org/1.0">
              <body e:uid="request.params.id">
                <main><p:stamp uid></p:stamp></main>
              </body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - as: anonymous
        request: {method: GET, path: "${P}/users/42/profile.html"}
        expect: {status: 200, body_matches: '<main>\s*42\s*</main>'}
      - as: anonymous
        request: {method: GET, path: "${P}/users/alice/profile.html"}
        expect: {status: 200, body_matches: '<main>\s*alice\s*</main>'}

  - id: comp.route.filename-param
    title: A :slug.html filename captures the name before the extension and requires it
    area: composing
    feature: parameterized routes
    evidence: documented
    source: "docs reference/composing-pages/Parameterized-Routes §Authoring a route (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/pages/:slug.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:p="https://pagelove.org/1.0">
            <body e:slug="request.params.slug"><main id="m"><p:stamp slug></p:stamp></main></body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - as: anonymous
        request: {method: GET, path: "${P}/pages/hello-world.html"}
        expect: {status: 200, body_matches: 'id="m">\s*hello-world\s*<'}
      - name: other extensions do not match the template
        as: anonymous
        request: {method: GET, path: "${P}/pages/hello-world.txt"}
        expect: {status: 404}

