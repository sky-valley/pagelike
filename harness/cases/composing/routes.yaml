        plane: dav
        request: {method: GET, path: "${P}/users/:id/profile.html"}
        expect: {status: 200, body_contains: ["<p:stamp uid>"], body_not_contains: ["LITERAL-7"]}

  - id: comp.route.selector-write-through-stamp
    title: A comment POSTed to a route page lands in the stamped post's data file
    area: composing
    feature: write-through
    evidence: documented
    source: "docs learn/build-a-blog §One page for every post, §Letting readers comment; reference/composing-pages/Parameterized-Routes §Resolution; Stamp §Interaction (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "R-COMP-106. The rule grants POST only on the route pages; the data folder is not even readable."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/data/posts/hello.html"
          body: |
            <!DOCTYPE html>
            <html lang="en"><body>
              <article itemscope itemtype="https://example.test${P}/Post" id="post-hello">
                <meta itemprop="slug" content="hello">
                <meta itemprop="status" content="Published">
                <h1 itemprop="title">Hello, world</h1>
                <ul itemprop="comments" id="comments-hello" class="comment-list"></ul>
              </article>
            </body></html>
        - path: "${P}/posts/:slug.html"
          body: |
            <!DOCTYPE html>
            <html lang="en" xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:p="https://pagelove.org/1.0">
            <body e:post="${[itemtype='https://example.test${P}/Post']:has([itemprop='slug']:value-equals(request.params.slug)):has([itemprop='status']:value-equals('Published'))}.first()">
              <main class="reading post">
                <p:stamp post></p:stamp>
                <div class="post-missing"><h1>Not found</h1></div>
              </main>
            </body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
        - {actor: "*", resource: "${P}/data/*", method: [GET, HEAD], action: Deny}
        - {actor: "*", resource: "${P}/posts/*", method: [POST], selector: "[itemprop='comments']", action: Allow}
    steps:
      - as: anonymous
        request:
          method: POST
          path: "${P}/posts/hello.html"
          headers: {Range: "selector=#comments-hello", Content-Type: "text/html"}
          body: '<li class="comment">Nice post</li>'
        expect: {status: [200, 206]}
      - name: the data file has the comment
        as: author
        plane: dav
        request: {method: GET, path: "${P}/data/posts/hello.html"}
        expect: {status: 200, body_contains: ['<li class="comment">Nice post</li>']}
      - name: the route template does not
        as: author
        plane: dav
        request: {method: GET, path: "${P}/posts/:slug.html"}
        expect: {status: 200, body_not_contains: ["Nice post"]}
      - name: the page composes it back in
        as: anonymous
        request: {method: GET, path: "${P}/posts/hello.html"}
        expect: {status: 200, body_contains: ["Nice post", "Hello, world"]}

  - id: comp.route.selector-write-non-projected-416
    title: A selector write on a route page to an element that is not stamped or included is 416
    area: composing
    feature: write-through
    evidence: documented
    source: "docs reference/composing-pages/Parameterized-Routes §Resolution ('matches an element that is not stamped/included … returns 416') (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/posts/:slug.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:p="https://pagelove.org/1.0">
            <body e:s="request.params.slug"><main><p:stamp s></p:stamp><ul id="native-list"></ul></main></body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, POST], action: Allow}
    steps:
      - name: native element of the template
        as: anonymous
        request:
          method: POST
          path: "${P}/posts/hello.html"
          headers: {Range: "selector=#native-list", Content-Type: "text/html"}
          body: "<li>no</li>"
        expect: {status: 416}
      - name: nothing matches
        as: anonymous
        request:
          method: POST
          path: "${P}/posts/hello.html"
          headers: {Range: "selector=#absent", Content-Type: "text/html"}
          body: "<li>no</li>"
        expect: {status: 416}
      - as: author
        plane: dav
        request: {method: GET, path: "${P}/posts/:slug.html"}
        expect: {status: 200, body_not_contains: ["<li>no</li>"]}

