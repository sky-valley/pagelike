  - id: comp.me.template-dispatched-last
    title: A Context write by an attribute-form method is visible to p:template on the same element
    area: composing
    feature: evaluation order
    evidence: documented
    source: "docs reference/composing-pages/Method-Elements §Attribute form (template dispatched last), §Attribute-form example (Binding/CSS doesNotUnderstand writes Context[messageName]) (snapshot 2026-09-28)"
    confidence: medium
    requires: [sessel, liquid]
    live: true
    notes: "R-COMP-25/63/64. No 'returns' is declared, so the host is not replaced; the attribute is removed and Context.greeting is set for the host subtree."
    site:
      settings: {default_get: allow}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - as: anonymous
        request:
          method: PUT
          path: "${P}/ctx.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html xmlns:t="urn:x-pagelike${P}/Ctx" xmlns:p="https://pagelove.org/1.0">
              <body>
                <main><div id="host" p:template="text/liquid" t:greeting="hi">[{{ greeting }}]</div></main>
                <div hidden itemscope itemtype="https://pagelove.org/Schema">
                  <meta itemprop="type" content="urn:x-pagelike${P}/Ctx">
                  <ul>
                    <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
                      <meta itemprop="name" content="doesNotUnderstand">
                      <div itemprop="implementation" itemscope itemtype="https://pagelove.org/Sessel">
                        <script itemprop="source" type="text/sessel">
                          Context[messageName] = parameters[0] + "!";
                          null
                        </script>
                      </div>
                    </li>
                  </ul>
                </div>
              </body>
            </html>
        expect: {status: [200, 201, 204]}
      - as: anonymous
        request:
          method: GET
          path: "${P}/ctx.html"
          headers: {Range: "selector=#host"}
        expect:
          status: 206
          body_contains: ["[hi!]"]
          body_not_contains: ["t:greeting", "p:template"]

