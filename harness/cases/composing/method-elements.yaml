          body_contains: ["greet: Ada"]
          body_not_contains: ["t:greet", "<div"]

  - id: comp.me.element-args-by-name
    title: Element-form attributes are matched to declared parameters by name; others are ignored
    area: composing
    feature: method elements
    evidence: documented
    source: "docs reference/composing-pages/Method-Elements §Passing arguments (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    site:
      settings: {default_get: allow}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: store the page with its schema
        as: anonymous
        request:
          method: PUT
          path: "${P}/greet.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html xmlns:t="urn:x-pagelike${P}/Greet">
              <body>
                <main><t:greet name="Ada" other="ignored"></t:greet></main>
                <div hidden itemscope itemtype="https://pagelove.org/Schema">
                  <meta itemprop="type" content="urn:x-pagelike${P}/Greet">
                  <ul>
                    <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
                      <meta itemprop="name" content="greet">
                      <meta itemprop="returns" content="https://pagelove.org/Element">
                      <ul>
                        <li itemprop="parameter" itemscope itemtype="https://pagelove.org/Parameter">
                          <meta itemprop="name" content="name">
                          <meta itemprop="type" content="https://schema.host/Text">
                        </li>
                      </ul>
                      <div itemprop="implementation" itemscope itemtype="https://pagelove.org/Sessel">
                        <script itemprop="source" type="text/sessel">
                          new p { "Hello, " + name + "!" }
                        </script>
                      </div>
                    </li>
                  </ul>
                </div>
              </body>
            </html>
        expect: {status: [200, 201, 204]}
      - as: anonymous
        request:
          method: GET
          path: "${P}/greet.html"
          headers: {Range: "selector=main"}
        expect:
          status: 206
          body_contains: ["Hello, Ada!"]
          body_not_contains: ["ignored", "t:greet"]

