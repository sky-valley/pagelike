# Composing: method elements (element and attribute forms).
# Spec: docs/spec/composing.md §10 (R-COMP-60..67). Declarations: area modeling.
# Each case stores its page (with the schema inline) through a public PUT step,
# which registers the schema immediately ("PUT the document containing the
# schema once to register it"); schemas written over WebDAV may take up to 60 s.
# Schema URIs embed ${P} so cases never collide on a shared host.
cases:
  - id: comp.me.sessel-element
    title: A Sessel method element is replaced by the element its implementation returns
    area: composing
    feature: method elements
    evidence: documented
    source: "docs reference/composing-pages/Method-Elements §Example (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    site:
      settings: {default_get: allow}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: store the page with its schema
        as: anonymous
        request:
          method: PUT
          path: "${P}/method-element-demo.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html xmlns:t="urn:x-pagelike${P}/Demo">
              <body>
                <main>
                  <t:hello></t:hello>
                </main>
                <div hidden itemscope itemtype="https://pagelove.org/Schema">
                  <meta itemprop="type" content="urn:x-pagelike${P}/Demo">
                  <ul>
                    <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
                      <meta itemprop="name" content="hello">
                      <meta itemprop="returns" content="https://pagelove.org/Element">
                      <div itemprop="implementation" itemscope itemtype="https://pagelove.org/Sessel">
                        <script itemprop="source" type="text/sessel">
                          new p { "hello from urn:Demo" }
                        </script>
                      </div>
                    </li>
                  </ul>
                </div>
              </body>
            </html>
        expect: {status: [200, 201, 204]}
      - name: read main
        as: anonymous
        request:
          method: GET
          path: "${P}/method-element-demo.html"
          headers: {Range: "selector=main"}
        expect:
          status: 206
          body_contains: ["hello from urn:Demo"]
          body_not_contains: ["t:hello"]

  - id: comp.me.javascript-element
    title: A JavaScript method element returns a DOM node that is spliced in
    area: composing
    feature: method elements
    evidence: documented
    source: "docs reference/composing-pages/Method-Elements §JavaScript example (snapshot 2026-09-28)"
    confidence: high
    requires: [server-js]
    live: true
    site:
      settings: {default_get: allow}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: store the page with its schema
        as: anonymous
        request:
          method: PUT
          path: "${P}/js-method-element-demo.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html xmlns:j="urn:x-pagelike${P}/JsDemo">
              <body>
                <main>
                  <j:hello></j:hello>
                </main>
                <div hidden itemscope itemtype="https://pagelove.org/Schema">
                  <meta itemprop="type" content="urn:x-pagelike${P}/JsDemo">
                  <ul>
                    <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
                      <meta itemprop="name" content="hello">
                      <meta itemprop="returns" content="https://pagelove.org/Element">
                      <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                        <script itemprop="source" type="module">export default () => { const d = new DOMParser().parseFromString("<p>hello from JavaScript</p>", "text/html"); return d.querySelector("p"); };</script>
                      </div>
                    </li>
                  </ul>
                </div>
              </body>
            </html>
        expect: {status: [200, 201, 204]}
      - name: read main
        as: anonymous
        request:
          method: GET
          path: "${P}/js-method-element-demo.html"
          headers: {Range: "selector=main"}
        expect:
          status: 206
          body_contains: ["hello from JavaScript"]
          body_not_contains: ["j:hello"]

