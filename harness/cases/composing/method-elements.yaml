      - name: store the page with its schema
        as: anonymous
        request:
          method: PUT
          path: "${P}/attr-form-demo.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html xmlns:t="urn:x-pagelike${P}/AttrDemo">
              <body>
                <main>
                  <div t:greet="Ada"></div>
                </main>
                <div hidden itemscope itemtype="https://pagelove.org/Schema">
                  <meta itemprop="type" content="urn:x-pagelike${P}/AttrDemo">
                  <ul>
                    <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
