  - id: comp.pag.after-template
    title: Pagination runs after bindings and templates, over the rendered children
    area: composing
    feature: pagination
    evidence: documented
    source: "docs reference/composing-pages/Pagination §When to reach for it ('runs after includes, expression bindings, and templates') (snapshot 2026-09-28)"
    confidence: high
    requires: [liquid]
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/data.html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <i data-g="${P}">I1</i><i data-g="${P}">I2</i><i data-g="${P}">I3</i><i data-g="${P}">I4</i><i data-g="${P}">I5</i>
            </body></html>
        - path: "${P}/gen.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS"><head><title>G</title></head><body>
            <ul id="gen" r:items="[data-g='${P}']" p:template="text/liquid" p:paginate="3">{% for i in items %}<li>item</li>{% endfor %}</ul>
            </body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - name: page 1 has three rendered items
        as: anonymous
        request:
          method: GET
          path: "${P}/gen.html"
          headers: {Range: "selector=#gen > li:nth-child(3)"}
        expect: {status: 206}
      - name: and not a fourth
        as: anonymous
        request:
          method: GET
          path: "${P}/gen.html"
          headers: {Range: "selector=#gen > li:nth-child(4)"}
        expect: {status: 416}
      - name: page 2 has the remaining two
        as: anonymous
        request:
          method: GET
          path: "${P}/gen.html?paginate:page=2"
          headers: {Range: "selector=#gen > li:nth-child(2)"}
        expect: {status: 206}

  - id: comp.pag.link-header
    title: Pagination also emits RFC 8288 Link headers
    area: composing
    feature: pagination links
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/comp-pag-links-and-slice.json and harness/observations/live-2026-09-29-reconcile-composing-liquid/run2/comp-pag-probe-0929-single-with-id.json (live 2026-09-29); docs recipes/paginating-a-list §Navigation links"
    confidence: high
    requires: []
    live: true
    notes: >-
      The runner reads the first Link field only; in PageLove's order (first, last, prev, next) that is
      rel=first. R-COMP-132 as reconciled (docs/compat/decisions-2026-09-29/composing-liquid.md,
      adopt-live): the URL is path-absolute, uses the id-prefixed page parameter and the value carries a
      title parameter. This case was not run live itself.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/contacts.html"
          body: |
            <!DOCTYPE html>
            <html><head><title>Contacts</title></head><body>
            <ul id="contacts" xmlns:p="https://pagelove.org/1.0" p:paginate="3">
            <li>Alice</li><li>Bob</li><li>Carol</li><li>Dave</li><li>Eve</li><li>Frank</li><li>Grace</li>
            </ul>
            </body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - as: anonymous
        request: {method: GET, path: "${P}/contacts.html?paginate:page=2"}
        expect:
          status: 200
          header_matches: {Link: '^<${P}/contacts\.html\?paginate:contacts:page=1>; rel="first"; title="contacts"'}
