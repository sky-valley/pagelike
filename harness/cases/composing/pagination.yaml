# Composing: p:paginate.
# Spec: docs/spec/composing.md §16 (R-COMP-130..135).
# The contacts fixture reproduces the docs example: 7 items, so length 3 gives
# 3 pages and page 2 is Dave, Eve, Frank.
cases:
  - id: comp.pag.links-and-slice
    title: Page 2 of a paginated list returns its slice and first/last/prev/next links that keep the request's other parameters
    area: composing
    feature: pagination
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/comp-pag-links-and-slice.json; harness/observations/live-2026-09-29-reconcile-composing-liquid/run1-probes/comp-pag-probe-0929-single-with-id.json (live 2026-09-29)"
    confidence: high
    requires: []
    live: true
    notes: >-
      R-COMP-132. Link form as live (path, paginate:<id>:page, order first/last/prev/next, title),
      but the request's other parameters are kept, as the docs' recipe shows: PageLove drops them,
      so following "next" loses the filter and the page length. Kept standard
      (docs/compat/decisions-2026-09-29/serialization.md, "Integration"); the .live sibling measures it.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/contacts.html"
          body: |
            <!DOCTYPE html>
            <html>
            <head><title>Contacts</title></head>
            <body>
            <ul id="contacts" xmlns:p="https://pagelove.org/1.0" p:paginate="10">
            <li>Alice</li>
            <li>Bob</li>
            <li>Carol</li>
            <li>Dave</li>
            <li>Eve</li>
            <li>Frank</li>
            <li>Grace</li>
            </ul>
            </body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - as: anonymous
        request: {method: GET, path: "${P}/contacts.html?paginate:page=2&paginate:length=3"}
        expect:
          status: 200
          body_contains:
            - "<li>Dave</li>"
            - "<li>Eve</li>"
            - "<li>Frank</li>"
            - '<title>Contacts</title><link rel="first" href="${P}/contacts.html?paginate:length=3&amp;paginate:contacts:page=1" title="contacts"><link rel="last" href="${P}/contacts.html?paginate:length=3&amp;paginate:contacts:page=3" title="contacts"><link rel="prev" href="${P}/contacts.html?paginate:length=3&amp;paginate:contacts:page=1" title="contacts"><link rel="next" href="${P}/contacts.html?paginate:length=3&amp;paginate:contacts:page=3" title="contacts"></head>'
          body_not_contains: ["Alice", "Carol", "Grace", "p:paginate"]
          header_matches: {Link: '^<${P}/contacts\.html\?paginate:length=3&paginate:contacts:page=1>; rel="first"; title="contacts"'}

  - id: comp.pag.links-and-slice.live
    title: "Live PageLove: Page 2 of a paginated list returns its slice and first/last/prev/next links naming the paginator's own page parameter"
    area: composing
    feature: pagination
    status: live-divergence
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/comp-pag-links-and-slice.json; harness/observations/live-2026-09-29-reconcile-composing-liquid/run1-probes/comp-pag-probe-0929-single-with-id.json (live 2026-09-29)"
    confidence: high
    requires: []
    live: true
    notes: >-
      Measures a kept difference (keep-standard, docs/compat/decisions-2026-09-29/serialization.md,
      "Integration"): live PageLove drops every other query parameter from pagination links;
      pagelike keeps them. Runs only against --target live.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/contacts.html"
          body: |
            <!DOCTYPE html>
            <html>
            <head><title>Contacts</title></head>
            <body>
            <ul id="contacts" xmlns:p="https://pagelove.org/1.0" p:paginate="10">
            <li>Alice</li>
            <li>Bob</li>
            <li>Carol</li>
            <li>Dave</li>
            <li>Eve</li>
            <li>Frank</li>
            <li>Grace</li>
            </ul>
            </body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - as: anonymous
        request: {method: GET, path: "${P}/contacts.html?paginate:page=2&paginate:length=3"}
        expect:
          status: 200
          body_contains:
            - "<li>Dave</li>"
            - "<li>Eve</li>"
            - "<li>Frank</li>"
            - '<title>Contacts</title><link rel="first" href="${P}/contacts.html?paginate:contacts:page=1" title="contacts"><link rel="last" href="${P}/contacts.html?paginate:contacts:page=3" title="contacts"><link rel="prev" href="${P}/contacts.html?paginate:contacts:page=1" title="contacts"><link rel="next" href="${P}/contacts.html?paginate:contacts:page=3" title="contacts"></head>'
          body_not_contains: ["Alice", "Carol", "Grace", "p:paginate", "paginate:length"]
          header_matches: {Link: '^<${P}/contacts\.html\?paginate:contacts:page=1>; rel="first"; title="contacts"'}

