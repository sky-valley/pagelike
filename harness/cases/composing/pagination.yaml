  - id: comp.pag.multiple-without-ids-422
    title: Several paginators without ids are not an error; each is paginated by the unprefixed parameters
    area: composing
    feature: pagination errors
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/comp-pag-multiple-without-ids-422.json (live 2026-09-29)"
    confidence: high
    requires: []
    live: true
    notes: >-
      R-COMP-134 as reconciled (docs/compat/decisions-2026-09-29/composing-liquid.md, adopt-live). The docs'
      422 is not what PageLove does: it serves 200 and paginates both lists (the id keeps its old name
      for history). The source has no <head>, so the links appear only in the Link header; every
      paginator's links repeat paginate:page=N. comp.pag.probe-0929.without-ids covers page 2 and a
      page mixing an id-less paginator with one that has an id.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/two.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body>
            <ul p:paginate="2"><li>a</li><li>b</li><li>c</li></ul>
            <ul p:paginate="2"><li>d</li><li>e</li><li>f</li></ul>
            </body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - as: anonymous
        request: {method: GET, path: "${P}/two.html"}
        expect:
          status: 200
          body_contains: ["<ul><li>a</li><li>b</li></ul>", "<ul><li>d</li><li>e</li></ul>"]
          body_not_contains: ["<li>c</li>", "<li>f</li>", "<link", "p:paginate"]
          header_matches: {Link: '^<${P}/two\.html\?paginate:page=1>; rel="first"'}

