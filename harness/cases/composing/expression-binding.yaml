  - id: comp.eb.from-self-vs-site
    title: A selector literal is site-wide unless narrowed with 'from self'
    area: composing
    feature: expression binding
    evidence: documented
    source: "docs reference/composing-pages/Expression-Binding §Scope example; languages/sessel/learn/querying §The from clause (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "R-COMP-36. Scalars stamped as text."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/other.html"
          body: |
            <!DOCTYPE html>
            <html><body><div class="item" data-k="${P}">elsewhere</div></body></html>
        - path: "${P}/page.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:p="https://pagelove.org/1.0">
            <body e:site="${div.item[data-k='${P}']}.count()" e:local="(${div.item[data-k='${P}']} from self).count()">
              <div class="item" data-k="${P}">here 1</div>
              <div class="item" data-k="${P}">here 2</div>
              <p id="l"><p:stamp local></p:stamp></p>
              <p id="s"><p:stamp site></p:stamp></p>
            </body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - name: from self counts this document only
        as: anonymous
        request:
          method: GET
          path: "${P}/page.html"
          headers: {Range: "selector=#l"}
        expect: {status: 206, body_matches: 'id="l">\s*2\s*<'}
      - name: without from the whole site is searched
        as: anonymous
        request:
          method: GET
          path: "${P}/page.html"
          headers: {Range: "selector=#s"}
        expect: {status: 206, body_matches: 'id="s">\s*3\s*<'}

  - id: comp.eb.request-path
    title: request.path is available to expression bindings
    area: composing
    feature: request object
    evidence: documented
    source: "docs languages/sessel/reference/syntax §Context variables (request.path) (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/page.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:p="https://pagelove.org/1.0">
            <body e:where="request.path"><main><p:stamp where></p:stamp></main></body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - as: anonymous
        request: {method: GET, path: "${P}/page.html?x=1"}
        expect:
          status: 200
          body_contains: ["${P}/page.html"]
          body_not_contains: ["x=1"]

  - id: comp.eb.anonymous-auth-empty-private
    title: Reading request.auth for an anonymous request is empty, not an error, and makes the page private
    area: composing
    feature: request object
    evidence: documented
    source: "docs languages/sessel/reference/syntax §Authenticated identity in composition (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel, liquid]
    live: true
    notes: "R-COMP-24/150."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/page.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:p="https://pagelove.org/1.0">
            <body e:who="request.auth.claims.email">
              <div id="w" p:template="text/liquid">[{{ request.auth.claims.email }}]</div>
            </body>
            </html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - as: anonymous
        request: {method: GET, path: "${P}/page.html"}
        expect:
          status: 200
          body_contains: ['<div id="w">[]</div>']
          header_contains: {Cache-Control: private}

  - id: comp.eb.template-attr-order
