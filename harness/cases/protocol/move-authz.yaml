# MOVE authorization: default-deny, the three checks, MOVE-rule selector
# normalization, whole-document authorization
# (spec: docs/spec/protocol.md §9, R-PROTO-96..99). Anonymous denials are 401.
cases:
  - id: protocol.move-authz.default-deny-even-with-default-get
    title: MOVE with no matching rule is refused even on a host that allows unmatched reads
    area: protocol
    feature: MOVE authorization
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Authorization (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: false
    notes: R-PROTO-96. Local-only because it fixes the host default-GET mode; other cases cover the live path.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/board.html"
          body: &board |
            <!DOCTYPE html>
            <html><body>
            <section class="lane" id="lane-todo"><article class="card" id="card-1">One</article><article class="card" id="card-2">Two</article><article class="card" id="card-3">Three</article></section>
            <section class="lane" id="lane-done"><article class="card" id="card-4">Four</article></section>
            <p id="note">Note</p>
            </body></html>
    steps:
      - name: reads are open
        as: anonymous
        request: {method: GET, path: "${P}/board.html"}
        expect: {status: 200}
      - name: MOVE is not
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 401}

  - id: protocol.move-authz.move-rule-alone-insufficient
    title: A MOVE rule alone does not authorize an element move (check 2 fails)
    area: protocol
    feature: MOVE authorization three checks
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §The three checks (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: R-PROTO-96.
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, MOVE], action: Allow}
    steps:
      - name: denied
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 401}
      - name: nothing moved
        as: anonymous
        request:
          method: GET
          path: "${P}/board.html"
          headers: {Range: "selector=#lane-todo"}
        expect: {status: 206, body_contains: ['id="card-3"']}

  - id: protocol.move-authz.each-check-required
    title: Each of the MOVE, DELETE and POST checks is required
    area: protocol
    feature: MOVE authorization three checks
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §The three checks, §Denials (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: >-
      R-PROTO-96. Three sub-documents each miss exactly one check: no POST on
      ${P}/no-post.html, no DELETE on ${P}/no-delete.html, no MOVE on ${P}/no-move.html.
    site:
      files:
        - {path: "${P}/no-post.html", body: *board}
        - {path: "${P}/no-delete.html", body: *board}
        - {path: "${P}/no-move.html", body: *board}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET], action: Allow}
        - {actor: "*", resource: "${P}/no-post.html", method: [MOVE], action: Allow}
        - {actor: "*", resource: "${P}/no-post.html", method: [DELETE], selector: ".card", action: Allow}
        - {actor: "*", resource: "${P}/no-delete.html", method: [MOVE], action: Allow}
        - {actor: "*", resource: "${P}/no-delete.html", method: [POST], selector: ".lane", action: Allow}
        - {actor: "*", resource: "${P}/no-move.html", method: [DELETE], selector: ".card", action: Allow}
        - {actor: "*", resource: "${P}/no-move.html", method: [POST], selector: ".lane", action: Allow}
    steps:
      - name: missing POST (check 3)
        as: anonymous
        request:
          method: MOVE
          path: "${P}/no-post.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/no-post.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 401}
      - name: missing DELETE (check 2)
        as: anonymous
        request:
          method: MOVE
          path: "${P}/no-delete.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/no-delete.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 401}
      - name: missing MOVE (check 1)
        as: anonymous
        request:
          method: MOVE
          path: "${P}/no-move.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/no-move.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 401}

