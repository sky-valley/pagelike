  - id: protocol.move-authz.deny-move-rule-with-selector-widened
    title: A Deny MOVE rule with a selector is widened to the whole document
    area: protocol
    feature: MOVE rule normalization
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §A MOVE rule must not carry a selector (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: >-
      R-PROTO-97. The moved card does not match .locked, yet the MOVE is refused because
      the Deny applies to the whole resource (deny wins at equal actor specificity).
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, MOVE, DELETE, POST], action: Allow}
        - {actor: "*", resource: "${P}/*", method: [MOVE], selector: ".locked", action: Deny}
    steps:
      - name: refused for an unrelated element
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 401}

  - id: protocol.move-authz.deny-with-selector-widens-co-listed-methods
    title: A Deny rule listing MOVE and DELETE with a selector refuses DELETE for the whole document too
    area: protocol
    feature: MOVE rule normalization
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §A MOVE rule must not carry a selector (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: R-PROTO-97. Cross-area (permissions) because the effect is observed on a DELETE.
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, DELETE], action: Allow}
        - {actor: "*", resource: "${P}/*", method: [MOVE, DELETE], selector: ".card", action: Deny}
    steps:
      - name: deleting a non-card element is refused
        as: anonymous
        request:
          method: DELETE
          path: "${P}/board.html"
          headers: {Range: "selector=#note"}
        expect: {status: 401}
      - name: the note is still there
        as: anonymous
        request:
          method: GET
          path: "${P}/board.html"
          headers: {Range: "selector=#note"}
        expect: {status: 206}

  - id: protocol.move-authz.post-rule-on-container-covers-all-placements
    title: One POST rule on the lane authorizes before/after its children (keyed on the anchor's parent)
    area: protocol
    feature: MOVE authorization three checks
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §The three checks, §Example: allowing editors to reorder cards (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: R-PROTO-96.
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules: &three_checks
        - {actor: "*", resource: "${P}/*", method: [GET, MOVE], action: Allow}
        - {actor: "*", resource: "${P}/*", method: [DELETE], selector: ".card", action: Allow}
        - {actor: "*", resource: "${P}/*", method: [POST], selector: ".lane", action: Allow}
    steps:
      - name: before a card in another lane
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-1"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#card-4; placement=before"
        expect: {status: 204}
      - name: after a card in the same lane
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-2"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#card-3; placement=after"
        expect: {status: 204}
      - name: resulting order
        as: anonymous
        request:
          method: GET
          path: "${P}/board.html"
          headers: {Range: "selector=#lane-done"}
        expect:
          status: 206
          body_html: '<section class="lane" id="lane-done"><article class="card" id="card-1">One</article><article class="card" id="card-4">Four</article></section>'

