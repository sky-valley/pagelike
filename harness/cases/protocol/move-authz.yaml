  - id: protocol.move-authz.fail-closed-when-unreadable
    title: A non-matching source is reported as a denial, not 416, when the actor cannot read the document
    area: protocol
    feature: MOVE authorization fail closed
    evidence: inferred
    source: "docs reference/reading-and-writing/MOVE-method §Denials (fails closed); PUT-method \"Absence and denial are distinct\" (snapshot 2026-09-28)"
    confidence: low
    requires: []
    live: true
    notes: >-
      R-PROTO-99 evaluation order (P-15). Live PageLove answers 416 here
      (harness/observations/live-2026-09-28/protocol-move-authz-fail-closed-when-unreadable.json):
      a selector-existence oracle on a document the actor may not read. pagelike keeps failing
      closed (docs/compat/decisions.md, keep-documented-security);
      protocol.move-authz.fail-closed-when-unreadable.live measures the divergence.
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET], action: Deny}
        - {actor: "*", resource: "${P}/*", method: [MOVE, DELETE, POST], action: Allow}
    steps:
      - name: absent source, unreadable page
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-99"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 401}

