  - id: protocol.options.selector-deny-removes-method
    title: A selector-scoped Deny at the same actor tier removes the method from that selector's Allow
    area: protocol
    feature: OPTIONS selector-scoped response
    evidence: inferred
    source: "docs reference/permissions/AuthorizationRule §Conflict resolution; reference/protocol/OPTIONS-method §Selector-scoped OPTIONS (snapshot 2026-09-28)"
    confidence: medium
    requires: []
    live: true
    notes: >-
      R-PROTO-12. Deny wins at equal specificity (both rules use actor *). Live PageLove
      advertises PUT at the locked selector and answers the multipart form 204, consistent with
      its not enforcing selector-scoped denies against resource-level allows
      (harness/observations/live-2026-09-28/protocol-options-selector-deny-removes-method.json).
      pagelike enforces the deny and advertises what it enforces (docs/compat/decisions.md,
      keep-documented-security); protocol.options.selector-deny-removes-method.live measures it.
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1 class="locked">Title</h1><p>Body</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, PUT], action: Allow}
        - {actor: "*", resource: "${P}/*", method: [PUT], selector: "h1.locked", action: Deny}
    steps:
      - name: PUT not allowed at the locked selector
        as: anonymous
        request:
          method: OPTIONS
          path: "${P}/doc.html"
          headers: {Range: "selector=h1.locked"}
        expect:
          status: 200
          header_matches: {Allow: '^(?:(?:GET|HEAD|DELETE|POST|OPTIONS)(?:, ?|$))+$'}
      - name: multipart lists the locked selector as its own part
        as: anonymous
        request:
          method: OPTIONS
          path: "${P}/doc.html"
          headers: {Accept: "multipart/mixed"}
        expect:
          status: 207
          body_contains: ["h1.locked"]

