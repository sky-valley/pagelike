  - id: protocol.options.selector-scoped-flat
    title: Selector-scoped OPTIONS adds the methods granted by rules for that selector
    area: protocol
    feature: OPTIONS selector-scoped response
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/protocol-options-selector-scoped-flat.json (the flat document answer lists PUT and POST too); docs reference/protocol/OPTIONS-method §Selector-scoped OPTIONS, §Multipart OPTIONS example (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: >-
      R-PROTO-12/15. The documented example pairs document-level GET with selector-level
      POST and PUT on h1. Matching a Range selector to a rule by selector string is
      inferred (P-5). The live run showed the flat document answer is the union of the
      document-level and selector-scoped grants (R-PROTO-12 superseded, docs/compat/decisions.md).
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>Title</h1><p>Body</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET], action: Allow}
        - {actor: "*", resource: "${P}/*", method: [PUT, POST], selector: "h1", action: Allow}
    steps:
      - name: selector-scoped Allow contains PUT and POST
        as: anonymous
        request:
          method: OPTIONS
          path: "${P}/doc.html"
          headers: {Range: "selector=h1"}
        expect:
          status: 200
          header_matches: {Allow: '^(?:.*\bPUT\b.*\bPOST\b.*|.*\bPOST\b.*\bPUT\b.*)$'}
      - name: selector-scoped Allow still carries the document-level GET and OPTIONS
        as: anonymous
        request:
          method: OPTIONS
          path: "${P}/doc.html"
          headers: {Range: "selector=h1"}
        expect:
          status: 200
          header_matches: {Allow: '^(?:.*\bGET\b.*\bOPTIONS\b.*|.*\bOPTIONS\b.*\bGET\b.*)$'}
      - name: document-level Allow also lists what selector-scoped rules grant
        as: anonymous
        request: {method: OPTIONS, path: "${P}/doc.html"}
        expect:
          status: 200
          headers: {Allow: "GET, HEAD, PUT, POST, OPTIONS", Vary: "Authorization, Accept"}

