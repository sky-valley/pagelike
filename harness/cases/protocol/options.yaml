# OPTIONS capability discovery (spec: docs/spec/protocol.md §2, R-PROTO-10..25)
#
# Allow-header assertions are order-insensitive regexes (C-3). Where both the
# presence of some methods and the absence of others matter, the same request
# is sent twice with different regexes.
#   presence of GET and OPTIONS : '^(?:.*\bGET\b.*\bOPTIONS\b.*|.*\bOPTIONS\b.*\bGET\b.*)$'
#   only read-only tokens       : '^(?:(?:GET|HEAD|OPTIONS)(?:, ?|$))+$'
cases:
  - id: protocol.options.flat-document-level
    title: Flat OPTIONS answers 200 with the document-level Allow set, Vary and no body
    area: protocol
    feature: OPTIONS flat document-level response
    evidence: documented
    source: "docs reference/protocol/OPTIONS-method §Standard response, §When there are no selector-scoped rules (snapshot 2026-09-28); read-probes.json case capabilities"
    confidence: high
    requires: []
    live: true
    notes: >-
      R-PROTO-11/12/14. Live docs.pagelove.com answered 200, Allow HEAD, GET, OPTIONS,
      Vary Authorization, Accept, empty body.
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>Title</h1><ul><li>a</li><li>b</li></ul></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET], action: Allow}
    steps:
      - name: Allow contains GET and OPTIONS
        as: anonymous
        request: {method: OPTIONS, path: "${P}/doc.html"}
        expect:
          status: 200
          headers: {Vary: "Authorization, Accept"}
          header_matches: {Allow: '^(?:.*\bGET\b.*\bOPTIONS\b.*|.*\bOPTIONS\b.*\bGET\b.*)$'}
          body: ""
      - name: Allow contains no write methods and no literal star
        as: anonymous
        request: {method: OPTIONS, path: "${P}/doc.html"}
        expect:
          status: 200
          header_matches: {Allow: '^(?:(?:GET|HEAD|OPTIONS)(?:, ?|$))+$'}

  - id: protocol.options.no-existence-check
    title: OPTIONS on a path with no document answers from rules, never 404
    area: protocol
    feature: OPTIONS never checks existence
    evidence: documented
    source: "docs reference/protocol/OPTIONS-method §OPTIONS never checks whether the target exists (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: R-PROTO-10.
    site:
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET], action: Allow}
    steps:
      - name: missing document still gets a normal answer
        as: anonymous
        request: {method: OPTIONS, path: "${P}/does-not-exist.html"}
        expect:
          status: 200
          header_matches: {Allow: '^(?:.*\bGET\b.*\bOPTIONS\b.*|.*\bOPTIONS\b.*\bGET\b.*)$'}
      - name: missing document with a selector range is not a range error either
        as: anonymous
        request:
          method: OPTIONS
          path: "${P}/does-not-exist.html"
          headers: {Range: "selector=h1"}
        expect:
          status: 200
          header_matches: {Allow: '\bOPTIONS\b'}

