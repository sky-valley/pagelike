    confidence: high
    requires: [sessel]
    live: true
    notes: "The id keeps its original name; R-PROTO-75's 400 for an empty body is superseded (docs/compat/decisions.md)."
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>A</h1></body></html>
      rules:
