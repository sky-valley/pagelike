  - id: protocol.query-sessel.not-granted-by-get
    title: Read access to the document does not authorize a Sessel QUERY (anonymous gets 401)
    area: protocol
    feature: QUERY sessel authorization
    evidence: live-observed
    source: "read-probes.json case query-sessel (anonymous 401 on docs.pagelove.com where GET and css QUERY succeed, 2026-09-28)"
    confidence: medium
    requires: [sessel]
    live: true
    notes: >-
      R-PROTO-74, C-11. The live probe was on a default-GET allow host with no explicit
      rules; here an explicit GET rule grants reads and the css QUERY succeeds while the
      Sessel QUERY is refused.
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>A</h1></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET], action: Allow}
    steps:
      - name: css mode is a read
        as: anonymous
        request:
          method: QUERY
          path: "${P}/doc.html"
          headers: {Content-Type: "text/css-selector"}
          body: "h1"
        expect: {status: 206}
      - name: sessel mode is refused
        as: anonymous
        request:
          method: QUERY
          path: "${P}/doc.html"
          headers: {Content-Type: "text/sessel"}
          body: "1 + 1"
        expect:
          status: 401
          header_matches: {Content-Type: '^text/html'}

