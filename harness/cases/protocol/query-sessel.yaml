    steps:
      - name: empty body
        as: anonymous
        request:
          method: QUERY
          path: "${P}/doc.html"
          headers: {Content-Type: "text/sessel"}
          body: ""
        expect:
          status: 422
          header_matches: {Content-Type: "^text/html$"}
          body_contains: ['<p itemprop="description">Invalid path: QUERY method requires a body containing the sessel expression</p>']
