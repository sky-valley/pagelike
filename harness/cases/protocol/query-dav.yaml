    area: protocol
    feature: QUERY errors (authoring plane)
    evidence: documented
    source: "docs reference/protocol/QUERY §CSS-selector mode, Errors (snapshot 2026-09-28)"
    confidence: high
    requires: [webdav]
    live: true
    notes: R-PROTO-57.
    steps:
      - name: missing document
        as: author
        plane: dav
        request:
          method: QUERY
          path: "${P}/nope.html"
          headers: {Content-Type: "text/css-selector"}
          body: "h1"
        expect: {status: 404}
