  - id: protocol.webdav.put-if-match-content-tag
    title: If-Match with the content tag guards a dav PUT (success, then 412 once stale)
    area: protocol
    feature: WebDAV conditional writes
    evidence: demo-source
    source: "pagelove-dev/skills/pagelove-dev/SKILL.md@b489923:160-170; references/cross-platform-command-recipes.md@b489923:269-316"
    confidence: high
    requires: [webdav]
    live: true
    notes: R-PROTO-114/119.
    site:
      files:
        - path: "${P}/dav/a.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>A</h1></body></html>
    steps:
      - name: content tag
        as: author
        plane: dav
        request: {method: GET, path: "${P}/dav/a.html"}
        expect: {status: 200}
        capture: {ctag: header.ETag}
      - name: guarded write succeeds
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/dav/a.html"
          headers: {Content-Type: "text/html", If-Match: "${ctag}"}
          body: |
            <!DOCTYPE html>
            <html><body><h1>A2</h1></body></html>
        expect: {status: [200, 204]}
      - name: same tag is now stale
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/dav/a.html"
          headers: {Content-Type: "text/html", If-Match: "${ctag}"}
          body: |
            <!DOCTYPE html>
            <html><body><h1>A3</h1></body></html>
        expect: {status: 412}
      - name: content is A2
        as: author
        plane: dav
        request: {method: GET, path: "${P}/dav/a.html"}
        expect: {status: 200, body_contains: ["A2"], body_not_contains: ["A3"]}

