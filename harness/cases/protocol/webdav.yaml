    area: protocol
    feature: WebDAV PROPFIND
    evidence: documented
    source: "docs reference/protocol/WebDAV §Directory listings and revalidation (\"Depth: 1 (the default when no Depth header is sent)\") (snapshot 2026-09-28)"
    confidence: high
    requires: [webdav]
    live: true
    notes: R-PROTO-117, C-21 (RFC 4918 and x/net/webdav default to infinity).
    site:
      files:
        - path: "${P}/dav/a.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>A</h1></body></html>
    steps:
