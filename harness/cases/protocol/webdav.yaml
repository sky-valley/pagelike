  - id: protocol.webdav.get-is-byte-exact
    title: A WebDAV PUT of HTML stores and echoes PageLove's serialized form, and a dav GET returns exactly those bytes
    area: protocol
    feature: WebDAV GET
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/protocol-webdav-get-is-byte-exact.json, harness/observations/live-2026-09-29-confirm/protocol-webdav-get-is-byte-exact-live.json, harness/observations/live-2026-09-29-serialize/ (host live-test-host); supersedes R-PROTO-113's byte-for-byte storage"
    confidence: high
    requires: [webdav]
    live: true
    notes: >-
      LO-15 (adopt-live, docs/compat/decisions-2026-09-29/serialization.md). The markup is
      deliberately irregular. The demo deploy scripts' cmp read-back (pagelove-shop
      deploy-pagelove.sh, beta-js verify-deploy.sh) only holds for sources already in this form.
      The former .live sibling is folded in.
    steps:
      - name: upload irregular markup
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/raw.html"
          headers: {Content-Type: "text/html"}
          body: "<HTML><Body class=x ><h1   id='a'>Hi</h1><p>{{ 1 | plus: 1 }}<!-- keep --></Body></HTML>"
        expect:
          status: 201
          header_matches: {Content-Type: "^text/html$"}
          body: '<html><body class="x"><h1 id="a">Hi</h1><p>{{ 1 | plus: 1 }}<!-- keep --></p></body></html>'
      - name: read back
        as: author
        plane: dav
        request: {method: GET, path: "${P}/raw.html"}
        expect:
          status: 200
          body: '<html><body class="x"><h1 id="a">Hi</h1><p>{{ 1 | plus: 1 }}<!-- keep --></p></body></html>'

