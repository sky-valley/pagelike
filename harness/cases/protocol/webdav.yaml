# WebDAV authoring plane: PROPFIND revalidation, ETag semantics, writes, errors
# (spec: docs/spec/protocol.md §10, R-PROTO-110..124)
cases:
  - id: protocol.webdav.propfind-collection
    title: PROPFIND on a collection is 207 with an ETag header, Vary Depth and getetag properties
    area: protocol
    feature: WebDAV PROPFIND
    evidence: documented
    source: "docs reference/protocol/WebDAV §Directory listings and revalidation (snapshot 2026-09-28)"
    confidence: high
    requires: [webdav]
    live: true
    notes: R-PROTO-117/118.
    site:
      files:
        - path: "${P}/dav/a.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>A</h1></body></html>
        - path: "${P}/dav/b.css"
          content_type: text/css
          body: "h1 { color: red; }"
    steps:
      - name: depth 1 listing
        as: author
        plane: dav
        request:
          method: PROPFIND
          path: "${P}/dav/"
          headers: {Depth: "1"}
        expect:
          status: 207
          headers_present: [ETag]
          header_matches: {Vary: '(?i)\bDepth\b'}
          body_contains: ["getetag", "a.html", "b.css"]

