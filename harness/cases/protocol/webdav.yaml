  - id: protocol.webdav.tag-changes-on-child-add-edit-remove
    title: A collection's listing tag changes when a child is added, edited or removed
    area: protocol
    feature: WebDAV PROPFIND revalidation
    evidence: documented
    source: "docs reference/protocol/WebDAV §Directory listings and revalidation (snapshot 2026-09-28)"
    confidence: high
    requires: [webdav]
    live: true
    notes: R-PROTO-118.
    site:
      files:
        - path: "${P}/dav/a.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>A</h1></body></html>
        - path: "${P}/dav/b.css"
          content_type: text/css
          body: "h1 { color: red; }"
    steps:
      - name: initial listing
        as: author
        plane: dav
        request: {method: PROPFIND, path: "${P}/dav/", headers: {Depth: "1"}}
        expect: {status: 207}
        capture: {t1: header.ETag}
      - name: add a child
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/dav/c.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html><body><h1>C</h1></body></html>
        expect: {status: 201}
      - name: listing changed after add
        as: author
        plane: dav
        request: {method: PROPFIND, path: "${P}/dav/", headers: {Depth: "1", If-None-Match: "${t1}"}}
        expect: {status: 207, etag_differs: "${t1}", body_contains: ["c.html"]}
        capture: {t2: header.ETag}
      - name: edit a child
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/dav/a.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html><body><h1>A edited</h1></body></html>
        expect: {status: [200, 204]}
      - name: listing changed after edit
        as: author
        plane: dav
        request: {method: PROPFIND, path: "${P}/dav/", headers: {Depth: "1", If-None-Match: "${t2}"}}
        expect: {status: 207, etag_differs: "${t2}"}
        capture: {t3: header.ETag}
      - name: remove a child
        as: author
        plane: dav
        request: {method: DELETE, path: "${P}/dav/b.css"}
        expect: {status: [200, 204]}
      - name: listing changed after remove
        as: author
        plane: dav
        request: {method: PROPFIND, path: "${P}/dav/", headers: {Depth: "1", If-None-Match: "${t3}"}}
        expect: {status: 207, etag_differs: "${t3}", body_not_contains: ["b.css"]}

  - id: protocol.webdav.tag-ignores-outside-changes
    title: A change outside the collection does not invalidate its listing tag
    area: protocol
    feature: WebDAV PROPFIND revalidation
    evidence: inferred
    source: "docs reference/protocol/WebDAV §Directory listings and revalidation (\"if nothing in the directory has changed, the server answers 304\") (snapshot 2026-09-28)"
    confidence: medium
    requires: [webdav]
    live: true
    notes: R-PROTO-118. Guards against a host-wide generation counter used as the tag.
    site:
      files:
        - path: "${P}/dav/a.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>A</h1></body></html>
        - path: "${P}/elsewhere/x.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>X</h1></body></html>
    steps:
      - name: listing
        as: author
        plane: dav
        request: {method: PROPFIND, path: "${P}/dav/", headers: {Depth: "1"}}
        expect: {status: 207}
        capture: {t1: header.ETag}
      - name: change another collection
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/elsewhere/x.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html><body><h1>X changed</h1></body></html>
        expect: {status: [200, 204]}
      - name: still not modified
        as: author
        plane: dav
        request: {method: PROPFIND, path: "${P}/dav/", headers: {Depth: "1", If-None-Match: "${t1}"}}
        expect: {status: 304}

