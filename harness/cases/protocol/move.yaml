  - id: protocol.move.if-match-stale-412
    title: A conditional MOVE with a stale document ETag is 412 and changes nothing
    area: protocol
    feature: MOVE conditional request
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Concurrency (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: >-
      R-PROTO-100, C-13 (the kanban app reports conditional writes failing on an older
      build; the docs are followed).
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules: *broad
    steps:
      - name: read document ETag
        as: anonymous
        request: {method: GET, path: "${P}/board.html"}
        expect: {status: 200, headers_present: [ETag]}
        capture: {e1: header.ETag}
      - name: someone else edits the document
        as: anonymous
        request:
          method: POST
          path: "${P}/board.html"
          headers: {Range: "selector=#lane-done", Content-Type: "text/html"}
          body: '<article class="card" id="card-5">Five</article>'
        expect: {status: 206}
      - name: stale conditional move
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#lane-done; placement=append"
            If-Match: "${e1}"
        expect: {status: 412}
      - name: card 3 not moved
        as: anonymous
        request:
          method: GET
          path: "${P}/board.html"
          headers: {Range: "selector=#lane-todo"}
        expect: {status: 206, body_contains: ['id="card-3"']}

  - id: protocol.move.if-match-current
    title: A conditional element MOVE is compared with the source element's tag; the document's tag is 412, * succeeds
    area: protocol
    feature: MOVE conditional request
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/protocol-move-if-match-current.json (document tag: 412 carrying the source #card-3's tag); docs reference/reading-and-writing/MOVE-method §Concurrency (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "R-PROTO-100 as reconciled with the live run: only the source element's tag satisfies If-Match (docs/compat/decisions.md)."
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules: *broad
    steps:
      - name: read document ETag
        as: anonymous
        request: {method: GET, path: "${P}/board.html"}
        expect: {status: 200}
        capture: {e1: header.ETag}
      - name: read the source element's tag
        as: anonymous
        request:
          method: HEAD
          path: "${P}/board.html"
          headers: {Range: "selector=#card-3"}
