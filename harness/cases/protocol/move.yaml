  - id: protocol.move.incomplete-requests-422
    title: Incomplete element moves and whole-document moves without Destination are 422
    area: protocol
    feature: MOVE validation
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Headers, §Error cases (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: R-PROTO-92/99. Nothing may change.
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules: &broad
        - {actor: "*", resource: "${P}/*", method: [GET, MOVE, DELETE, POST], action: Allow}
    steps:
      - name: Range without Destination-Range
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-3", Destination: "${P}/board.html"}
        expect: {status: 422}
      - name: Destination-Range without Range
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 422}
      - name: Destination-Range without placement
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#lane-done"
        expect: {status: 422}
      - name: whole-document move without Destination
        as: anonymous
        request: {method: MOVE, path: "${P}/board.html"}
        expect: {status: 422}
      - name: document unchanged
        as: anonymous
        request:
          method: GET
          path: "${P}/board.html"
          headers: {Range: "selector=#lane-todo"}
        expect: {status: 206, body_contains: ['id="card-3"']}

