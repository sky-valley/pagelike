# MOVE (public plane): placement, validation, whole-document moves, conditions,
# concurrency, events (spec: docs/spec/protocol.md §9, R-PROTO-90..106).
# Authorization-specific cases live in move-authz.yaml.
#
# Validation cases grant broad document-level rules so that only the condition
# under test can fail; the documented examples use the three-check rules.
cases:
  - id: protocol.move.append-example
    title: "Documented example: move card 3 to the end of the done lane (204)"
    area: protocol
    feature: MOVE element placement
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Examples, Move a card to a different lane (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: R-PROTO-90/93/94/96. Rules are the documented three-check set with actor * instead of editors.
    site:
      files:
        - path: "${P}/move-append-test.html"
          body: &board |
            <!DOCTYPE html>
            <html><body>
            <section class="lane" id="lane-todo"><article class="card" id="card-1">One</article><article class="card" id="card-2">Two</article><article class="card" id="card-3">Three</article></section>
            <section class="lane" id="lane-done"><article class="card" id="card-4">Four</article></section>
            </body></html>
      rules: &three_checks
        - {actor: "*", resource: "${P}/*", method: [GET], action: Allow}
        - {actor: "*", resource: "${P}/*", method: [MOVE], selector: "", action: Allow}
        - {actor: "*", resource: "${P}/*", method: [DELETE], selector: ".card", action: Allow}
        - {actor: "*", resource: "${P}/*", method: [POST], selector: ".lane", action: Allow}
    steps:
      - name: move
        as: anonymous
        request:
          method: MOVE
          path: "${P}/move-append-test.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/move-append-test.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 204, body: ""}
      - name: card 3 is the last child of the done lane
        as: anonymous
        request:
          method: GET
          path: "${P}/move-append-test.html"
          headers: {Range: "selector=#lane-done"}
        expect:
          status: 206
          body_html: '<section class="lane" id="lane-done"><article class="card" id="card-4">Four</article><article class="card" id="card-3">Three</article></section>'
      - name: and no longer in the todo lane
        as: anonymous
        request:
          method: GET
          path: "${P}/move-append-test.html"
          headers: {Range: "selector=#lane-todo"}
        expect:
          status: 206
          body_html: '<section class="lane" id="lane-todo"><article class="card" id="card-1">One</article><article class="card" id="card-2">Two</article></section>'

  - id: protocol.move.before-example
    title: "Documented example: move a list item before another (204)"
    area: protocol
    feature: MOVE element placement
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Examples, Move a sibling before another (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: R-PROTO-93/96. Check 3 for before keys on the anchor's parent (the ul).
    site:
      files:
        - path: "${P}/move-before-test.html"
          body: |
            <!DOCTYPE html>
            <html><body><ul id="list"><li id="item-a">A</li><li id="item-b">B</li><li id="item-c">C</li></ul></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, MOVE], action: Allow}
        - {actor: "*", resource: "${P}/*", method: [DELETE], selector: "li", action: Allow}
        - {actor: "*", resource: "${P}/*", method: [POST], selector: "ul", action: Allow}
    steps:
      - name: move c before a
        as: anonymous
        request:
          method: MOVE
          path: "${P}/move-before-test.html"
          headers:
            Range: "selector=#item-c"
            Destination: "${P}/move-before-test.html"
            Destination-Range: "selector=#item-a; placement=before"
        expect: {status: 204}
      - name: order is c, a, b
        as: anonymous
        request:
          method: GET
          path: "${P}/move-before-test.html"
          headers: {Range: "selector=#list"}
        expect:
          status: 206
          body_html: '<ul id="list"><li id="item-c">C</li><li id="item-a">A</li><li id="item-b">B</li></ul>'

  - id: protocol.move.prepend-and-after
    title: prepend inserts as first child; after inserts as next sibling
    area: protocol
    feature: MOVE element placement
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Placement (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: R-PROTO-93.
    site:
      files:
        - path: "${P}/board.html"
          body: *board
      rules: *three_checks
    steps:
      - name: prepend card 3 into done
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#lane-done; placement=prepend"
        expect: {status: 204}
      - name: move card 1 after card 4
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-1"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#card-4; placement=after"
        expect: {status: 204}
      - name: done lane is 3, 4, 1
        as: anonymous
        request:
          method: GET
          path: "${P}/board.html"
          headers: {Range: "selector=#lane-done"}
        expect:
          status: 206
          body_html: '<section class="lane" id="lane-done"><article class="card" id="card-3">Three</article><article class="card" id="card-4">Four</article><article class="card" id="card-1">One</article></section>'

