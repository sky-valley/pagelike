    area: protocol
    feature: MOVE whole document
    evidence: inferred
    source: "docs reference/reading-and-writing/GET-method, PUT-method error tables (snapshot 2026-09-28)"
    confidence: medium
    requires: []
    live: true
    notes: >-
      R-PROTO-98. Live PageLove answers 500 with an Internal problems item saying the document was
      not found (harness/observations/live-2026-09-28/protocol-move-whole-document-missing-source.json).
      pagelike keeps the 404 (docs/compat/decisions.md, keep-standard: a server error for a client's
      missing resource is a PageLove bug no client can rely on) and uses the write path's NotFound item;
      protocol.move.whole-document-missing-source.live measures the divergence.
    site:
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, MOVE], action: Allow}
    steps:
      - name: nothing to move
        as: anonymous
        request:
          method: MOVE
          path: "${P}/missing.html"
          headers: {Destination: "${P}/b.html"}
        expect:
          status: 404
          body: '<div itemscope itemtype="https://dombase.pagelove.team/ns/error/NotFound"><ul itemprop="problems"><li itemprop="problem"><span itemprop="message">document not found at request path: ${P}/missing.html</span></li></ul></div>'

