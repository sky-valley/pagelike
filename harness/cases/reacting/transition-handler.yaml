    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-79."
    steps:
      - name: install a handler with a JS gate that returns true
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/handlers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/TransitionHandler">
              <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="becomes" content="processing">
              <div itemprop="when" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                <script type="module" itemprop="source">export default function() { return true; }</script>
              </div>
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/js-gate">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: create an order at processing
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/o.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"></div></body></html>'
        expect: {status: [200, 201, 204]}
      - sink_expect_none: {path: /js-gate, for_ms: 3000}

