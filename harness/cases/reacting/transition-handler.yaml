    source: "docs reference/reacting-to-changes/TransitionHandler §The selector must name a type (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-77. The order element does carry the class."
    steps:
      - name: install a class-selector handler
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/handlers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/TransitionHandler">
              <meta itemprop="selector" content=".order">
              <meta itemprop="property" content="status">
              <meta itemprop="becomes" content="processing">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/class">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: create a classed order at processing
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/o.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div class="order" itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"></div></body></html>'
        expect: {status: [200, 201, 204]}
      - sink_expect_none: {path: /class, for_ms: 3000}

  - id: reacting.th.selector-list-with-type-branch-fires
