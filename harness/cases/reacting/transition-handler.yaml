          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/TransitionHandler">
              <meta itemprop="selector" content=".order, [itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="becomes" content="processing">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/list">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: create an order at processing
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/o.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"></div></body></html>'
        expect: {status: [200, 201, 204]}
      - sink_expect: {path: /list, within_ms: 5000}

  - id: reacting.th.when-gate-path
    title: "The when gate sees the Transition item as self (self.path)"
    feature: TransitionHandler (when)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §The when gate, §Delivery (example self.path == \"/orders.html\") (snapshot 2026-09-28)"
    confidence: medium
    requires: [outbound-http, sessel]
    live: true
    notes: "spec: R-REACT-79. Only the order in a.html is delivered."
    steps:
      - name: install a gated handler
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/handlers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/TransitionHandler">
              <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="becomes" content="processing">
              <div itemprop="when" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">self.path == "${P}/orders/a.html"</script>
              </div>
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/gated">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: an order in b.html becomes processing (gate false)
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/b.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"></div></body></html>'
        expect: {status: [200, 201, 204]}
      - sink_expect_none: {path: /gated, for_ms: 3000}
      - name: an order in a.html becomes processing (gate true)
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/a.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"></div></body></html>'
        expect: {status: [200, 201, 204]}
      - sink_expect: {path: /gated, within_ms: 5000, body_contains: ['content="${P}/orders/a.html"']}

  - id: reacting.th.js-gate-never-fires
