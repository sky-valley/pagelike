    feature: TransitionHandler (selector)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §The selector must name a type ('A comma-separated selector list fires if any type branch accepts the item's type') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-77."
    steps:
