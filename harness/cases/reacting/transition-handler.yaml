# Reacting: TransitionHandler (spec R-REACT-76..85).
# See outbound.yaml for sink step conventions and transition-constraint.yaml
# for the ${P}-scoped Order type. Handler documents are installed through the
# serving path. Unless a case says otherwise, no TransitionConstraint exists,
# so every change of status is permitted ("handler-only watch").
anchors:
  open_rules: &open_rules
    - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT, POST, DELETE], action: Allow}
  install_basic_handler: &install_basic_handler
    name: install a handler (Order.status becomes processing -> POST ${SINK}/payments)
    as: anonymous
    request:
      method: PUT
      path: "${P}/r/handlers.html"
      headers: {Content-Type: text/html}
      body: |
        <!DOCTYPE html>
        <html><body>
        <div itemscope itemtype="https://pagelove.org/TransitionHandler">
          <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
          <meta itemprop="property" content="status">
          <meta itemprop="becomes" content="processing">
          <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
            <meta itemprop="url" content="${SINK}/payments">
            <meta itemprop="method" content="POST">
          </div>
        </div>
        </body></html>
    expect: {status: [200, 201, 204]}
  seed_pending: &seed_pending
    name: seed order-1 at pending
    as: anonymous
    request:
      method: PUT
      path: "${P}/orders/order-1.html"
      headers: {Content-Type: text/html}
      body: |
        <!DOCTYPE html>
        <html><body><div id="order1" itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="pending"><span itemprop="total">42.00</span></div></body></html>
    expect: {status: [200, 201, 204]}
  to_processing: &to_processing
    name: move order-1 to processing
    as: anonymous
    request:
      method: PUT
      path: "${P}/orders/order-1.html"
      headers: {Content-Type: text/html, Range: "selector=#order1"}
      body: '<div id="order1" itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"><span itemprop="total">42.00</span></div>'
    expect: {status: [200, 204, 206]}
defaults:
  area: reacting
  requires: [outbound-http]
  site:
    settings: {default_get: allow}
    rules: *open_rules
cases:
  - id: reacting.th.recipe-notify-worker
    title: "State-machine recipe: the handler delivers a Transition document when an order becomes processing"
    feature: TransitionHandler (recipe)
    evidence: documented
    source: "docs recipes/declaring-a-state-machine §Notify a worker; reference/reacting-to-changes/TransitionHandler §Quick example, §What the action receives (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-78, R-REACT-81, R-REACT-82. Rules and handler live in one document, as the recipe suggests."
    steps:
      - name: install the recipe rules plus the handler
        as: anonymous
        request:
          method: PUT
          path: "${P}/transitions/rules.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/TransitionConstraint">
              <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="to" content="pending">
            </div>
            <div itemscope itemtype="https://pagelove.org/TransitionConstraint">
              <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="from" content="pending">
              <meta itemprop="to" content="processing">
            </div>
            <div itemscope itemtype="https://pagelove.org/TransitionConstraint">
              <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="from" content="processing">
              <meta itemprop="to" content="success">
            </div>
            <div itemscope itemtype="https://pagelove.org/TransitionConstraint">
              <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="from" content="success">
            </div>
            <div itemscope itemtype="https://pagelove.org/TransitionHandler">
              <meta itemprop="selector" content=":isa('https://pagelike.test${P}/Order')">
              <meta itemprop="property" content="status">
              <meta itemprop="becomes" content="processing">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/payments">
                <meta itemprop="method" content="POST">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - *seed_pending
      - sink_expect_none: {path: /payments, for_ms: 2000}
      - *to_processing
      - sink_expect:
          path: /payments
          within_ms: 5000
          method: POST
          header_matches: {Content-Type: "^text/html"}
          body_contains:
            - "https://pagelove.org/Transition"
            - 'content="${P}/orders/order-1.html"'
            - 'itemprop="body"'
            - "https://pagelike.test${P}/Order"
            - 'content="processing"'
          microdata:
            - type: https://pagelove.org/Transition
              properties: {}
      - name: the worker reports back (processing -> success)
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/order-1.html"
          headers: {Content-Type: text/html, Range: "selector=#order1"}
          body: '<div id="order1" itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="success"><span itemprop="total">42.00</span></div>'
        expect: {status: [200, 204, 206]}
      - sink_expect_none: {path: /payments, for_ms: 2000}

  - id: reacting.th.entry-fires
    title: An item created directly in a becomes state fires the handler
    feature: TransitionHandler (firing)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §When a handler fires ('it fires for entries too') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-78."
    steps:
      - *install_basic_handler
      - name: create an order at processing
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/new.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"></div></body></html>'
        expect: {status: [200, 201, 204]}
      - sink_expect: {path: /payments, within_ms: 5000, body_contains: ['content="${P}/orders/new.html"']}

  - id: reacting.th.exit-never-fires
    title: Deleting an item in the becomes state fires nothing
    feature: TransitionHandler (firing)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §When a handler fires ('exits never fire') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-78."
    steps:
      - *install_basic_handler
      - *seed_pending
      - *to_processing
      - sink_expect: {path: /payments, within_ms: 5000}
      - name: delete the processing order
        as: anonymous
        request: {method: DELETE, path: "${P}/orders/order-1.html"}
        expect: {status: [200, 204]}
      - sink_expect_none: {path: /payments, for_ms: 3000}

  - id: reacting.th.unchanged-never-fires
    title: Rewriting the same value fires nothing
    feature: TransitionHandler (firing)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §When a handler fires ('a write that leaves the watched value unchanged fires nothing') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-78."
    steps:
      - *install_basic_handler
      - *seed_pending
      - *to_processing
      - sink_expect: {path: /payments, within_ms: 5000}
      - name: write processing again (and change the total)
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/order-1.html"
          headers: {Content-Type: text/html, Range: "selector=#order1"}
          body: '<div id="order1" itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"><span itemprop="total">43.00</span></div>'
        expect: {status: [200, 204, 206]}
      - sink_expect_none: {path: /payments, for_ms: 3000}

  - id: reacting.th.becomes-or
    title: Several becomes values are OR-ed
    feature: TransitionHandler (firing)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §When a handler fires ('repeated becomes values are OR'd') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-76, R-REACT-78."
    steps:
      - name: install a handler for processing or shipped
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/handlers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/TransitionHandler">
              <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="becomes" content="processing">
              <meta itemprop="becomes" content="shipped">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/any">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - *seed_pending
      - name: pending -> shipped
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/order-1.html"
          headers: {Content-Type: text/html, Range: "selector=#order1"}
          body: '<div id="order1" itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="shipped"></div>'
        expect: {status: [200, 204, 206]}
      - sink_expect: {path: /any, within_ms: 5000, body_contains: ['content="shipped"']}

  - id: reacting.th.once-per-item
    title: One write that changes two items fires once per item, each with its own key-based selector
    feature: TransitionHandler (firing)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §When a handler fires ('it fires once per changed item'), §What the action receives (key-based selector) (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-78, R-REACT-81. Arrival order of the two deliveries is not asserted."
    steps:
      - name: register Order with orderNumber as @key
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
              <meta itemprop="type" content="https://pagelike.test${P}/Order">
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="orderNumber">
                <meta itemprop="type" content="https://schema.host/Text">
                <meta itemprop="cardinality" content="1..1">
                <meta itemprop="unique" content="true">
                <meta itemprop="@key" content="true">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - *install_basic_handler
      - name: two pending orders
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/batch.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="orderNumber" content="10"><meta itemprop="status" content="pending"></div>
            <div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="orderNumber" content="11"><meta itemprop="status" content="pending"></div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: both become processing in one write
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/batch.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="orderNumber" content="10"><meta itemprop="status" content="processing"></div>
            <div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="orderNumber" content="11"><meta itemprop="status" content="processing"></div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - sink_expect_count: {path: /payments, count: 2, within_ms: 6000}
      - sink_expect_none: {path: /payments, for_ms: 3000}

  - id: reacting.th.key-based-selector
    title: The Transition selector is key-based when the type declares a @key
    feature: TransitionHandler (Transition document)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §What the action receives (selector example) (snapshot 2026-09-28)"
    confidence: medium
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-81. The exact serialization is compared as documented (&quot; escaping)."
    steps:
      - name: register Order with orderNumber as @key
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
              <meta itemprop="type" content="https://pagelike.test${P}/Order">
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="orderNumber">
                <meta itemprop="type" content="https://schema.host/Text">
                <meta itemprop="cardinality" content="1..1">
                <meta itemprop="unique" content="true">
                <meta itemprop="@key" content="true">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - *install_basic_handler
      - name: create order 10 at processing
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/order-1.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="orderNumber" content="10"><meta itemprop="status" content="processing"></div></body></html>'
        expect: {status: [200, 201, 204]}
      - sink_expect:
          path: /payments
          within_ms: 5000
          body_contains: [':has([itemprop=&quot;orderNumber&quot;]:value-equals(&quot;10&quot;))']

  - id: reacting.th.keyless-selector-by-type
    title: Without a @key the Transition selector addresses the item by type alone
    feature: TransitionHandler (Transition document)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §What the action receives ('with no key the item was necessarily the only one of its kind in the document, so the selector addresses it by type') (snapshot 2026-09-28)"
    confidence: medium
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-81."
    steps:
      - *install_basic_handler
      - *seed_pending
      - *to_processing
      - sink_expect:
          path: /payments
          within_ms: 5000
          body_contains: ['content="[itemtype=&quot;https://pagelike.test${P}/Order&quot;]"']

  - id: reacting.th.nested-item-itemprop-replaced
    title: A watched item nested as another item's property is delivered with itemprop="body" instead of its own itemprop
    feature: TransitionHandler (Transition document)
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionHandler §What the action receives ('its original itemprop is replaced by body on the delivered copy') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-81."
    steps:
      - *install_basic_handler
      - name: create a cart whose order property is an Order at processing
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/cart.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Cart">
              <div itemprop="order" data-marker="nested-order" itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="status" content="processing"></div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - sink_expect:
          path: /payments
          within_ms: 5000
          body_contains: ['itemprop="body"', 'data-marker="nested-order"']
          body_not_contains: ['itemprop="order"', "pagelike.test${P}/Cart"]

