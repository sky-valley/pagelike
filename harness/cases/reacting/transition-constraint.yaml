  - id: reacting.tc.uniqueness-before-transition
    title: A write that breaks both a uniqueness constraint and a transition rule is refused by uniqueness first
    feature: TransitionConstraint (pipeline position)
    evidence: inferred
    source: "spec R-REACT-71 ('a duplicate key fails first as a uniqueness 422'), modeling R-MOD-15 (transitions are step 10, after uniqueness)"
    confidence: low
    requires: []
    live: true
    notes: "Pins the order of the engine's Validate hooks (schema phase before transition phase) whatever the Go initialization order."
    steps:
      - name: declare the Order schema with a unique sku
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
              <meta itemprop="type" content="https://pagelike.test${P}/Order">
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="sku">
                <meta itemprop="type" content="https://schema.host/Text">
                <meta itemprop="unique" content="true">
              </div>
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="status">
                <meta itemprop="type" content="https://schema.host/Text">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: allow only entries into pending
        as: anonymous
        request:
          method: PUT
          path: "${P}/transitions/rules.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/TransitionConstraint">
              <meta itemprop="selector" content="[itemtype='https://pagelike.test${P}/Order']">
              <meta itemprop="property" content="status">
              <meta itemprop="to" content="pending">
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: the first order is a legal entry
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/a.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="sku" content="A-1"><meta itemprop="status" content="pending"></div></body></html>'
        expect: {status: [200, 201, 204]}
      - name: a duplicate sku entering an undeclared state fails as a uniqueness violation
        as: anonymous
        request:
          method: PUT
          path: "${P}/orders/b.html"
          headers: {Content-Type: text/html}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://pagelike.test${P}/Order"><meta itemprop="sku" content="A-1"><meta itemprop="status" content="shipped"></div></body></html>'
        expect:
          status: 422
          # Uniqueness body as observed live 2026-09-29 (docs/compat/decisions-2026-09-29/modeling.md).
          body_contains: ["[uniqueness]", "Uniqueness violation"]
          body_not_contains: ["Transition constraints violated"]
      - name: nothing was stored
        as: anonymous
        request: {method: GET, path: "${P}/orders/b.html"}
        expect: {status: 404}
