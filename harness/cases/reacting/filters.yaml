        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <meta itemprop="selector" content="h1">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  throw new HTTPResponse { status: 409, message: "h1-filter-hit" }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: a selector PUT for a missing element fires the trigger before core
        as: anonymous
        request:
          method: PUT
          path: "${P}/d/doc.html"
          headers: {Content-Type: text/html, Range: "selector=#missing"}
          body: '<p id="missing">x</p>'
        expect: {status: 409, body_contains: ["h1-filter-hit"]}

