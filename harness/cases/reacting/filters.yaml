          body: |
            <!DOCTYPE html>
            <html><body><h1 id="h">Title</h1></body></html>
    steps:
      - name: install a trigger filtered on 'article'
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <meta itemprop="selector" content="article">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  throw new HTTPResponse { status: 409, message: "no-selector-hit" }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: a whole-document PUT (no selector) fires even though the document has no article
        as: anonymous
        request: {method: PUT, path: "${P}/d/doc.html", headers: {Content-Type: text/html}, body: "<!DOCTYPE html><html><body><p>x</p></body></html>"}
        expect: {status: 409, body_contains: ["no-selector-hit"]}

  - id: reacting.filters.selector-no-match-does-not-fire
