  - id: reacting.processor.js-throw-adds-headers
    title: "beta-js CORS processor: re-throw status and body with extra headers; the 2xx filter spares 404s"
    feature: processor (throw to add headers)
    evidence: client-source
    source: "beta-js/cors.html@c204746:50-70; commit 412668a"
    confidence: high
    requires: [server-js]
    live: true
    notes: "spec: R-REACT-45, R-REACT-47. Content-Type must be set explicitly because the stored type is not carried over."
    site: *module_site
    steps:
      - name: install the CORS processor
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/cors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><head><title>Response processors</title></head><body>
            <div itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/lib/*">
              <meta itemprop="method" content="GET">
              <meta itemprop="status" content="2xx">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                <script type="module" itemprop="source">
                  export default function (ctx) {
                    throw {
                      schema_url: "https://pagelove.org/HTTPResponse",
                      status: ctx.response.status,
                      body: ctx.response.body,
                      headers: {
                        "Access-Control-Allow-Origin": "*",
                        "Content-Type": "text/javascript"
                      }
                    };
                  }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: the module is served with the CORS header and its type
        as: anonymous
        request: {method: GET, path: "${P}/lib/mod.mjs"}
        expect:
          status: 200
          headers: {Access-Control-Allow-Origin: "*"}
          header_matches: {Content-Type: "^text/javascript"}
      - name: a missing module keeps its 404 and gets no CORS header
        as: anonymous
        request: {method: GET, path: "${P}/lib/missing.mjs"}
        expect:
          status: 404
          headers_absent: [Access-Control-Allow-Origin]

