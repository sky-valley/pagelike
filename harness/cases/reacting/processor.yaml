    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-9."
    steps:
      - name: install a throwing trigger and a 4xx processor
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/reactions.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  throw new HTTPResponse { status: 409, message: "from-trigger" }
                </script>
              </div>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="status" content="4xx">
