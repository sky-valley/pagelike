  - id: reacting.processor.chain-termination-order
    title: Processors run in lexicographic document order; the first throw replaces the response and stops the chain
    feature: processor (order, chain termination)
    evidence: documented
    source: "docs reference/reacting-to-changes/Processor §Chain termination, §Execution order (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-33, R-REACT-35."
    site: *doc_site
    steps:
      - name: install b.html (would throw 423)
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/b.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="GET">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  throw new HTTPResponse { status: 423, message: "from-b" }
                </script>
