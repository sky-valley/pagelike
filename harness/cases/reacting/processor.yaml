    source: "beta-js/cors.html@c204746:34-35 ('passes the body through as a string, so the bytes survive'); commit 412668a"
    confidence: high
    requires: [server-js]
    live: true
    notes: "spec: R-REACT-32."
    site: *module_site
    steps:
      - name: install a JS re-throwing processor
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/lib/*">
              <meta itemprop="method" content="GET">
              <meta itemprop="status" content="2xx">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                <script type="module" itemprop="source">
