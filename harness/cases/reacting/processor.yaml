                    throw { schema_url: "https://pagelove.org/HTTPResponse", status: ctx.response.status, body: ctx.response.body, headers: { "Content-Type": "text/javascript" } };
                  }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: the module text is intact
        as: anonymous
        request: {method: GET, path: "${P}/lib/mod.mjs"}
        expect:
          status: 200
          body: "export const f = (a, b) => a && b;"

  - id: reacting.processor.sessel-rethrow-escapes-non-html
    title: A Sessel-thrown body is re-serialized as HTML, so '=>' and '&&' come back escaped
    feature: processor (thrown body)
    evidence: client-source
    source: "beta-js/cors.html@c204746:27-32; commit 412668a message ('Rethrowing the body through Sessel serialises the string as HTML')"
    confidence: medium
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-32, decision C8. Competing claim: reacting.processor.sessel-rethrow-keeps-bytes (disputed). Probe P-8."
    site: *module_site
    steps:
      - name: install the pre-fix (Sessel) CORS processor
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/cors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/lib/*">
              <meta itemprop="method" content="GET">
              <meta itemprop="status" content="2xx">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema Context url("https://pagelove.org/Context");
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  @schema Pair url("https://pagelove.org/Pair");
                  throw new HTTPResponse {
                    status: Context.response.status,
                    body: Context.response.body,
                    header: new Pair { key: "Access-Control-Allow-Origin", value: "*" },
                    header: new Pair { key: "Content-Type", value: "text/javascript" }
                  }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: the header is attached but the module text is HTML-escaped
        as: anonymous
        request: {method: GET, path: "${P}/lib/mod.mjs"}
        expect:
          status: 200
          headers: {Access-Control-Allow-Origin: "*"}
          body_contains: ["=&gt;", "&amp;&amp;"]

