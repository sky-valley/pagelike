                  Context.response.body = "js-gated-404"
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: missing page, as: anonymous, request: {method: GET, path: "${P}/d/missing.html"}, expect: {status: 404, body_contains: ["js-gated-404"]}}
      - {name: existing page, as: anonymous, request: {method: GET, path: "${P}/d/doc.html"}, expect: {status: 200, body_not_contains: ["js-gated-404"]}}

  - id: reacting.processor.build-a-blog-status-rewrite
    title: "Tutorial: turn a 200 'Not found' page into a real 404, for GET and HEAD alike"
    feature: processor (status assignment, HEAD sees body)
    evidence: documented
    source: "docs learn/build-a-blog §Making the 404 real (processor, curl -sI results) (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-13 (GET implies HEAD), R-REACT-26 (HEAD sees the GET body), R-REACT-44. The tutorial checks 'blog.example/Post'; the case uses a ${P}-scoped marker."
    site:
      settings: {default_get: allow}
      rules: *open_rules
      files:
        - path: "${P}/posts/hello.html"
          body: |
            <!DOCTYPE html>
            <html><body><article itemscope itemtype="https://pagelike.test/blog/Post"><h1 itemprop="title">Hello</h1></article></body></html>
        - path: "${P}/posts/nonsense.html"
          body: |
            <!DOCTYPE html>
            <html><body><div class="post-missing"><h1>Not found</h1></div></body></html>
    steps:
      - name: install the tutorial processor
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"><title>processors</title></head>
            <body>
              <div itemscope itemtype="https://pagelove.org/Processor">
                <meta itemprop="resource" content="${P}/posts/*">
                <meta itemprop="method" content="GET">
                <meta itemprop="status" content="200">
                <div itemprop="when" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">
            @schema Context url("https://pagelove.org/Context");
            Context.response.body.contains("pagelike.test/blog/Post") == false
                  </script>
                </div>
                <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">
            @schema Context url("https://pagelove.org/Context");
            Context.response.status = 404
                  </script>
                </div>
              </div>
            </body>
            </html>
        expect: {status: [200, 201, 204]}
      - name: the page without a Post becomes 404, body unchanged
        as: anonymous
        request: {method: GET, path: "${P}/posts/nonsense.html"}
        expect: {status: 404, body_contains: ["Not found", "post-missing"]}
      - name: HEAD gives 404 too (curl -sI)
        as: anonymous
        request: {method: HEAD, path: "${P}/posts/nonsense.html"}
        expect: {status: 404}
      - name: a real post stays 200 on GET
        as: anonymous
        request: {method: GET, path: "${P}/posts/hello.html"}
        expect: {status: 200}
      - name: and on HEAD, which proves processors see the body for HEAD
        as: anonymous
        request: {method: HEAD, path: "${P}/posts/hello.html"}
        expect: {status: 200}

