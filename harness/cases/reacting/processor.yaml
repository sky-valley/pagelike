  - id: reacting.processor.side-effect-audit-log
    title: "Documented: a processor Sessel action writes an audit document with Pagelove.PUT"
    feature: processor (writes)
    evidence: documented
    source: "docs reference/reacting-to-changes/Processor §Writing from processors (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-36 (processor writes use the same pipeline). The AuditLog type has no schema, so it is stored as constructed."
    steps:
      - name: install the audit processor on successful PUTs
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <meta itemprop="status" content="2xx">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema Context url("https://pagelove.org/Context");
                  @schema Pagelove url("https://pagelove.org/1.0");
                  @schema AuditLog url("https://pagelike.test${P}/AuditLog");
                  let log = new AuditLog { status: Context.response.status };
                  Pagelove.PUT(log, "${P}/audit/latest.html")
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: a successful write
        as: anonymous
        request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect: {status: [200, 201, 204]}
      - name: the audit record exists
        as: anonymous
        request: {method: GET, path: "${P}/audit/latest.html"}
        expect:
          status: 200
          body_contains: ["pagelike.test${P}/AuditLog", 'itemprop="status"']

