  - id: reacting.processor.when-response-status
    title: "Documented: a Sessel when gate can read Context.response.status"
    feature: processor (when)
    evidence: documented
    source: "docs reference/reacting-to-changes/Processor §when (Sessel example) (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-17, R-REACT-26."
    site: *doc_site
    steps:
      - name: install a gated processor with no status filter
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="GET">
              <div itemprop="when" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema Context url("https://pagelove.org/Context");
                  Context.response.status == 404
                </script>
              </div>
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema Context url("https://pagelove.org/Context");
                  Context.response.body = "gated-404"
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: missing page, as: anonymous, request: {method: GET, path: "${P}/d/missing.html"}, expect: {status: 404, body_contains: ["gated-404"]}}
      - {name: existing page, as: anonymous, request: {method: GET, path: "${P}/d/doc.html"}, expect: {status: 200, body_not_contains: ["gated-404"]}}

  - id: reacting.processor.js-when-response-status
    title: "Documented: a JavaScript when gate reads ctx.response"
    feature: processor (when, JavaScript)
    evidence: documented
    source: "docs reference/reacting-to-changes/Processor §when (JavaScript example) (snapshot 2026-09-28)"
    confidence: high
    requires: [server-js, sessel]
    live: true
    notes: "spec: R-REACT-17, R-REACT-25."
    site: *doc_site
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="GET">
              <div itemprop="when" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                <script type="module" itemprop="source">
                  export default function(ctx) {
                    return ctx.response.status === 404;
                  }
                </script>
              </div>
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
