# Reacting: processors (spec R-REACT-10, 15, 26, 32, 43..47).
# See discovery.yaml for directory conventions.
anchors:
  open_rules: &open_rules
    - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT, POST, DELETE], action: Allow}
  doc_site: &doc_site
    settings: {default_get: allow}
    rules: *open_rules
    files:
      - path: "${P}/d/doc.html"
        body: |
          <!DOCTYPE html>
          <html><body><h1>Real page</h1></body></html>
  module_site: &module_site
    settings: {default_get: allow}
    rules: *open_rules
    files:
      - path: "${P}/lib/mod.mjs"
        content_type: text/javascript
        body: "export const f = (a, b) => a && b;"
defaults:
  area: reacting
  site:
    settings: {default_get: allow}
    rules: *open_rules
cases:
  - id: reacting.processor.custom-404
    title: "Documented quick example: a processor replaces the body of 404 responses"
    feature: processor (status filter, body assignment)
    evidence: documented
    source: "docs reference/reacting-to-changes/Processor §Quick example (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-10, R-REACT-15, R-REACT-44. The docs use resource '*'; the case scopes it to ${P}/d/*."
    site: *doc_site
    steps:
      - name: install the documented processor
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="GET">
              <meta itemprop="status" content="404">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema Context url("https://pagelove.org/Context");
                  Context.response.body = "<h1>Page not found</h1><p>Sorry, that page doesn't exist.</p>"
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: a missing page gets the custom body and keeps its status
        as: anonymous
        request: {method: GET, path: "${P}/d/missing.html"}
        expect:
          status: 404
          body_contains: ["Page not found", "Sorry, that page"]
      - name: an existing page is untouched
        as: anonymous
        request: {method: GET, path: "${P}/d/doc.html"}
        expect: {status: 200, body_contains: ["Real page"], body_not_contains: ["Page not found"]}

  - id: reacting.processor.status-class-4xx
    title: A status class prefix (4xx) matches any client-error status
    feature: processor (status filter)
    evidence: documented
    source: "docs reference/reacting-to-changes/Processor §status ('Class prefix — matches any status 400-499') (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-15."
    site: *doc_site
    steps:
      - name: install a 4xx processor
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="status" content="4xx">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema Context url("https://pagelove.org/Context");
                  Context.response.body = "client-error-page"
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: 404 is in the class
        as: anonymous
        request: {method: GET, path: "${P}/d/missing.html"}
        expect: {status: 404, body_contains: ["client-error-page"]}
      - name: 416 is in the class
        as: anonymous
        request: {method: GET, path: "${P}/d/doc.html", headers: {Range: "selector=#nope"}}
        expect: {status: 416, body_contains: ["client-error-page"]}
      - name: 200 is not
        as: anonymous
        request: {method: GET, path: "${P}/d/doc.html"}
        expect: {status: 200, body_not_contains: ["client-error-page"]}

