        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/malformed">
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="X-Good">
                  <meta itemprop="value" content="kept">
                </div>
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="Bad Name">
                  <meta itemprop="value" content="dropped">
                </div>
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="X-Evil">
                  <div itemprop="value" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                    <script type="module" itemprop="source">
                      export default function(ctx) { return "a\r\nX-Injected: yes"; }
