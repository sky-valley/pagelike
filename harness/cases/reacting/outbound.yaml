            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: write, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: [200, 201, 204]}}
      - sink_expect:
          path: /malformed
          within_ms: 5000
          headers: {X-Good: "kept"}
          headers_absent: [X-Evil, X-Injected, Bad-Name]

  - id: reacting.outbound.ats-outbox-relay
    title: "ATS outbox: a PUT of a JSON payload is relayed with its body and headers"
    feature: outbound HttpRequest (relay)
    evidence: demo-source
    source: "pagelove-ats/site/outbox/index.html@8f200fc:10-32"
    confidence: high
    requires: [outbound-http, sessel]
    live: true
    notes: "spec: R-REACT-6 (blob paths), R-REACT-51, R-REACT-52. The Postmark URL is replaced by ${SINK} and the token by a test value."
    steps:
      - name: install the outbox trigger
        as: anonymous
        request:
          method: PUT
          path: "${P}/outbox/index.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html lang="en" xmlns:p="https://pagelove.org/1.0">
            <head><meta charset="UTF-8"><title>Outbox</title></head>
            <body>
            <div itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/outbox/E-*.json">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/email">
                <meta itemprop="method" content="POST">
                <meta itemprop="content-type" content="application/json">
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="X-Postmark-Server-Token">
                  <meta itemprop="value" content="test-server-token">
                </div>
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="Accept">
                  <meta itemprop="value" content="application/json">
                </div>
                <div itemprop="body" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">
                    @schema Context url("https://pagelove.org/Context");
                    Context.request.body
                  </script>
                </div>
              </div>
            </div>
            </body>
            </html>
        expect: {status: [200, 201, 204]}
      - name: queue an e-mail
        as: anonymous
        request:
          method: PUT
          path: "${P}/outbox/E-1.json"
          headers: {Content-Type: application/json}
          body: '{"From":"hello@example.com","To":"cand@example.com","Subject":"Hi","TextBody":"Hello"}'
        expect: {status: [200, 201, 204]}
      - sink_expect:
          path: /email
          within_ms: 5000
          method: POST
          headers: {Content-Type: "application/json", X-Postmark-Server-Token: "test-server-token", Accept: "application/json"}
          body_json: {From: hello@example.com, To: cand@example.com, Subject: Hi, TextBody: Hello}

  - id: reacting.outbound.failure-does-not-affect-client
    title: A failing webhook does not change the client's response
    feature: outbound HttpRequest (fire-and-forget)
    evidence: documented
    source: "docs reference/reacting-to-changes/HTTPRequest §Retry ('Failures do not affect the client response (already sent)'), §Error handling (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-56, R-REACT-58."
    steps:
      - sink_config: {path: /down, responses: [500]}
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/down">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: the write succeeds, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: [200, 201, 204]}}
      - sink_expect: {path: /down, within_ms: 5000}
      - {name: the write is stored, as: anonymous, request: {method: GET, path: "${P}/d/x.html"}, expect: {status: 200}}

  - id: reacting.outbound.queued-before-throw-still-sent
    title: A request queued by an earlier trigger is still sent when a later trigger throws
    feature: outbound HttpRequest (queue lifetime)
    evidence: inferred
    source: "spec R-REACT-9/R-REACT-56, decision C4 (lifecycle skips only steps 3-4 on a throw)"
    confidence: low
    requires: [outbound-http, sessel]
    live: true
    notes: "Probe P-4."
    steps:
      - name: install a.html (queues) and b.html (throws)
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/a.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/queued">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: install the thrower
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/b.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  throw new HTTPResponse { status: 409, message: "stop" }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: refused, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: 409}}
      - sink_expect: {path: /queued, within_ms: 5000}

