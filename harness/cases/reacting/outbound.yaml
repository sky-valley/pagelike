# Reacting: outbound HttpRequest actions (spec R-REACT-48..56).
# See discovery.yaml for directory conventions.
# These cases use the sink steps proposed in docs/spec/reacting.md §14
# (sink_config, sink_expect, sink_expect_none, sink_expect_count). ${SINK} is
# the per-case capture base URL; sink paths are relative to it. String
# assertions in sink steps are ${...}-expanded like `expect`.
anchors:
  open_rules: &open_rules
    - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT, POST, DELETE], action: Allow}
defaults:
  area: reacting
  requires: [outbound-http]
  site:
    settings: {default_get: allow}
    rules: *open_rules
cases:
  - id: reacting.outbound.docs-quick-example
    title: "Documented: a trigger on PUT/POST under /blog/ sends a static webhook after the response"
    feature: outbound HttpRequest
    evidence: documented
    source: "docs reference/reacting-to-changes/HTTPRequest §Quick example; Trigger §Quick example (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http, sessel]
    live: true
    notes: "spec: R-REACT-48, R-REACT-51, R-REACT-56. content-type is absent, so it defaults to text/html."
    steps:
      - name: install the documented trigger
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/blog/*">
              <meta itemprop="method" content="PUT">
              <meta itemprop="method" content="POST">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/notify">
                <meta itemprop="method" content="POST">
                <meta itemprop="body" content="Blog content updated">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: a blog write succeeds
        as: anonymous
        request: {method: PUT, path: "${P}/blog/post.html", headers: {Content-Type: text/html}, body: "<!DOCTYPE html><html><body><h1>Post</h1></body></html>"}
        expect: {status: [200, 201, 204]}
      - sink_expect:
          path: /notify
          within_ms: 5000
          method: POST
          header_matches: {Content-Type: "^text/html"}
          body: "Blog content updated"
      - name: a write elsewhere sends nothing
        as: anonymous
        request: {method: PUT, path: "${P}/other/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect: {status: [200, 201, 204]}
      - sink_expect_none: {path: /notify, for_ms: 2000}

  - id: reacting.outbound.default-method-post
    title: An HttpRequest without method is sent as POST
    feature: outbound HttpRequest (method)
    evidence: documented
    source: "docs reference/reacting-to-changes/HTTPRequest §method ('Defaults to POST') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-50."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/default-method">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: write, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: [200, 201, 204]}}
      - sink_expect: {path: /default-method, within_ms: 5000, method: POST}

  - id: reacting.outbound.method-put
    title: The method property selects the outbound method (PUT)
    feature: outbound HttpRequest (method)
    evidence: documented
    source: "docs reference/reacting-to-changes/HTTPRequest §method ('Supported methods: GET, POST, PUT, DELETE, PATCH') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-50. One trigger per outbound request: the serving path refuses a Trigger without exactly one action (R-REACT-4a, live 2026-09-29)."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/put-target">
                <meta itemprop="method" content="PUT">
                <meta itemprop="body" content="put-body">
              </div>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/patch-target">
                <meta itemprop="method" content="patch">
                <meta itemprop="body" content="patch-body">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: write, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: [200, 201, 204]}}
      - sink_expect: {path: /put-target, within_ms: 5000, method: PUT, body: "put-body"}
      - sink_expect: {path: /patch-target, within_ms: 5000, method: PATCH, body: "patch-body"}

  - id: reacting.outbound.content-type-property
    title: The content-type property sets the outbound Content-Type
    feature: outbound HttpRequest (content-type)
    evidence: documented
    source: "docs reference/reacting-to-changes/HTTPRequest §content-type (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-51."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/json">
                <meta itemprop="content-type" content="application/json">
                <meta itemprop="body" content='{"ok":true}'>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: write, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: [200, 201, 204]}}
      - sink_expect:
          path: /json
          within_ms: 5000
          headers: {Content-Type: "application/json"}
          body_json: {ok: true}

  - id: reacting.outbound.dynamic-url-sessel
    title: "Documented: a dynamic Sessel url is built from the request path"
    feature: outbound HttpRequest (dynamic properties)
    evidence: documented
    source: "docs reference/reacting-to-changes/HTTPRequest §Static vs dynamic properties (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http, sessel]
    live: true
    notes: "spec: R-REACT-49, R-REACT-55. The docs concatenate host + '/' + path, producing a double slash that is sent as is; the case avoids the extra slash."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="method" content="POST">
                <div itemprop="url" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">
                    @schema Context url("https://pagelove.org/Context");
                    "${SINK}/dyn" + Context.request.path
                  </script>
                </div>
                <div itemprop="body" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">
                    @schema Context url("https://pagelove.org/Context");
                    Context.request.path
                  </script>
                </div>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: write, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: [200, 201, 204]}}
      - sink_expect:
          path: "/dyn${P}/d/x.html"
          within_ms: 5000
          method: POST
          body: "${P}/d/x.html"

  - id: reacting.outbound.dynamic-url-js
    title: A dynamic url may be a JavaScript/Module item; languages mix per property
    feature: outbound HttpRequest (dynamic properties)
    evidence: documented
    source: "docs reference/reacting-to-changes/HTTPRequest §Static vs dynamic properties ('The language is selected per property by its itemtype') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http, server-js, sessel]
    live: true
    notes: "spec: R-REACT-3, R-REACT-55."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <div itemprop="url" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                  <script type="module" itemprop="source">
                    export default function(ctx) { return "${SINK}/js" + ctx.request.path; }
                  </script>
                </div>
                <div itemprop="body" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">
                    @schema Context url("https://pagelove.org/Context");
                    "sessel-body:" + Context.request.method
                  </script>
                </div>
                <meta itemprop="method" content="POST">
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: write, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: [200, 201, 204]}}
      - sink_expect:
          path: "/js${P}/d/x.html"
          within_ms: 5000
          body: "sessel-body:PUT"

  - id: reacting.outbound.webhook-recipe-json-body
    title: "Recipe: a processor on POST sends a JSON webhook whose body is built in Sessel"
    feature: outbound HttpRequest (processor)
    evidence: documented
    source: "docs recipes/sending-a-webhook §Attach a Processor to the write (snapshot 2026-09-28)"
    confidence: medium
    requires: [outbound-http, sessel]
    live: true
    notes: "spec: R-REACT-51, R-REACT-55, R-REACT-56. The recipe's selector filter is omitted here: its meaning for POST appends is disputed (C6, see filters.yaml)."
    site:
      settings: {default_get: allow}
      rules: *open_rules
      files:
        - path: "${P}/notes/list.html"
          body: |
            <!DOCTYPE html>
            <html><body><ul id="notes"></ul></body></html>
    steps:
      - name: install the recipe processor
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/notes/*">
              <meta itemprop="method" content="POST">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/webhooks/note-created">
                <meta itemprop="method" content="POST">
                <meta itemprop="content-type" content="application/json">
                <div itemprop="body" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">
                    @schema Context url("https://pagelove.org/Context");
                    "{\"path\": \"" + Context.request.path + "\"}"
                  </script>
                </div>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: append a note
        as: anonymous
        request:
          method: POST
          path: "${P}/notes/list.html"
          headers: {Content-Type: text/html, Range: "selector=#notes"}
          body: '<li itemscope itemtype="https://pagelike.test/Note"><span itemprop="text">hi</span></li>'
        expect: {status: [200, 201, 204, 206]}
      - sink_expect:
          path: /webhooks/note-created
          within_ms: 5000
          method: POST
          headers: {Content-Type: "application/json"}
          body: '{"path": "${P}/notes/list.html"}'

  - id: reacting.outbound.header-pairs-repeat-order
    title: Header Pairs are sent; repeated names are kept in declaration order
    feature: outbound HttpRequest (headers)
    evidence: documented
    source: "docs reference/reacting-to-changes/HTTPRequest §header ('Repeats are kept … sent in the order you write them') (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http]
    live: true
    notes: "spec: R-REACT-52. Only same-name order is asserted."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/headers">
                <meta itemprop="content-type" content="application/json">
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="X-Postmark-Server-Token">
                  <meta itemprop="value" content="00000000-test-token">
                </div>
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="X-Multi">
                  <meta itemprop="value" content="one">
                </div>
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="X-Multi">
                  <meta itemprop="value" content="two">
                </div>
                <div itemprop="header" itemscope itemtype="https://pagelove.org/Pair">
                  <meta itemprop="key" content="Accept">
                  <meta itemprop="value" content="application/json">
                </div>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - {name: write, as: anonymous, request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}, expect: {status: [200, 201, 204]}}
      - sink_expect:
          path: /headers
          within_ms: 5000
          headers: {X-Postmark-Server-Token: "00000000-test-token", Accept: "application/json"}
          header_values: {X-Multi: [one, two]}

