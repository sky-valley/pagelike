  - id: reacting.outbound.processor-status-filter-success-only
    title: A processor with a 2xx status filter sends its webhook only for successful writes
    feature: outbound HttpRequest (processor)
    evidence: documented
    source: "docs reference/reacting-to-changes/Processor §status, §action (HttpRequest in processors); recipes/sending-a-webhook (snapshot 2026-09-28)"
    confidence: high
    requires: [outbound-http, sessel]
    live: true
    notes: "spec: R-REACT-15, R-REACT-55, R-REACT-56. The body is built from Context.response.status."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/processors.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Processor">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <meta itemprop="status" content="2xx">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest">
                <meta itemprop="url" content="${SINK}/success">
                <div itemprop="body" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">
                    @schema Context url("https://pagelove.org/Context");
                    "status=" + Context.response.status.String()
                  </script>
                </div>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: a failing write sends nothing
        as: anonymous
        request: {method: PUT, path: "${P}/d/missing.html", headers: {Content-Type: text/html, Range: "selector=h1"}, body: "<h1>x</h1>"}
        expect: {status: 404}
      - sink_expect_none: {path: /success, for_ms: 2000}
      - name: a successful write sends one request
        as: anonymous
        request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect: {status: [200, 201, 204]}
      - sink_expect: {path: /success, within_ms: 5000, body_matches: "^status=20[01]$"}

