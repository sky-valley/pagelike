  - id: reacting.actions.sessel-throw-303-location-pair
    title: "Documented redirect: throw HTTPResponse 303 with a Location Pair header"
    feature: response headers (Pair)
    evidence: documented
    source: "docs reference/reacting-to-changes/Trigger §Response headers (first example) (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: false
    notes: "spec: R-REACT-29, R-REACT-31. Local only since 2026-09-29: live PageLove differs for a POST without Range (keep-standard, docs/compat/decisions-2026-09-29/reacting.md), which the sibling reacting.actions.sessel-throw-303-location-pair.live measures. GET, PUT, DELETE and selector POSTs send the thrown 303 live (probe reacting.actions.probe-0929.thrown-redirect)."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="POST">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  @schema Pair url("https://pagelove.org/Pair");
                  throw new HTTPResponse {
                    status: 303,
                    header: new Pair { key: "Location", value: "/other-page.html" }
                  }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: POST is redirected
        as: anonymous
        request: {method: POST, path: "${P}/d/form.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect:
          status: 303
          headers: {Location: "/other-page.html"}

  - id: reacting.actions.sessel-throw-303-location-pair.live
