    feature: response headers (Pair)
    status: live-divergence
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/reacting-actions-sessel-throw-303-locati.json; harness/observations/live-2026-09-29-reconcile-reacting/reacting-actions-probe-0929-thrown-redir.json (2026-09-29)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "Measures a deliberate divergence (docs/compat/decisions-2026-09-29/reacting.md, keep-standard). Runs only against --target live. GET, PUT, DELETE and selector POSTs do send the thrown 303 (probe reacting.actions.probe-0929.thrown-redirect)."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="POST">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  @schema Pair url("https://pagelove.org/Pair");
                  throw new HTTPResponse {
                    status: 303,
                    header: new Pair { key: "Location", value: "/other-page.html" }
                  }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: POST answers 404 for the Location's missing document, without a Location
        as: anonymous
        request: {method: POST, path: "${P}/d/form.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect:
          status: 404
          headers_absent: [Location]
          body_contains: ["Document not found: /other-page.html"]

