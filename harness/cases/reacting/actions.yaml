                  export default function(ctx) { throw new Error("boom"); }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: the request fails with a microdata error body
        as: anonymous
        request: {method: PUT, path: "${P}/d/doc.html", headers: {Content-Type: text/html}, body: "<!DOCTYPE html><html><body><h1>Changed</h1></body></html>"}
