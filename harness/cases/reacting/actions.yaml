  - id: reacting.actions.thrown-response-drops-stored-content-type
    title: A thrown response replaces the stored representation's Content-Type (default text/html)
    feature: thrown response on the wire
    evidence: client-source
    source: "beta-js/cors.html@c204746:45-48 ('throwing replaces the response, so the stored type is not carried over'); spec R-REACT-31 (default is a pagelike decision)"
    confidence: low
    requires: [server-js]
    live: true
    notes: "Probe P-15 settles the default Content-Type."
    site:
      settings: {default_get: allow}
      rules: *open_rules
      files:
        - path: "${P}/d/data.json"
          content_type: application/json
          body: '{"a":1}'
    steps:
      - name: install a GET trigger that throws without a Content-Type
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="GET">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                <script type="module" itemprop="source">
                  export default function(ctx) {
                    throw { schema_url: "https://pagelove.org/HTTPResponse", status: 200, body: "replaced" };
                  }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: the JSON resource is answered with the thrown body and an HTML type
        as: anonymous
        request: {method: GET, path: "${P}/d/data.json"}
        expect:
          status: 200
          body: "replaced"
          header_matches: {Content-Type: "^text/html"}
