# Reacting: actions and thrown HTTPResponses (spec R-REACT-18, 29..31, 34).
# See discovery.yaml for directory conventions.
anchors:
  open_rules: &open_rules
    - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT, POST, DELETE], action: Allow}
  seed_doc: &seed_doc
    settings: {default_get: allow}
    rules: *open_rules
    files:
      - path: "${P}/d/doc.html"
        body: |
          <!DOCTYPE html>
          <html><body><h1 id="h">Original</h1></body></html>
defaults:
  area: reacting
  site:
    settings: {default_get: allow}
    rules: *open_rules
cases:
  - id: reacting.actions.sessel-throw-403-docs-example
    title: "Documented guard: a Sessel action throws HTTPResponse 403 when no Authorization header is sent"
    feature: chain termination (Sessel)
    evidence: documented
    source: "docs reference/reacting-to-changes/Trigger §Chain termination (first example) (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-29, R-REACT-31. Uses the documented canonical-case header lookup; without the header both lookup behaviours (C2) give null."
    site: *seed_doc
    steps:
      - name: install the documented guard (scoped to ${P}/d/*)
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <meta itemprop="method" content="POST">
              <meta itemprop="method" content="DELETE">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema Context url("https://pagelove.org/Context");
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  if (Context.request.headers["Authorization"] == null) {
                    throw new HTTPResponse {
                      status: 403,
                      message: "<p>Forbidden</p>"
                    }
                  }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: PUT without Authorization is refused with the thrown status and message
        as: anonymous
        request: {method: PUT, path: "${P}/d/doc.html", headers: {Content-Type: text/html}, body: "<!DOCTYPE html><html><body><h1>Changed</h1></body></html>"}
        expect:
          status: 403
          body_contains: ["Forbidden"]
      - name: DELETE is refused too
        as: anonymous
        request: {method: DELETE, path: "${P}/d/doc.html"}
        expect: {status: 403}
      - name: GET is not filtered and the document is unchanged
        as: anonymous
        request: {method: GET, path: "${P}/d/doc.html"}
        expect: {status: 200, body_contains: ["Original"], body_not_contains: ["Changed"]}

  - id: reacting.actions.js-throw-403-admin-restricted
    title: "Documented JS action: throw a plain HTTPResponse object for /admin/ paths, return value otherwise discarded"
    feature: chain termination (JavaScript)
    evidence: documented
    source: "docs reference/reacting-to-changes/Trigger §action (JavaScript example) (snapshot 2026-09-28)"
    confidence: high
    requires: [server-js]
    live: true
    notes: "spec: R-REACT-30. The docs test path.startsWith('/admin/'); the case tests the ${P}-scoped equivalent."
    steps:
      - name: install the JS action trigger
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                <script type="module" itemprop="source">
                  export default function(ctx) {
                    if (ctx.request.path.startsWith("${P}/admin/")) {
                      throw {
                        schema_url: "https://pagelove.org/HTTPResponse",
                        status: 403,
                        message: "Admin area is restricted"
                      };
                    }
                    return true;
                  }
                </script>
              </div>
            </div>
            </body></html>
        expect: {status: [200, 201, 204]}
      - name: an admin path is refused
        as: anonymous
        request: {method: PUT, path: "${P}/admin/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect: {status: 403, body_contains: ["Admin area is restricted"]}
      - name: another path proceeds (return value discarded)
        as: anonymous
        request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect: {status: [200, 201, 204]}

