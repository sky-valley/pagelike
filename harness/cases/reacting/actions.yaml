  - id: reacting.actions.actions-run-in-document-order
    title: A serving-path write storing a trigger with two actions is refused (422, platform schema Handler.action 1..1); nothing is installed
    feature: action order
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/reacting-actions-actions-run-in-document.json (2026-09-29); docs reference/reacting-to-changes/Trigger §action ('Actions execute in document order') describes stored items"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-REACT-18, R-REACT-4a (live 2026-09-29). The id keeps its old name. A stored two-action trigger (WebDAV) still runs its actions in document order: reacting.actions.actions-run-in-document-order-stored (local only)."
    steps:
      - name: install a trigger with two throwing actions
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  throw new HTTPResponse { status: 409, message: "first" }
                </script>
              </div>
              <div itemprop="action" itemscope itemtype="https://pagelove.org/Sessel">
                <script itemprop="source" type="text/sessel">
                  @schema HTTPResponse url("https://pagelove.org/HTTPResponse");
                  throw new HTTPResponse { status: 423, message: "second" }
                </script>
              </div>
            </div>
            </body></html>
        expect:
          status: 422
          body_contains: ["https://pagelove.org/SchemaViolation", "[https://pagelove.org/Handler].action: cardinality 1..1 violated: expected exactly 1 value, found 2"]
      - name: no trigger was installed, so PUT proceeds
        as: anonymous
        request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect: {status: [200, 201, 204]}

