  - id: reacting.actions.js-throw-headers-object
    title: The headers object on a thrown JS HTTPResponse becomes response headers
    feature: chain termination (JavaScript)
    evidence: documented
    source: "docs reference/reacting-to-changes/Trigger §Chain termination ('headers (an object of additional response headers)') (snapshot 2026-09-28); beta-js/cors.html@c204746:57-67"
    confidence: high
    requires: [server-js]
    live: true
    notes: "spec: R-REACT-30, R-REACT-31."
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Trigger">
              <meta itemprop="resource" content="${P}/d/*">
              <meta itemprop="method" content="PUT">
              <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                <script type="module" itemprop="source">
                  export default function(ctx) {
                    throw {
                      schema_url: "https://pagelove.org/HTTPResponse",
                      status: 409,
                      body: "with-headers",
                      headers: { "X-Pagelike-Test": "yes", "Content-Type": "text/plain" }
                    };
                  }
