    notes: "spec: R-REACT-34. Failure is documented; 500 is a pagelike decision (probe P-16)."
    site: *seed_doc
    steps:
      - name: install
        as: anonymous
        request:
          method: PUT
          path: "${P}/r/triggers.html"
          headers: {Content-Type: text/html}
