        request: {method: PUT, path: "${P}/d/x.html", headers: {Content-Type: text/html}, body: "<p>x</p>"}
        expect:
          status: 409
          headers: {X-Pagelike-Test: "yes"}
          header_matches: {Content-Type: "^text/plain"}
          body_contains: ["with-headers"]

  - id: reacting.actions.js-plain-error-is-runtime-error
    title: Throwing an ordinary JS Error is a runtime error, not a chosen response
