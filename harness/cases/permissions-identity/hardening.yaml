# Authorization hardening PageLove documented after the port (docs snapshot
# 2026-11-23; spec R-PERM-120..128).
# NOTE for the runner: rule bodies contain PageLove lookups such as
# ${request.headers.x-owner}; only ${P}, ${HOST}, ${SINK} and captured names
# are substituted by the harness.
cases:
  - id: authz.harden.selector-value-literal
    title: "A value filled into a rule's selector is literal text and cannot add selectors"
    area: permissions-identity
    feature: templated selector
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §A substituted value in a selector is a literal (snapshot 2026-11-23)"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><p id="a" data-owner="bob">bob's row</p><p id="b" data-owner="carol">carol's row</p></body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT">
                <meta itemprop="selector" content='[data-owner="${request.headers.x-owner}"]'>
                <meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: the owner may edit their own row
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#a", Content-Type: text/html, X-Owner: bob}, body: '<p id="a" data-owner="bob">edited</p>'}
        expect: {status: 206}
      - name: a value that tries to widen the selector matches nothing
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#b", Content-Type: text/html, X-Owner: 'x"], *, [data-x="'}, body: '<p id="b" data-owner="carol">taken</p>'}
        expect: {status: 401}

  - id: authz.harden.deny-blank-actor
    title: A Deny rule with an empty actor refuses everyone instead of being dropped
    area: permissions-identity
    feature: incomplete rules
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §A rule with a missing actor, resource or method (snapshot 2026-11-23)"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content=""><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="deny">
              </div>
            </body></html>
    steps:
      - name: the wildcard allow is outweighed by the deny
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>X</h1>'}
        expect: {status: 401}

  - id: authz.harden.deny-no-resource
