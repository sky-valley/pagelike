  - id: authz.harden.deny-bad-selector
    title: A Deny rule whose selector cannot be parsed covers the whole resource
    area: permissions-identity
    feature: selector scope
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §A deny with a selector that cannot be read refuses (snapshot 2026-11-23)"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1><p id="a">A</p></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="selector" content="p[[[">
                <meta itemprop="action" content="deny">
              </div>
            </body></html>
    steps:
      - name: an element write is refused
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#a", Content-Type: text/html}, body: '<p id="a">B</p>'}
        expect: {status: 401}
      - name: a whole-page write is refused
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body><h1>X</h1></body></html>'}
        expect: {status: 401}

  - id: authz.harden.actor-value-literal
    title: "A value filled into an Allow actor matches only that literal name, never a built-in group"
    area: permissions-identity
    feature: templated actor
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §A substituted value in an actor of an Allow rule matches only as that name (snapshot 2026-11-23)"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="${request.headers.x-who}"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      alice: {sub: alice, email: alice@example.com, email_verified: true, roles: []}
    steps:
      - name: own name matches
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html, X-Who: alice}, body: '<h1>A</h1>'}
        expect: {status: 206}
      - name: users does not act as the built-in group
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html, X-Who: users}, body: '<h1>B</h1>'}
        expect: {status: 403}
      - name: authenticated does not act as the built-in group
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html, X-Who: authenticated}, body: '<h1>C</h1>'}
        expect: {status: 403}

  - id: authz.harden.group-lookup-fails-closed
    title: A Group whose includes() fails refuses the request with 502 instead of treating the person as in no group
    area: permissions-identity
    feature: Group subtype includes()
    evidence: documented
    source: "docs reference/permissions/Group §When the group lookup fails (snapshot 2026-11-23)"
    confidence: medium
    requires: [multi-actor, sessel]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/schemas.html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Schema">
              <meta itemprop="type" content="https://example.com/BrokenGroup">
              <meta itemprop="name" content="BrokenGroup">
              <meta itemprop="parent" content="https://pagelove.org/Group">
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Method">
                <meta itemprop="name" content="includes">
                <meta itemprop="returns" content="https://schema.host/Boolean">
                <div itemprop="parameter" itemscope itemtype="https://pagelove.org/Parameter">
                  <meta itemprop="name" content="email">
                  <meta itemprop="type" content="https://schema.host/Text">
                </div>
                <div itemprop="implementation" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">email.noSuchMethod()</script>
                </div>
              </div>
            </div>
            </body></html>
        - path: "${P}/groups.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://example.com/BrokenGroup"><span itemprop="name">banned</span></div>
            </body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="users"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="Allow">
              </div>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="banned"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="Deny">
              </div>
            </body></html>
    actors:
      alice: {sub: alice, email: alice@example.com, email_verified: true, roles: []}
    steps:
      - name: refused with 502, nothing stored
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 502}
      - name: unchanged
        as: author
        plane: dav
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 200, body_contains: ["<h1>T</h1>"]}

  - id: authz.harden.sse-needs-page-get
    title: A GET grant limited to a selector does not open an event stream
    area: permissions-identity
    feature: SSE authorization
    evidence: documented
    source: "docs reference/reading-and-writing/Server-Sent-Events ('Subscribing needs a GET allow for the whole page') (snapshot 2026-11-23)"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1><p id="a">A</p></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="GET"><meta itemprop="selector" content="#a">
                <meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: subscribe refused
        as: anonymous
        request: {method: GET, path: "${P}/doc.html", headers: {Accept: text/event-stream}}
        expect: {status: 401}
