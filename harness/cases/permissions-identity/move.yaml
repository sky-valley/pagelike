              <section id="lane-todo" class="lane"><article id="card-1" class="card">One</article></section>
              <section id="lane-done" class="lane"></section>
            </body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/board.html">
                <meta itemprop="method" content="GET"><meta itemprop="action" content="Deny">
              </div>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/board.html">
                <meta itemprop="method" content="MOVE"><meta itemprop="action" content="Allow">
              </div>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/board.html">
                <meta itemprop="method" content="DELETE"><meta itemprop="selector" content=".card">
                <meta itemprop="action" content="Allow">
              </div>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/board.html">
                <meta itemprop="method" content="POST"><meta itemprop="selector" content=".lane">
                <meta itemprop="action" content="Allow">
              </div>
            </body></html>
    steps:
      - name: missing source on an unreadable page
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-9", Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 401}
      - name: an existing card still moves (write allowed without read)
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-1", Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 204}

  - id: authz.move.denied-authenticated-403
    title: MOVE denials are 401 anonymous, 403 authenticated (editors example)
    area: permissions-identity
    feature: MOVE denials
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Denials, §Example: allowing editors to reorder cards"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/board.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <section id="lane-todo" class="lane"><article id="card-1" class="card">One</article><article id="card-2" class="card">Two</article></section>
              <section id="lane-done" class="lane"><article id="card-3" class="card">Three</article></section>
            </body></html>
        - path: "${P}/groups.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://pagelove.org/Group">
              <meta itemprop="name" content="editors"><meta itemprop="member" content="alice@example.com">
            </div></body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body><table itemscope itemtype="https://pagelove.org/AuthorizationRule"><tbody>
              <tr><td itemprop="actor">editors</td><td itemprop="resource">${P}/board.html</td>
                  <td itemprop="method">MOVE</td><td itemprop="selector"></td><td itemprop="action">Allow</td></tr>
            </tbody></table>
            <table itemscope itemtype="https://pagelove.org/AuthorizationRule"><tbody>
              <tr><td itemprop="actor">editors</td><td itemprop="resource">${P}/board.html</td>
                  <td itemprop="method">DELETE</td><td itemprop="selector">.card</td><td itemprop="action">Allow</td></tr>
            </tbody></table>
            <table itemscope itemtype="https://pagelove.org/AuthorizationRule"><tbody>
              <tr><td itemprop="actor">editors</td><td itemprop="resource">${P}/board.html</td>
                  <td itemprop="method">POST</td><td itemprop="selector">.lane</td><td itemprop="action">Allow</td></tr>
            </tbody></table></body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
      bob: {sub: sub-bob, email: bob@example.com, email_verified: true, roles: []}
    steps:
      - name: anonymous refused with 401
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-1", Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 401}
      - name: non-editor refused with 403
        as: bob
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-1", Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 403}
      - name: editor moves the card
        as: alice
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-1", Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 204}
