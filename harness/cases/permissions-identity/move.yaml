              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/board.html">
                <meta itemprop="method" content="POST"><meta itemprop="selector" content=".lane">
                <meta itemprop="action" content="Allow">
              </div>
            </body></html>
    steps:
      - name: MOVE refused
        as: anonymous
