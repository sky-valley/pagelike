  - id: authz.move.source-absent-readable-416
    title: A missing MOVE source or anchor is refused (401) when DELETE/POST are granted only by selector-scoped rules, even on a readable page
    area: permissions-identity
    feature: MOVE absence vs denial
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/authz-move-source-absent-readable-416.json (401 for both); docs reference/reading-and-writing/MOVE-method §Error cases (source no match -> 416)"
    confidence: high
    requires: []
    live: true
    notes: >-
      The id keeps its original name. PageLove cannot run the DELETE (source) or POST (anchor)
      element check on an absent element, so it refuses unless that method is granted on the whole
      document (protocol.move.source-absent-416 and destination-absent-404, with document-level
      rules, still answer 416/404); R-PERM-49 as reconciled (docs/compat/decisions.md).
    site:
      files:
        - path: "${P}/board.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <section id="lane-todo" class="lane"><article id="card-1" class="card">One</article></section>
              <section id="lane-done" class="lane"></section>
            </body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/board.html">
                <meta itemprop="method" content="GET"><meta itemprop="method" content="MOVE">
                <meta itemprop="action" content="Allow">
              </div>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/board.html">
                <meta itemprop="method" content="DELETE"><meta itemprop="selector" content=".card">
                <meta itemprop="action" content="Allow">
              </div>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/board.html">
                <meta itemprop="method" content="POST"><meta itemprop="selector" content=".lane">
                <meta itemprop="action" content="Allow">
              </div>
            </body></html>
    steps:
      - name: missing source
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-9", Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 401}
      - name: missing destination
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-1", Destination: "${P}/board.html", Destination-Range: "selector=#lane-nope; placement=append"}
        expect: {status: 401}

