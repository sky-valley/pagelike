# MOVE authorization (spec R-PERM-5, 47..49).
# All element moves use this board:
#   #lane-todo.lane > #card-1.card, #card-2.card ; #lane-done.lane > #card-3.card
cases:
  - id: authz.move.no-rule-denied
    title: MOVE is default-deny even on a host that allows unmatched reads
    area: permissions-identity
    feature: MOVE authorization
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Authorization ('MOVE is always default-deny')"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/board.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <section id="lane-todo" class="lane"><article id="card-1" class="card">One</article><article id="card-2" class="card">Two</article></section>
              <section id="lane-done" class="lane"><article id="card-3" class="card">Three</article></section>
            </body></html>
    steps:
      - name: element MOVE with no rules
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-1", Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 401}

  - id: authz.move.three-checks-allow
    title: MOVE succeeds when MOVE (document), DELETE (source) and POST (destination) are all granted
    area: permissions-identity
    feature: MOVE authorization
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §The three checks, §Example: allowing editors to reorder cards (actor changed to * for an anonymous run)"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/board.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <section id="lane-todo" class="lane"><article id="card-1" class="card">One</article><article id="card-2" class="card">Two</article></section>
              <section id="lane-done" class="lane"><article id="card-3" class="card">Three</article></section>
            </body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <table itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <tbody>
                <tr><td itemprop="actor">*</td><td itemprop="resource">${P}/board.html</td>
                    <td itemprop="method">MOVE</td><td itemprop="selector"></td><td itemprop="action">Allow</td></tr>
              </tbody>
            </table>
            <table itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <tbody>
                <tr><td itemprop="actor">*</td><td itemprop="resource">${P}/board.html</td>
                    <td itemprop="method">DELETE</td><td itemprop="selector">.card</td><td itemprop="action">Allow</td></tr>
              </tbody>
            </table>
            <table itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <tbody>
                <tr><td itemprop="actor">*</td><td itemprop="resource">${P}/board.html</td>
                    <td itemprop="method">POST</td><td itemprop="selector">.lane</td><td itemprop="action">Allow</td></tr>
              </tbody>
            </table>
            </body></html>
    steps:
      - name: append card-1 to the done lane
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-1", Destination: "${P}/board.html", Destination-Range: "selector=#lane-done; placement=append"}
        expect: {status: 204}
      - name: card-1 is now in the done lane
        as: author
        plane: dav
        request: {method: GET, path: "${P}/board.html"}
        expect:
          status: 200
          body_contains: ['<article id="card-3" class="card">Three</article><article id="card-1" class="card">One</article>']
      - name: reorder with placement=before (POST keyed on the anchor's parent lane)
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers: {Range: "selector=#card-1", Destination: "${P}/board.html", Destination-Range: "selector=#card-3; placement=before"}
        expect: {status: 204}

  - id: authz.move.missing-delete-rule
    title: Without a DELETE grant on the source, MOVE is refused (check 2)
    area: permissions-identity
    feature: MOVE authorization
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §The three checks ('Granting MOVE alone is not sufficient')"
