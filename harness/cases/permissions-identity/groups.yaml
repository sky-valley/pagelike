# Groups (spec R-PERM-58..62).
cases:
  - id: authz.group.document-grants-members
    title: A Group document grants its verified-email members the group name as an actor (recipe)
    area: permissions-identity
    feature: Group document
    evidence: documented
    source: "docs recipes/group-based-permissions §Store a group document, §Name the group in a rule; reference/permissions/Group"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/blog/post.html"
          body: '<!DOCTYPE html><html><body><h1>Post</h1><ul id="comments"></ul></body></html>'
        - path: "${P}/groups.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelove.org/Group">
                <meta itemprop="name" content="editors">
                <meta itemprop="member" content="alice@example.com">
                <meta itemprop="member" content="bob@example.com">
              </div>
            </body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="editors">
                <meta itemprop="resource" content="${P}/blog/*">
                <meta itemprop="method" content="POST">
                <meta itemprop="method" content="PUT">
                <meta itemprop="method" content="DELETE">
                <meta itemprop="action" content="Allow">
              </div>
            </body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
      bob: {sub: sub-bob, email: bob@example.com, email_verified: true, roles: []}
      carol: {sub: sub-carol, email: carol@example.com, email_verified: true, roles: []}
    steps:
      - name: member alice PUT
        as: alice
        request: {method: PUT, path: "${P}/blog/post.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 206}
      - name: member bob POST
        as: bob
        request: {method: POST, path: "${P}/blog/post.html", headers: {Range: "selector=#comments", Content-Type: text/html}, body: '<li>hi</li>'}
        expect: {status: 206}
      - name: non-member carol refused
        as: carol
        request: {method: PUT, path: "${P}/blog/post.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>C</h1>'}
        expect: {status: 403}

  - id: authz.group.unverified-email-not-member
    title: An unverified email never makes a principal a group member
    area: permissions-identity
    feature: Group verified-email gate
    evidence: documented
    source: "docs reference/permissions/Group §Verified email only"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/groups.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://pagelove.org/Group">
              <meta itemprop="name" content="editors"><meta itemprop="member" content="alice@example.com">
            </div></body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="editors"><meta itemprop="resource" content="${P}/doc.html">
              <meta itemprop="method" content="PUT"><meta itemprop="action" content="Allow">
            </div></body></html>
    actors:
      mallory: {sub: sub-mallory, email: alice@example.com, email_verified: false, roles: []}
    steps:
      - name: unverified claimant refused
        as: mallory
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>M</h1>'}
        expect: {status: 403}

  - id: authz.group.membership-change-next-request
    title: Editing the Group document changes membership on the next request, without touching rules
    area: permissions-identity
    feature: Group membership changes
    evidence: documented
    source: "docs recipes/group-based-permissions §Change membership without touching rules"
    confidence: high
    requires: [multi-actor]
    live: false
    notes: The group document is rewritten through the public plane (a rule lets anyone PUT it) so the change binds immediately on PageLove too.
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/groups.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://pagelove.org/Group">
              <meta itemprop="name" content="editors">
              <meta itemprop="member" content="alice@example.com">
              <meta itemprop="member" content="bob@example.com">
            </div></body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="editors"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="Allow">
              </div>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/groups.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="Allow">
              </div>
            </body></html>
    actors:
      bob: {sub: sub-bob, email: bob@example.com, email_verified: true, roles: []}
      dave: {sub: sub-dave, email: dave@example.com, email_verified: true, roles: []}
    steps:
      - name: bob is a member
        as: bob
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>B</h1>'}
        expect: {status: 206}
      - name: dave is not yet a member
        as: dave
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>D</h1>'}
        expect: {status: 403}
      - name: replace membership (remove bob, add dave)
        as: anonymous
        request:
          method: PUT
          path: "${P}/groups.html"
          headers: {Content-Type: text/html}
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://pagelove.org/Group">
              <meta itemprop="name" content="editors">
              <meta itemprop="member" content="alice@example.com">
              <meta itemprop="member" content="dave@example.com">
            </div></body></html>
        expect: {status: [200, 201, 204]}
      - name: bob lost access
        as: bob
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>B2</h1>'}
        expect: {status: 403}
      - name: dave gained access
        as: dave
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>D2</h1>'}
        expect: {status: 206}

  - id: authz.group.stored-anywhere
    title: A Group item works from any document on the host (nested path, inside unrelated markup)
    area: permissions-identity
    feature: Group document location
    evidence: documented
    source: "docs reference/permissions/Group §The Group document ('stored anywhere on the host')"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/deep/nested/team.html"
          body: |
            <!DOCTYPE html>
            <html><body><main><section>
              <h2>Team</h2>
              <div itemscope itemtype="https://pagelove.org/Group">
                <span itemprop="name">reviewers</span>
                <meta itemprop="member" content="carol@example.com">
              </div>
            </section></main></body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="reviewers"><meta itemprop="resource" content="${P}/doc.html">
              <meta itemprop="method" content="PUT"><meta itemprop="action" content="Allow">
            </div></body></html>
    actors:
      carol: {sub: sub-carol, email: carol@example.com, email_verified: true, roles: []}
    steps:
      - name: member allowed
        as: carol
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>C</h1>'}
        expect: {status: 206}

