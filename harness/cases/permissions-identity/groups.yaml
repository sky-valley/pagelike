  - id: authz.group.oidc-roles-claim
    title: The OIDC roles claim supplies group membership without any Group document
    area: permissions-identity
    feature: OIDC roles
    evidence: documented
    source: "docs reference/permissions/Group §Other sources of membership; reference/permissions/AuthorizationRule §Groups and membership"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="GET"><meta itemprop="action" content="Deny">
              </div>
              <div itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="admins"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="GET"><meta itemprop="action" content="Allow">
              </div>
            </body></html>
    actors:
      ops: {sub: sub-ops, email: ops@example.com, email_verified: false, roles: [admins, staff]}
      bob: {sub: sub-bob, email: bob@example.com, email_verified: true, roles: [staff]}
    steps:
      - name: role holder reads (roles need no verified email)
        as: ops
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 200}
      - name: other role refused
        as: bob
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 403}

  - id: authz.group.subtype-includes-override
    title: A Group subtype overriding includes() decides membership (all verified emails at a domain)
    area: permissions-identity
    feature: Group subtype includes()
    evidence: documented
    source: "docs reference/permissions/Group §Custom membership: subtype Group and override includes()"
    confidence: medium
    requires: [multi-actor, sessel]
    live: false
    notes: The docs store the schema under /system/schemas/; this case keeps it under the prefix. If PageLove only loads schemas from /system/schemas/, the live variant needs root.
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/system/schemas/team-group.html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Schema">
              <meta itemprop="type" content="https://example.com/TeamGroup">
              <meta itemprop="name" content="TeamGroup">
              <meta itemprop="parent" content="https://pagelove.org/Group">
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="domain">
                <meta itemprop="type" content="https://schema.host/Text">
                <meta itemprop="cardinality" content="1..1">
              </div>
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Method">
                <meta itemprop="name" content="includes">
                <meta itemprop="returns" content="https://schema.host/Boolean">
                <div itemprop="parameter" itemscope itemtype="https://pagelove.org/Parameter">
                  <meta itemprop="name" content="email">
                  <meta itemprop="type" content="https://schema.host/Text">
                </div>
                <div itemprop="implementation" itemscope itemtype="https://pagelove.org/Sessel">
                  <script itemprop="source" type="text/sessel">email.endsWith(self.domain)</script>
                </div>
              </div>
            </div>
            </body></html>
        - path: "${P}/groups.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://example.com/TeamGroup">
                <span itemprop="name">example-staff</span>
                <meta itemprop="domain" content="@example.com">
              </div>
            </body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="example-staff"><meta itemprop="resource" content="${P}/doc.html">
              <meta itemprop="method" content="PUT"><meta itemprop="action" content="Allow">
            </div></body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
      mallory: {sub: sub-mallory, email: alice@example.com, email_verified: false, roles: []}
      zed: {sub: sub-zed, email: zed@other.org, email_verified: true, roles: []}
    steps:
      - name: verified email at the domain
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 206}
      - name: unverified email at the domain
        as: mallory
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>M</h1>'}
        expect: {status: 403}
      - name: other domain
        as: zed
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>Z</h1>'}
        expect: {status: 403}

