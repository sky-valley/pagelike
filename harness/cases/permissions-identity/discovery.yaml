        as: anonymous
        request:
          method: DELETE
          path: "${P}/doc.html"
          headers: {Range: "selector=#p1"}
        expect: {status: 401}
      - name: rule with an unknown action value does not grant POST
        as: anonymous
        request:
          method: POST
          path: "${P}/doc.html"
          headers: {Range: "selector=body", Content-Type: text/html}
          body: '<p>new</p>'
        expect: {status: 401}

