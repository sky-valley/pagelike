  - id: authz.discovery.rule-change-effective-next-request
    title: A rule document rewritten through the public plane binds on the next request
    area: permissions-identity
    feature: rule freshness
    evidence: documented
    source: "docs recipes/declaring-a-state-machine line 232 and reference/reacting-to-changes/TransitionConstraint ('rules written through the serving path bind immediately'); recipes/group-based-permissions §Change membership"
