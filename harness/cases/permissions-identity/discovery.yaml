  - id: authz.discovery.table-item-rows-are-separate-rules
    title: A table carrying itemscope with several rows (the docs' example form) yields one rule per row
    area: permissions-identity
    feature: rule field extraction (table item with rows)
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §Example: blog admin interface and reference/reading-and-writing/MOVE-method §Example (both put itemscope on <table> and one rule per <tr>)"
    confidence: medium
    requires: []
    live: true
    notes: >-
      Plain HTML Microdata would merge all rows into one item. The docs present each
      row as its own rule, so pagelike splits rows (spec R-PERM-2). Probe P-28 settled by the live
      runs (2026-09-28/29): PageLove merges the rows into one rule with the first row's selector and
      every row's methods, so row 2's DELETE is granted on row 1's h1 (an escalation the author
      never wrote) and denied on the items it names. pagelike keeps splitting rows
      (docs/compat/decisions.md, keep-documented-security);
      authz.discovery.table-item-rows-are-separate-rules.live measures the divergence.
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>T</h1><ul><li id="i1" class="item">a</li><li id="i2" class="item">b</li></ul></body></html>
        - path: "${P}/rules.html"
          body: &table_item_rules |
            <!DOCTYPE html>
            <html><body>
            <table itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <thead><tr><th>Actor</th><th>Resource</th><th>Method(s)</th><th>Selector</th><th>Action</th></tr></thead>
              <tbody>
                <tr>
                  <td itemprop="actor">*</td>
                  <td itemprop="resource">${P}/doc.html</td>
                  <td><ul><li itemprop="method">PUT</li></ul></td>
                  <td itemprop="selector">h1</td>
                  <td itemprop="action">Allow</td>
                </tr>
                <tr>
                  <td itemprop="actor">*</td>
                  <td itemprop="resource">${P}/doc.html</td>
                  <td><ul><li itemprop="method">DELETE</li></ul></td>
                  <td itemprop="selector">.item</td>
                  <td itemprop="action">Allow</td>
                </tr>
              </tbody>
            </table>
            </body></html>
    steps:
      - name: first row grants PUT on h1
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>U</h1>'}
        expect: {status: 206}
      - name: second row grants DELETE on items
        as: anonymous
        request: {method: DELETE, path: "${P}/doc.html", headers: {Range: "selector=#i2"}}
        expect: {status: 204}
      - name: rows do not mix (no PUT on items)
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#i1", Content-Type: text/html}, body: '<li id="i1" class="item">z</li>'}
        expect: {status: 401}
      - name: rows do not mix (no DELETE on h1)
        as: anonymous
        request: {method: DELETE, path: "${P}/doc.html", headers: {Range: "selector=h1"}}
        expect: {status: 401}

