  - id: authz.conflict.selector-level-user-over-wildcard
    title: Tiers also decide among selector-level rules on the same element
    area: permissions-identity
    feature: conflict resolution (selector granularity)
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §Conflict resolution ('The same resolution applies at both granularities')"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><p id="l" class="locked">x</p></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="selector" content=".locked">
                <meta itemprop="action" content="deny">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="sub-alice"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="selector" content=".locked">
                <meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
