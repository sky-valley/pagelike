              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="sub-alice"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="selector" content=".mine">
                <meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
    steps:
      - name: alice may PUT her element
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#m", Content-Type: text/html}, body: '<p id="m" class="mine">y</p>'}
        expect: {status: 206}
      - name: alice may not PUT other elements
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>y</h1>'}
        expect: {status: 403}

