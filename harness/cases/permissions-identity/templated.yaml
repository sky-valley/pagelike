    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/m/${request.query.nope}x.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: pattern collapsed to .../m/x.html
        as: anonymous
        request: {method: PUT, path: "${P}/m/x.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: [200, 201, 204]}

