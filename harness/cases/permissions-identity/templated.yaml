# Templated rule values (spec R-PERM-30..37).
# NOTE for the runner: rule bodies contain PageLove lookups such as ${request.method};
# only ${P}, ${HOST}, ${SINK} and captured names may be substituted.
cases:
  - id: authz.template.request-method-in-selector
    title: "${request.method} in a selector is filled in per request"
    area: permissions-identity
    feature: templated selector
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §Templated values (lookup object: request.method)"
    confidence: medium
    requires: []
    live: true
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><p id="p1" data-m="PUT">put me</p><p id="p2" data-m="DELETE">delete me</p></body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="method" content="DELETE">
                <meta itemprop="selector" content='[data-m="${request.method}"]'>
                <meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: PUT on the element labelled PUT
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#p1", Content-Type: text/html}, body: '<p id="p1" data-m="PUT">done</p>'}
        expect: {status: 206}
      - name: PUT on the element labelled DELETE
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#p2", Content-Type: text/html}, body: '<p id="p2" data-m="DELETE">x</p>'}
        expect: {status: 401}
      - name: DELETE on the element labelled DELETE
        as: anonymous
        request: {method: DELETE, path: "${P}/doc.html", headers: {Range: "selector=#p2"}}
        expect: {status: 204}

  - id: authz.template.header-lookup-in-selector
    title: "${request.headers.<name>} reads a request header (lowercase name)"
    area: permissions-identity
    feature: templated selector
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §Templated values (headers: every request header); pagelove-shop/site/admin-auth.html@d887054:16-18 (header names are lowercase)"
    confidence: medium
    requires: []
    live: true
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><p id="a" data-owner="bob">bob's row</p></body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT">
                <meta itemprop="selector" content='[data-owner="${request.headers.x-owner}"]'>
                <meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: matching header value
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#a", Content-Type: text/html, X-Owner: bob}, body: '<p id="a" data-owner="bob">edited</p>'}
        expect: {status: 206}
      - name: different header value
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#a", Content-Type: text/html, X-Owner: carol}, body: '<p id="a" data-owner="bob">x</p>'}
        expect: {status: 401}
      - name: header absent renders empty
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=#a", Content-Type: text/html}, body: '<p id="a" data-owner="bob">x</p>'}
        expect: {status: 401}

  - id: authz.template.query-lookup-in-resource
    title: "${request.query.<k>} in a resource pattern"
    area: permissions-identity
    feature: templated resource
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §Templated values (query_string and parsed query)"
    confidence: medium
    requires: []
    live: true
    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/q/${request.query.slot}.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: query names the path being written
        as: anonymous
        request: {method: PUT, path: "${P}/q/a.html?slot=a", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>a</body></html>'}
        expect: {status: [200, 201, 204]}
      - name: query names a different path
        as: anonymous
        request: {method: PUT, path: "${P}/q/a.html?slot=b", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>a</body></html>'}
        expect: {status: 401}

