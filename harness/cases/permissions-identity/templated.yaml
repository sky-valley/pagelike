  - id: authz.template.anonymous-auth-lookup-empty
    title: request.auth lookups are empty for anonymous requests (a per-user area grants nothing)
    area: permissions-identity
    feature: templated resource
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §Templated values ('only for an authenticated request — auth.sub, auth.username …'; nothing → empty string)"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/u/${request.auth.username}/*">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: anonymous cannot write any user area
        as: anonymous
        request: {method: PUT, path: "${P}/u/anyone/doc.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: 401}

  - id: authz.template.liquid-braces-literal-allow-stops-granting
    title: "{{ … }} in a rule is literal text: a legacy Liquid allow grants nothing"
    area: permissions-identity
    feature: Liquid removed from rules
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §Templated values ('an allow written that way simply stops granting'); pagelove-dev SKILL.md@b489923:272"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/t/{{ request.method }}.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: path a Liquid rendering would have produced is refused
        as: anonymous
        request: {method: PUT, path: "${P}/t/PUT.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: 401}

  - id: authz.template.liquid-braces-literal-deny-stops-denying
    title: "{{ … }} in a deny rule is literal text: the legacy deny stops denying"
    area: permissions-identity
    feature: Liquid removed from rules
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §Templated values ('a deny written that way stops denying')"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/d/*">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/d/{{ request.method }}.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="deny">
              </div>
            </body></html>
    steps:
      - name: write the deny was meant to block succeeds
        as: anonymous
        request: {method: PUT, path: "${P}/d/PUT.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: [200, 201, 204]}

  - id: authz.template.header-value-is-literal-in-resource
    title: Glob characters arriving through a substituted value are literal
    area: permissions-identity
    feature: templated resource literal substitution
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §A substituted value in a resource is a literal"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/h/${request.headers.x-slot}/*">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: X-Slot star does not expand to other areas
        as: anonymous
        request: {method: PUT, path: "${P}/h/a/doc.html", headers: {Content-Type: text/html, X-Slot: "*"}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: 401}
      - name: X-Slot matching the area
        as: anonymous
        request: {method: PUT, path: "${P}/h/a/doc.html", headers: {Content-Type: text/html, X-Slot: a}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: [200, 201, 204]}
      - name: the author's trailing star still works below the area
        as: anonymous
        request: {method: PUT, path: "${P}/h/a/deeper/doc.html", headers: {Content-Type: text/html, X-Slot: a}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: [200, 201, 204]}

  - id: authz.template.substituted-slash-spans-segments
    title: A substituted value containing / still spans path segments (documented open issue)
    area: permissions-identity
    feature: templated resource literal substitution
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §A substituted value in a resource is a literal ('a substituted value containing / still spans two path segments')"
    confidence: medium
    requires: []
    live: true
    notes: Upstream tracks making this inert; if it changes, this case flips to 401.
    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/h/${request.headers.x-slot}/*">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: X-Slot a/b reaches .../h/a/b/...
        as: anonymous
        request: {method: PUT, path: "${P}/h/a/b/doc.html", headers: {Content-Type: text/html, X-Slot: a/b}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: [200, 201, 204]}

  - id: authz.template.username-in-resource
    title: Per-user areas with ${request.auth.username} and the :username shorthand
    area: permissions-identity
    feature: templated resource
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §A substituted value in a resource is a literal ('/users/${request.auth.username}/* grants each signed-in user the area named after them'); §Templated values (:username shorthand)"
    confidence: medium
    notes: The first two steps are documented (high); the :username-in-resource step is low confidence (shorthand documented for lookups generally).
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="users"><meta itemprop="resource" content="${P}/users/${request.auth.username}/*">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="users"><meta itemprop="resource" content="${P}/legacy/:username/*">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
    steps:
      - name: own area
        as: alice
        request: {method: PUT, path: "${P}/users/sub-alice/notes.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>mine</body></html>'}
        expect: {status: [200, 201, 204]}
      - name: someone else's area
        as: alice
        request: {method: PUT, path: "${P}/users/sub-bob/notes.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>theirs</body></html>'}
        expect: {status: 403}
      - name: ":username shorthand in a resource"
        as: alice
        request: {method: PUT, path: "${P}/legacy/sub-alice/notes.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>mine</body></html>'}
        expect: {status: [200, 201, 204]}

  - id: authz.template.username-literal-glob
    title: A user whose sub contains * gets only the area named exactly that
    area: permissions-identity
    feature: templated resource literal substitution
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §A substituted value in a resource is a literal ('If a principal's name happens to contain *, ?, [ or {, the rule matches the area whose name is exactly that')"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="users"><meta itemprop="resource" content="${P}/users/${request.auth.username}/*">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      star: {sub: "a*", email: star@example.com, email_verified: true, roles: []}
    steps:
      - name: literal area named a*
        as: star
        request: {method: PUT, path: "${P}/users/a*/x.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: [200, 201, 204]}
      - name: area ab is not covered
        as: star
        request: {method: PUT, path: "${P}/users/ab/x.html", headers: {Content-Type: text/html}, body: '<!DOCTYPE html><html><body>x</body></html>'}
        expect: {status: 403}

