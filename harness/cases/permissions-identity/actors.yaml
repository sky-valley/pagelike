    steps:
      - name: alice refused
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 403}

  - id: authz.actor.401-vs-403
    title: The same refusal is 401 for anonymous and 403 for a signed-in principal
    area: permissions-identity
    feature: 401 vs 403
    evidence: documented
    source: "docs reference/reading-and-writing/MOVE-method §Denials; PUT/POST/DELETE-method notes ('gets 401/403'); reference/permissions/AuthorizationRule §Testable examples"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="*"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="GET"><meta itemprop="action" content="deny">
              </div>
            </body></html>
    actors:
      bob: {sub: sub-bob, email: bob@example.com, email_verified: true, roles: []}
    steps:
      - name: anonymous read refused with 401
        as: anonymous
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 401}
      - name: signed-in read refused with 403
        as: bob
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 403}
      - name: signed-in write with no rule refused with 403
        as: bob
