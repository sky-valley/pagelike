    steps:
      - name: ":username"
        as: bob
        request: {method: PUT, path: "${P}/a.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>B</h1>'}
        expect: {status: 206}
      - name: "${username}"
        as: bob
        request: {method: PUT, path: "${P}/b.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>B</h1>'}
        expect: {status: 206}
      - name: "${request.auth.username}"
        as: bob
        request: {method: PUT, path: "${P}/c.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>B</h1>'}
        expect: {status: 206}
      - name: anonymous never matches
        as: anonymous
        request: {method: PUT, path: "${P}/a.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>X</h1>'}
        expect: {status: 401}

  - id: authz.actor.username-token-tier-above-users
    title: ":username outranks users; migrating to users lets an equal-tier deny win"
    area: permissions-identity
    feature: actor deprecated :username
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §:username as an actor is deprecated ('swapping :username for users lowers a rule's tier')"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/old.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/new.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/groups.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://pagelove.org/Group">
              <meta itemprop="name" content="suspended"><meta itemprop="member" content="alice@example.com">
            </div></body></html>
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="suspended">
                <meta itemprop="resource" content="${P}/old.html"><meta itemprop="resource" content="${P}/new.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="deny">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content=":username"><meta itemprop="resource" content="${P}/old.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="users"><meta itemprop="resource" content="${P}/new.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
    steps:
      - name: ":username allow outranks a group deny"
        as: alice
        request: {method: PUT, path: "${P}/old.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 206}
      - name: users allow ties with the group deny, so deny wins
        as: alice
        request: {method: PUT, path: "${P}/new.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 403}

