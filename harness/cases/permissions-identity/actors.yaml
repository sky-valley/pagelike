# Actor forms (spec R-PERM-9..18, 54).
cases:
  - id: authz.actor.user-name-is-sub
    title: A user-name actor matches the OIDC sub, never the display name or email local part
    area: permissions-identity
    feature: actor user name
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §actor ('the request principal's OIDC sub'); languages/sessel/reference/syntax (request.auth.username = sub)"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/by-sub.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/by-name.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="sub-alice"><meta itemprop="resource" content="${P}/by-sub.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="Alice"><meta itemprop="actor" content="alice">
                <meta itemprop="resource" content="${P}/by-name.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      alice: {sub: sub-alice, name: Alice, email: alice@example.com, email_verified: true, roles: []}
    steps:
      - name: sub matches
        as: alice
        request: {method: PUT, path: "${P}/by-sub.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 206}
      - name: display name does not match
        as: alice
        request: {method: PUT, path: "${P}/by-name.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 403}

  - id: authz.actor.verified-email
    title: An email actor matches only a verified email; unverified or absent emails never match
    area: permissions-identity
    feature: actor verified email
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §actor ('only when that email is verified')"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="alice@example.com"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
      mallory: {sub: sub-mallory, email: alice@example.com, email_verified: false, roles: []}
      nomail: {sub: sub-nomail, email_verified: false, roles: []}
    steps:
      - name: verified email matches
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 206}
      - name: same email unverified does not match
        as: mallory
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>M</h1>'}
        expect: {status: 403}
      - name: absent email does not match
        as: nomail
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>N</h1>'}
        expect: {status: 403}

  - id: authz.actor.email-exact-case
    title: Email actors are compared exactly (case-sensitive)
    area: permissions-identity
    feature: actor verified email
    evidence: inferred
    source: "docs reference/permissions/Group §Fields ('matched exactly'); no source discusses case"
    confidence: low
    requires: [multi-actor]
    live: false
    notes: Probe P-12. Case-insensitive domain comparison would be defensible; pagelike keeps exact matching until observed.
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="Alice@Example.com"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
    steps:
      - name: differently-cased email does not match
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 403}

  - id: authz.actor.users-builtin
    title: users matches every signed-in principal and no anonymous request
    area: permissions-identity
    feature: actor users
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §actor ('To say any signed-in user, write users')"
    confidence: high
    requires: [multi-actor]
    live: false
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="users"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    actors:
      mallory: {sub: sub-mallory, email: alice@example.com, email_verified: false, roles: []}
    steps:
      - name: any signed-in principal (even with an unverified email)
        as: mallory
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>M</h1>'}
        expect: {status: 206}
      - name: anonymous refused
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>X</h1>'}
        expect: {status: 401}

  - id: authz.actor.users-anonymous-live
    title: users and authenticated never match an anonymous request
    area: permissions-identity
    feature: actor users
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §actor ('Neither matches an anonymous request')"
    confidence: high
    requires: []
    live: true
    site:
      files:
        - path: "${P}/doc.html"
          body: '<!DOCTYPE html><html><body><h1>T</h1><p id="p">x</p></body></html>'
        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="users"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="PUT"><meta itemprop="action" content="allow">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content="authenticated"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="DELETE"><meta itemprop="action" content="allow">
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <meta itemprop="actor" content=":username"><meta itemprop="resource" content="${P}/doc.html">
                <meta itemprop="method" content="POST"><meta itemprop="action" content="allow">
              </div>
            </body></html>
    steps:
      - name: users does not admit anonymous PUT
        as: anonymous
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>X</h1>'}
        expect: {status: 401}
      - name: authenticated does not admit anonymous DELETE
        as: anonymous
        request: {method: DELETE, path: "${P}/doc.html", headers: {Range: "selector=#p"}}
        expect: {status: 401}
      - name: ":username does not admit anonymous POST"
        as: anonymous
        request: {method: POST, path: "${P}/doc.html", headers: {Range: "selector=body", Content-Type: text/html}, body: '<p>x</p>'}
        expect: {status: 401}

