        - path: "${P}/rules.html"
          body: |
            <!DOCTYPE html>
            <html><body><table><tbody>
              <tr itemscope itemtype="https://pagelove.org/AuthorizationRule">
                <td><ul><li itemprop="actor">sub-alice</li><li itemprop="actor">bob@example.com</li></ul></td>
                <td itemprop="resource">${P}/doc.html</td>
                <td itemprop="method">PUT</td><td itemprop="selector"></td><td itemprop="action">allow</td>
              </tr>
            </tbody></table></body></html>
    actors:
      alice: {sub: sub-alice, email: alice@example.com, email_verified: true, roles: []}
      bob: {sub: sub-bob, email: bob@example.com, email_verified: true, roles: []}
      carol: {sub: sub-carol, email: carol@example.com, email_verified: true, roles: []}
    steps:
      - name: alice by sub
        as: alice
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>A</h1>'}
        expect: {status: 206}
      - name: bob by email
        as: bob
        request: {method: PUT, path: "${P}/doc.html", headers: {Range: "selector=h1", Content-Type: text/html}, body: '<h1>B</h1>'}
