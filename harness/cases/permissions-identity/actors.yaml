  - id: authz.actor.multiple-values-or
    title: Several actor values are OR-ed
    area: permissions-identity
    feature: actor multi-valued
    evidence: documented
    source: "docs reference/permissions/AuthorizationRule §actor ('Multiple actor values express OR semantics')"
    confidence: high
    requires: [multi-actor]
