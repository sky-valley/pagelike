          method: PUT
          path: "${P}/data/orders/o1.html"
          headers: {Content-Type: "text/html; charset=utf-8", If-Match: "${e1}"}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://shop.example/Order" id="order-o1"><meta itemprop="orderId" content="o1"><meta itemprop="paymentStatus" content="cancelled"></div></body></html>'
        expect: {status: 412}
      # Live 2026-09-29 (docs/compat/decisions-2026-09-29/modeling.md): PageLove checks no shape on a
      # WebDAV PUT, so the closed Order shape does not stop the worker's writes; the worker must not rely on it.
      - name: an order carrying a script is stored (dav PUTs are not shape-checked)
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/data/orders/o2.html"
          headers: {Content-Type: "text/html; charset=utf-8", If-None-Match: "*"}
          body: '<!DOCTYPE html><html><body><div itemscope itemtype="https://shop.example/Order" id="order-o2"><meta itemprop="orderId" content="o2"><script>alert(1)</script></div></body></html>'
        expect: {status: 201}
      - name: it was stored as sent
        as: author
        plane: dav
        request: {method: GET, path: "${P}/data/orders/o2.html"}
        expect: {status: 200, body_contains: ["<script>alert(1)</script>"]}
