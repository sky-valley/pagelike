    area: apps
    feature: "demo: resource exchange"
    evidence: demo-source
    source: "demo-apps demo-03-resource-exchange/schema/listing.html@c4dd883:5-91, index.html:60-225, app.js:91-137, 165-185; docs recipes/declaring-a-state-machine (snapshot 2026-09-28)"
