    steps:
      - name: alice claims the ladder (Claim record)
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-claims"}
          body: '<li class="claim" id="claim-listing-ladder" itemscope itemtype="https://pagelike.test${P}/vocab/Claim"><meta itemprop="listingId" content="listing-ladder"><meta itemprop="claimant" content="alice"><meta itemprop="claimedAt" content="2026-09-28T10:00:00.000Z"></li>'
        expect: {status: [200, 201, 206]}
      - name: "open → claimed"
        as: anonymous
        request:
          method: PUT
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#status-listing-ladder"}
          body: '<span class="status-tag" id="status-listing-ladder" data-status="claimed" itemprop="status">claimed</span>'
        expect: {status: [200, 204, 206]}
      - name: "ben also sets claimed: same value, not a transition, so it passes (W-22)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#status-listing-ladder"}
          body: '<span class="status-tag" id="status-listing-ladder" data-status="claimed" itemprop="status">claimed</span>'
        expect: {status: [200, 204, 206]}
      - name: but ben's Claim record collides on listingId
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-claims"}
          body: '<li class="claim" id="claim-listing-ladder-b" itemscope itemtype="https://pagelike.test${P}/vocab/Claim"><meta itemprop="listingId" content="listing-ladder"><meta itemprop="claimant" content="ben"><meta itemprop="claimedAt" content="2026-09-28T10:00:01.000Z"></li>'
        expect: {status: 422, body_matches: '(?i)uniqueness'}
      - name: "claimed → completed"
        as: anonymous
        request:
          method: PUT
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#status-listing-ladder"}
          body: '<span class="status-tag" id="status-listing-ladder" data-status="completed" itemprop="status">completed</span>'
        expect: {status: [200, 204, 206]}
      - name: "completed → claimed is not declared"
        as: anonymous
        request:
          method: PUT
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#status-listing-ladder"}
          body: '<span class="status-tag" id="status-listing-ladder" data-status="claimed" itemprop="status">claimed</span>'
        expect: {status: 422}
      - name: "open → completed on the drill skips a step"
        as: anonymous
        request:
          method: PUT
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#status-listing-drill"}
          body: '<span class="status-tag" id="status-listing-drill" data-status="completed" itemprop="status">completed</span>'
        expect: {status: 422}
      - name: a new listing enters at open (entry rule)
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-listings"}
          body: '<li class="listing" id="listing-tent" data-author="elena" data-type="have" itemscope itemtype="https://pagelike.test${P}/vocab/Listing"><meta itemprop="listingId" content="listing-tent"><span class="listing-type" data-type="have" itemprop="listingType">Have</span><h2 class="listing-title" itemprop="title">Tent</h2><p class="listing-desc" itemprop="description">Two person.</p><p class="listing-meta">by <strong itemprop="author">Elena</strong> · <span class="status-tag" id="status-listing-tent" data-status="open" itemprop="status">open</span></p><div class="listing-actions" data-listing="listing-tent"></div></li>'
        expect: {status: [200, 201, 206]}
      - name: a new listing cannot enter already claimed
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-03-resource-exchange/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-listings"}
          body: '<li class="listing" id="listing-bike" data-author="elena" data-type="have" itemscope itemtype="https://pagelike.test${P}/vocab/Listing"><meta itemprop="listingId" content="listing-bike"><span class="listing-type" data-type="have" itemprop="listingType">Have</span><h2 class="listing-title" itemprop="title">Bike</h2><p class="listing-desc" itemprop="description">Road bike.</p><p class="listing-meta">by <strong itemprop="author">Elena</strong> · <span class="status-tag" id="status-listing-bike" data-status="claimed" itemprop="status">claimed</span></p><div class="listing-actions" data-listing="listing-bike"></div></li>'
        expect: {status: 422}

  - id: apps.demos.accountability-feed-gate
    title: "Accountability: the members-only feed is 401 to anonymous readers, who may still post one check-in a day"
    area: apps
    feature: "demo: accountability"
    evidence: demo-source
    source: "demo-apps demo-04-accountability/feed.html@c4dd883:13-97, app.js:50-101, schema/checkin.html; scripts/check-live.py:59-61; README.md:45-66"
    confidence: high
    requires: []
    live: true
    notes: "R-PERM-40 (Deny * vs Allow users: different tiers), R-PERM-54, R-MOD-30/72 (checkInKey unique). The signed-in half is apps.demos.accountability-feed-member."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/demo-04-accountability/schema/checkin.html"
          body: &checkinschema |
            <!DOCTYPE html>
            <html lang="en"><head><meta charset="UTF-8"><title>Schema — CheckIn</title></head>
            <body>
            <div itemscope itemtype="https://pagelove.org/Schema">
              <meta itemprop="type" content="https://pagelike.test${P}/vocab/CheckIn">
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="checkInKey">
                <meta itemprop="type" content="https://schema.host/Text">
                <meta itemprop="cardinality" content="1..1">
                <meta itemprop="unique" content="true">
              </div>
            </div>
            </body></html>
        - path: "${P}/demo-04-accountability/feed.html"
          body: &feed |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"><title>Feed — 100 Days of Practice (members only)</title></head>
            <body>
            <ul id="pl-checkins" aria-label="Check-ins">
            <li class="checkin" id="checkin-alice-2026-08-20" data-author="alice" itemscope itemtype="https://pagelike.test${P}/vocab/CheckIn">
              <meta itemprop="checkInKey" content="2026-08-20:alice">
              <meta itemprop="author" content="alice">
              <meta itemprop="date" content="2026-08-20">
              <meta itemprop="goalProgress" content="on-track">
              <meta itemprop="note" content="Full session in, felt good today.">
              <meta itemprop="createdAt" content="2026-08-20T19:00:00Z">
            </li>
            </ul>
            <div hidden itemscope itemtype="https://pagelove.org/ShapeConstraint">
              <meta itemprop="resource" content="${P}/demo-04-accountability/feed.html">
              <meta itemprop="selector" content="#pl-checkins > li">
              <code itemprop="permit">li[class="checkin"][id^="checkin-"][data-author][itemscope][itemtype]</code>
              <code itemprop="permit">meta[itemprop="checkInKey"][content]</code>
              <code itemprop="permit">meta[itemprop="author"][content]</code>
              <code itemprop="permit">meta[itemprop="date"][content]</code>
              <code itemprop="permit">meta[itemprop="goalProgress"][content]</code>
              <code itemprop="permit">meta[itemprop="note"][content]</code>
              <code itemprop="permit">meta[itemprop="createdAt"][content]</code>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="*">
              <meta itemprop="resource" content="${P}/demo-04-accountability/feed.html">
              <meta itemprop="method" content="GET">
              <meta itemprop="action" content="Deny">
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="users">
              <meta itemprop="resource" content="${P}/demo-04-accountability/feed.html">
              <meta itemprop="method" content="GET">
              <meta itemprop="action" content="Allow">
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="*">
              <meta itemprop="resource" content="${P}/demo-04-accountability/feed.html">
              <meta itemprop="method" content="POST">
              <meta itemprop="selector" content="#pl-checkins">
              <meta itemprop="action" content="Allow">
            </div>
            </body>
            </html>
    steps:
      - name: "the gate probe: anonymous GET is a real 401"
        as: anonymous
        request: {method: GET, path: "${P}/demo-04-accountability/feed.html"}
        expect: {status: 401, body_not_contains: ["Full session in"]}
      - name: HEAD too
        as: anonymous
        request: {method: HEAD, path: "${P}/demo-04-accountability/feed.html"}
        expect: {status: 401}
      - name: an anonymous check-in is accepted
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-04-accountability/feed.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-checkins"}
          body: &bencheckin |
            <li class="checkin" id="checkin-ben-2026-09-28" data-author="ben" itemscope itemtype="https://pagelike.test${P}/vocab/CheckIn">
              <meta itemprop="checkInKey" content="2026-09-28:ben">
              <meta itemprop="author" content="ben">
              <meta itemprop="date" content="2026-09-28">
              <meta itemprop="goalProgress" content="on-track">
              <meta itemprop="note" content="">
              <meta itemprop="createdAt" content="2026-09-28T10:00:00.000Z">
            </li>
        expect: {status: [200, 201, 206]}
      - name: a second check-in by the same member on the same day is refused
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-04-accountability/feed.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-checkins"}
          body: *bencheckin
        expect: {status: 422, body_matches: '(?i)uniqueness'}

