  - id: apps.demos.directory-index
    title: "Demo routes are directory URLs served from index.html; the slash-less form redirects"
    area: apps
    feature: "demo apps: routing"
    evidence: demo-source
    source: "demo-apps scripts/check-live.py@c4dd883:12-21, 52-55; tests/demo-pages.spec.js:8-15; README.md:87-89"
    confidence: high
    requires: []
    live: true
    notes: "R-RW-3, R-RW-4, R-PERM-19 (the rule names index.html; the request uses the directory form), R-APPS-2."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/demo-01-event/index.html"
          body: |
            <!DOCTYPE html>
            <html lang="en"><head><meta charset="UTF-8"><title>Event — Trail Runners Fall Meetup</title></head>
            <body><h1>Trail Runners — Fall Meetup</h1>
            <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="*">
              <meta itemprop="resource" content="${P}/demo-01-event/index.html">
              <meta itemprop="method" content="GET">
              <meta itemprop="action" content="Allow">
            </div>
            </body></html>
        - path: "${P}/demo-01-event/app.js"
          content_type: text/javascript
          body: '(() => { "use strict"; })();'
    steps:
      - name: directory URL
        as: anonymous
        request: {method: GET, path: "${P}/demo-01-event/"}
        expect: {status: 200, body_contains: ["Trail Runners"]}
      - name: slash-less URL redirects to the directory
        as: anonymous
        request: {method: GET, path: "${P}/demo-01-event"}
        expect: {status: 301, header_matches: {Location: '^${P}/demo-01-event/$'}}
      - name: a script asset without any rule is served as JavaScript (default-GET allow)
        as: anonymous
        request: {method: GET, path: "${P}/demo-01-event/app.js?v=11"}
        expect: {status: 200, header_matches: {Content-Type: '^(text|application)/javascript'}}
