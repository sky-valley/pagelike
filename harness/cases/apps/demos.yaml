# Apps: demo-apps (research/upstream/demo-apps@c4dd883), after prepare-deploy.py.
# Spec: docs/spec/apps.md A8, §7.8 (ACC-DM-*), W-19..W-24.
# Vocabulary itemtypes are https://pagelike.test${P}/vocab/<Type> (the upstream
# __PAGELOVE_HOST__ token, made unique per run because uniqueness and schemas
# are host-wide); rule and shape resources are rewritten under ${P}.
# Every write is the demo's own writeFragment() request (app.js): Range
# "selector=…", Content-Type text/html only when there is a body.
cases:
  - id: apps.demos.event-rsvp-unique
    title: "Event demo: RSVP once per member (unique rsvpKey), cancel, promote from the waitlist"
    area: apps
    feature: "demo: event"
    evidence: demo-source
    source: "demo-apps demo-01-event/index.html@c4dd883:101-176, app.js:44-162, schema/event.html:35-55; docs/LIVE-TESTING.md §3.1"
    confidence: high
    requires: []
    live: true
    notes: "R-MOD-30, R-MOD-72 (the app shows a friendly message when the 422 body matches /uniqueness/i), R-MOD-65 (closed shapes on #pl-rsvps and #pl-rsvps > li)."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/demo-01-event/schema/event.html"
          body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"><title>Schema — RSVP</title></head>
            <body>
            <div itemscope itemtype="https://pagelove.org/Schema">
              <meta itemprop="type" content="https://pagelike.test${P}/vocab/RSVP">
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="rsvpKey"><meta itemprop="type" content="https://schema.host/Text"><meta itemprop="cardinality" content="1..1"><meta itemprop="unique" content="true">
              </div>
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="rsvpEventId"><meta itemprop="type" content="https://schema.host/Text"><meta itemprop="cardinality" content="1..1">
              </div>
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="attendee"><meta itemprop="type" content="https://schema.host/Text"><meta itemprop="cardinality" content="1..1">
              </div>
              <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                <meta itemprop="name" content="rsvpStatus"><meta itemprop="type" content="https://schema.host/Text"><meta itemprop="cardinality" content="1..1">
              </div>
            </div>
            </body>
            </html>
        - path: "${P}/demo-01-event/index.html"
          body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"><title>Event — Trail Runners Fall Meetup</title></head>
            <body>
            <h1>Trail Runners — Fall Meetup</h1>
            <ul id="pl-rsvps" aria-label="RSVPs" hidden>
              <li id="rsvp-alice" itemscope itemtype="https://pagelike.test${P}/vocab/RSVP">
                <meta itemprop="rsvpKey" content="event-fall-meetup:alice">
                <meta itemprop="rsvpEventId" content="event-fall-meetup">
                <meta itemprop="attendee" content="alice">
                <meta itemprop="rsvpStatus" content="waitlist">
              </li>
            </ul>
            <div hidden itemscope itemtype="https://pagelove.org/ShapeConstraint">
              <meta itemprop="resource" content="${P}/demo-01-event/index.html">
              <meta itemprop="selector" content="#pl-rsvps">
              <code itemprop="permit">ul[id="pl-rsvps"][aria-label][hidden]</code>
              <code itemprop="permit">li[id^="rsvp-"][itemscope][itemtype]</code>
              <code itemprop="permit">meta[itemprop="rsvpKey"][content]</code>
              <code itemprop="permit">meta[itemprop="rsvpEventId"][content]</code>
              <code itemprop="permit">meta[itemprop="attendee"][content]</code>
              <code itemprop="permit">meta[itemprop="rsvpStatus"][content]</code>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/ShapeConstraint">
              <meta itemprop="resource" content="${P}/demo-01-event/index.html">
              <meta itemprop="selector" content="#pl-rsvps > li">
              <code itemprop="permit">li[id^="rsvp-"][itemscope][itemtype]</code>
              <code itemprop="permit">meta[itemprop="rsvpKey"][content]</code>
              <code itemprop="permit">meta[itemprop="rsvpEventId"][content]</code>
              <code itemprop="permit">meta[itemprop="attendee"][content]</code>
              <code itemprop="permit">meta[itemprop="rsvpStatus"][content]</code>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="*">
              <meta itemprop="resource" content="${P}/demo-01-event/index.html">
              <meta itemprop="method" content="GET">
              <meta itemprop="action" content="Allow">
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="*">
              <meta itemprop="resource" content="${P}/demo-01-event/index.html">
              <meta itemprop="method" content="POST">
              <meta itemprop="selector" content="#pl-rsvps">
              <meta itemprop="action" content="Allow">
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="*">
              <meta itemprop="resource" content="${P}/demo-01-event/index.html">
              <meta itemprop="method" content="DELETE">
              <meta itemprop="selector" content="[id^='rsvp-']">
              <meta itemprop="action" content="Allow">
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule">
              <meta itemprop="actor" content="*">
              <meta itemprop="resource" content="${P}/demo-01-event/index.html">
              <meta itemprop="method" content="PUT">
              <meta itemprop="selector" content="[id^='rsvp-'] meta[itemprop='rsvpStatus']">
              <meta itemprop="action" content="Allow">
            </div>
            </body>
            </html>
    steps:
      - name: Elena RSVPs
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-01-event/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-rsvps"}
          body: &elena |
            <li id="rsvp-elena" itemscope itemtype="https://pagelike.test${P}/vocab/RSVP">
              <meta itemprop="rsvpKey" content="event-fall-meetup:elena">
              <meta itemprop="rsvpEventId" content="event-fall-meetup">
              <meta itemprop="attendee" content="elena">
              <meta itemprop="rsvpStatus" content="going">
            </li>
        expect: {status: [200, 201, 206]}
      - name: the same member again (from another browser) is a uniqueness violation
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-01-event/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-rsvps"}
          body: *elena
        expect: {status: 422, body_matches: '(?i)uniqueness'}
      - name: an RSVP with an attribute outside the shape is refused
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-01-event/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-rsvps"}
          body: '<li id="rsvp-farid" class="x" itemscope itemtype="https://pagelike.test${P}/vocab/RSVP"><meta itemprop="rsvpKey" content="event-fall-meetup:farid"><meta itemprop="rsvpEventId" content="event-fall-meetup"><meta itemprop="attendee" content="farid"><meta itemprop="rsvpStatus" content="going"></li>'
        expect: {status: 422}
      - name: Elena cancels
        as: anonymous
        request:
          method: DELETE
          path: "${P}/demo-01-event/index.html"
          headers: {Range: "selector=#rsvp-elena"}
        expect: {status: [200, 204]}
      - name: "waitlist promotion: PUT of the status meta by compound selector"
        as: anonymous
        request:
          method: PUT
          path: "${P}/demo-01-event/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#rsvp-alice meta[itemprop='rsvpStatus']"}
          body: '<meta itemprop="rsvpStatus" content="going">'
        expect: {status: [200, 204, 206]}
      - name: Elena can RSVP again once her RSVP is gone
        as: anonymous
        request:
          method: POST
          path: "${P}/demo-01-event/index.html"
          headers: {Content-Type: "text/html", Range: "selector=#pl-rsvps"}
          body: *elena
        expect: {status: [200, 201, 206]}
      - name: final list
        as: anonymous
        request:
          method: GET
          path: "${P}/demo-01-event/index.html"
          headers: {Range: "selector=#pl-rsvps"}
        expect:
          status: 206
          body_contains: ['id="rsvp-elena"', 'id="rsvp-alice"', 'content="going"']
          body_not_contains: ["rsvp-farid", "waitlist"]

