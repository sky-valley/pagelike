    requires: []
    live: true
    notes: "Transitions per the reacting area (TransitionConstraint strictness, entry rule); @key via <meta itemprop=\"@key\" content=\"true\"> on a unique property (R-MOD-33) pairs items in a multi-listing document. W-22: a same-value write (claimed→claimed) is not a transition and passes; the unique Claim is the real guard."
