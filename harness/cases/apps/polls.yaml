    area: apps
    feature: "template: polls"
    evidence: demo-source
    source: "pagelove-polls site/polls/kfd47o4zqd.html@c9270e5:1-16 (shipped sample poll: no <base>, no p:template, xmlns:p kept, blank lines from Liquid tags)"
