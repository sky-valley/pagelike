          body_contains: ["[{{ 'rendered' | upcase }}]"]
          body_not_contains: ["[RENDERED]"]

  - id: liquid.bind.denied-data-still-rendered
    title: A binding renders data the requester may not GET directly (build-a-blog data lock)
    feature: bindings vs authorization
    evidence: documented
    source: "docs learn/build-a-blog §Locking the data folder ('The server composes pages with its own authority'); reference/composing-pages/Resource-Binding §Security"
    confidence: high
    live: true
    notes: R-LIQ-94.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/data/posts/hello-world.html"
          body: |
            <!DOCTYPE html>
            <html lang="en"><body>
              <article itemscope itemtype="https://blog.example${P}/Post" id="post-hello-world">
                <meta itemprop="slug" content="hello-world"><meta itemprop="status" content="Published">
                <h1 itemprop="title">Hello, world</h1>
              </article>
            </body></html>
        - path: "${P}/index.html"
          body: |
            <!DOCTYPE html>
            <html lang="en" xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS"><body>
              <section id="excerpts" r:posts="[itemtype='https://blog.example${P}/Post']" p:template="text/liquid">{% for post in posts %}<h2><a href="/posts/{{ post.slug }}.html">{{ post.title }}</a></h2>{% endfor %}</section>
            </body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
        - {actor: "*", resource: "${P}/data/*", method: [GET, HEAD], action: Deny}
    steps:
      - name: raw data is refused
        as: anonymous
        request: {method: GET, path: "${P}/data/posts/hello-world.html"}
        expect:
          status: [401, 403]
      - name: the composed page still shows it
        as: anonymous
        request: {method: GET, path: "${P}/index.html"}
        expect:
          status: 200
          body_contains: ['<h2><a href="/posts/hello-world.html">Hello, world</a></h2>']

