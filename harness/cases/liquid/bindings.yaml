# Variables in scope and the value model of bound elements.
# Spec: docs/spec/liquid.md §5 (R-LIQ-40..45), §6 (R-LIQ-50..59), R-LIQ-94.
# Live isolation: resource bindings query the whole site, so every itemtype
# embeds the per-run prefix ${P}.
defaults:
  area: liquid
  requires: [liquid]
cases:
  - id: liquid.bind.people-worked-example
    title: "Worked example: a resource binding lists every Person across the site"
    feature: resource binding in templates
    evidence: documented
    source: "docs languages/liquid/templating §Worked example: listing people (GET /sspi-tpl-listing.html → <li>Anna</li> <li>Ben</li>) (snapshot 2026-09-28)"
    confidence: medium
    live: true
    notes: >-
      R-LIQ-14, R-LIQ-30, R-LIQ-51. The docs lost the stored documents (spec C-15); the template
      is reconstructed from the printed output's whitespace. The itemtype carries ${P} for isolation.
      Order Anna, Ben assumes path-ordered binding results (X-1).
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/people/anna.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://example.test${P}/Person"><span itemprop="name">Anna</span></div></body></html>
        - path: "${P}/people/ben.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://example.test${P}/Person"><span itemprop="name">Ben</span></div></body></html>
        - path: "${P}/sspi-tpl-listing.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS">
            <body>
              <h1>People</h1>
              <ul r:people="[itemtype='https://example.test${P}/Person']" p:template="text/liquid">
                {% for person in people %}
                <li>{{ person.name }}</li>
                {% endfor %}
              </ul>
            </body>
            </html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: listing
        as: anonymous
        request: {method: GET, path: "${P}/sspi-tpl-listing.html"}
        expect:
          status: 200
          body_contains: ["<h1>People</h1>", "<ul>\n    \n    <li>Anna</li>\n    \n    <li>Ben</li>\n    \n  </ul>"]
          body_not_contains: ["r:people", "p:template", "xmlns:"]

  - id: liquid.bind.teammember-sort-and-id
    title: "Templating example: sort by a property, link with ['@id'], whitespace-controlled loop"
    feature: resource binding in templates
    evidence: documented
    source: "docs languages/liquid/templating §Listing with resource binding (resource:users=\"[id][itemtype=...TeamMember]\", sort: 'fullname', user['@id'])"
    confidence: medium
    live: true
    notes: "R-LIQ-44, R-LIQ-52, R-LIQ-53. @id asserted as '<path>#<id>' suffix so an absolute URL form also passes (P-LIQ-12)."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/team.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div id="zoe" itemscope itemtype="https://example.test${P}/TeamMember"><span itemprop="fullname">Zoe Zed</span><meta itemprop="email" content="zoe@example.com"></div>
              <div id="adam" itemscope itemtype="https://example.test${P}/TeamMember"><span itemprop="fullname">Adam Ant</span><meta itemprop="email" content="adam@example.com"></div>
            </body></html>
        - path: "${P}/team-list.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:pagelove="https://pagelove.org/1.0" xmlns:resource="https://pagelove.org/Binding/CSS"><body>
            <ul id="users" pagelove:template="text/liquid"
                resource:users="[id][itemtype='https://example.test${P}/TeamMember']">
                {% assign users = users | sort: 'fullname' %}
                {%- for user in users -%}
                <li>
                    <a href="{{ user['@id'] }}">{{ user.fullname }}</a> ({{ user.email }})
                </li>
                {%- endfor -%}
            </ul>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: sorted with ids
        as: anonymous
        request: {method: GET, path: "${P}/team-list.html", headers: {Range: "selector=#users"}}
        expect:
          status: 206
          body_contains: ['${P}/team.html#adam">Adam Ant</a> (adam@example.com)', '${P}/team.html#zoe">Zoe Zed</a> (zoe@example.com)']
          body_matches: "(?s)Adam Ant.*Zoe Zed"
          body_not_contains: ["resource:users"]

  - id: liquid.bind.body-host-contacts
    title: "Resource-Binding example: r: binding and p:template together on <body>"
    feature: resource binding in templates
    evidence: documented
    source: "docs reference/composing-pages/Resource-Binding §Template rendering"
    confidence: high
    live: true
    notes: R-LIQ-21 (binding dispatched before the template on the same element), R-LIQ-4.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/c1.html"
          body: |
            <!DOCTYPE html>
            <html><body><p itemscope itemtype="https://example.test${P}/Person"><span itemprop="name">Grace Hopper</span></p></body></html>
        - path: "${P}/contacts.html"
          body: |
            <!doctype html>
            <html lang="en"
                  xmlns:r="https://pagelove.org/Binding/CSS"
                  xmlns:p="https://pagelove.org/1.0">
            <head>
                <title>Contacts List</title>
            </head>
            <body r:contacts="[itemtype='https://example.test${P}/Person']"
                  p:template="text/liquid">
                <ul id="contacts">
                    {% for contact in contacts %}
                    <li>{{ contact.name }}</li>
                    {% endfor %}
                </ul>
            </body>
            </html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/contacts.html"}
        expect:
          status: 200
          body_contains: ["<li>Grace Hopper</li>", "<title>Contacts List</title>"]
          body_not_contains: ["r:contacts", "{%"]

  - id: liquid.bind.multi-valued-route-shape
    title: A property read off a bound element is a plain value when single and a list when repeated
    feature: item property access
    evidence: documented
    source: "docs reference/modeling-data/Property §Reading a multi-valued property ('still gives you a plain value when there is exactly one'); pagelove-shop site/admin/products.html@d887054:20 (p.variant | join); site/data/products/{cap,tee}.html"
    confidence: medium
    live: true
    notes: R-LIQ-52. cap.variant.size is the string length (8) — the documented pitfall; tee.variant.size is the list length.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/products.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div id="cap" itemscope itemtype="https://example.test${P}/Product"><meta itemprop="slug" content="cap"><meta itemprop="variant" content="One size"></div>
              <div id="tee" itemscope itemtype="https://example.test${P}/Product"><meta itemprop="slug" content="tee"><meta itemprop="variant" content="S"><meta itemprop="variant" content="M"><meta itemprop="variant" content="L"></div>
            </body></html>
        - path: "${P}/shape.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS"><body>
              <div itemscope itemtype="urn:liquid:result" r:ps="[itemtype='https://example.test${P}/Product']" p:template="text/liquid">{% assign cap = ps | where: "slug", "cap" | first %}{% assign tee = ps | where: "slug", "tee" | first %}
                <span itemprop="capjoin">{{ cap.variant | join: "," }}</span>
                <span itemprop="capsize">{{ cap.variant.size }}</span>
                <span itemprop="teejoin">{{ tee.variant | join: "," }}</span>
                <span itemprop="teesize">{{ tee.variant.size }}</span>
                <span itemprop="teefirst">{{ tee.variant.first }}</span>
              </div>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/shape.html"}
        expect:
          status: 200
          microdata: {capjoin: "One size", capsize: "8", teejoin: "S,M,L", teesize: "3", teefirst: "S"}

  - id: liquid.bind.missing-property-shop-idiom
    title: "Missing property is nil; nil | join | split | first is an empty string, which is truthy (shop)"
    feature: item property access
    evidence: demo-source
    source: "pagelove-shop/site/index.html@d887054:17-26 (comment: 'yields an EMPTY STRING for shot, not nil ... TRUTHY'; test != blank)"
    confidence: medium
    live: true
    notes: R-LIQ-52, R-LIQ-57, R-LIQ-58, R-LIQ-119.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/shop-data.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div id="mug" itemscope itemtype="https://example.test${P}/Product"><meta itemprop="slug" content="mug"><meta itemprop="emoji" content="M"></div>
              <div id="cap" itemscope itemtype="https://example.test${P}/Product"><meta itemprop="slug" content="cap"><meta itemprop="emoji" content="C"><meta itemprop="image" content="/img/cap.png"></div>
            </body></html>
        - path: "${P}/shop.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS"><body>
              <div id="grid" r:products="[itemtype='https://example.test${P}/Product']" p:template="text/liquid">{% assign items = products | sort: "slug" %}{% for p in items %}{% assign shot = p.image | join: "," | split: "," | first %}[{{ p.slug }}:{% if shot %}truthy{% endif %}:{% if shot != blank %}img={{ shot }}{% else %}emoji={{ p.emoji }}{% endif %}]{% endfor %}</div>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/shop.html", headers: {Range: "selector=#grid"}}
        expect:
          status: 206
          body_contains: ["[cap:truthy:img=/img/cap.png][mug:truthy:emoji=M]"]

  - id: liquid.bind.microdata-value-kinds
    title: Property values follow the microdata value rules (meta content, time datetime, a href, img src, data value, text)
    feature: item property access
    evidence: inferred
    source: "docs reference/composing-pages/Selector-Extensions §Text content vs microdata values (shared value function, spec reading-writing R-RW-50); learn/build-a-blog (meta/time/h1 properties rendered)"
    confidence: medium
    live: true
    notes: R-LIQ-52.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/kinds-data.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <article id="k" itemscope itemtype="https://example.test${P}/Kinds">
                <meta itemprop="m" content="meta-content">
                <time itemprop="t" datetime="2026-08-03">3 August 2026</time>
                <time itemprop="t2">no datetime</time>
                <a itemprop="u" href="/about">About us</a>
                <img itemprop="i" src="/img/x.png" alt="x">
                <data itemprop="d" value="42">forty-two</data>
                <h1 itemprop="h">Hello, <b>world</b></h1>
              </article>
            </body></html>
        - path: "${P}/kinds.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS"><body>
              <div itemscope itemtype="urn:liquid:result" r:ks="[itemtype='https://example.test${P}/Kinds']" p:template="text/liquid">{% assign k = ks | first %}
                <span itemprop="m">{{ k.m }}</span><span itemprop="t">{{ k.t }}</span><span itemprop="t2">{{ k.t2 }}</span>
                <span itemprop="u">{{ k.u }}</span><span itemprop="i">{{ k.i }}</span><span itemprop="d">{{ k.d }}</span>
                <span itemprop="h">{{ k.h }}</span><span itemprop="missing">[{{ k.nosuch }}]</span>
              </div>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/kinds.html"}
        expect:
          status: 200
          microdata: {m: meta-content, t: "2026-08-03", t2: no datetime, u: /about, i: /img/x.png, d: "42", h: "Hello, world", missing: "[]"}

