  - id: liquid.bind.polls-id-to-url
    title: "poll['@id'] | split: '#' | first yields the item's document path (polls listing)"
    feature: item @id
    evidence: demo-source
    source: "pagelove-polls/site/index.html@c9270e5:84-96 ({% assign url = poll['@id'] | split: \"#\" | first %}, href=\"{{ url }}\")"
    confidence: medium
    live: true
    notes: R-LIQ-53, P-LIQ-12. Asserts the path suffix so an absolute-URL @id also passes.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/polls/p1.html"
          body: |
            <!DOCTYPE html>
            <html><body><article id="poll" itemscope itemtype="https://example.test${P}/Poll"><h1 itemprop="title">Lunch</h1><meta itemprop="listed" content="true"></article></body></html>
        - path: "${P}/index.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS"><body>
              <div id="recent" r:polls="[itemtype='https://example.test${P}/Poll']" p:template="text/liquid">{% assign listed = polls | where: "listed", "true" %}{% for poll in listed limit: 8 %}{% assign url = poll['@id'] | split: "#" | first %}<a class="poll-card" href="{{ url }}">{{ poll.title | escape }}</a>|{{ poll['@id'] | split: "#" | last }}{% endfor %}</div>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/index.html", headers: {Range: "selector=#recent"}}
        expect:
          status: 206
          body_contains: ['${P}/polls/p1.html">Lunch</a>|poll']
          body_not_contains: ['p1.html#poll"']

  - id: liquid.bind.expression-count-sum
    title: "Expression-Binding example: e: count() and sum() rendered by a template"
    feature: expression binding in templates
    evidence: documented
    source: "docs reference/composing-pages/Expression-Binding §Count and sum from site data (Count: 2, Sum: 100.0) and §Attribute form ('{{ count }} products totalling ${{ total }}')"
    confidence: medium
    live: true
    requires: [liquid, sessel]
    notes: >-
      R-LIQ-40, R-LIQ-59, R-LIQ-12 ($ before {{). Template reconstructed (spec C-15); selectors isolated by ${P}.
      "Sum: 100" is asserted as a prefix so both 100 and 100.0 pass (float rendering is P-LIQ-13).
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/prod-a.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://example.test${P}/Product"><meta itemprop="price" content="40"></div></body></html>
        - path: "${P}/prod-b.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://example.test${P}/Product"><meta itemprop="price" content="60"></div></body></html>
        - path: "${P}/sessel-expr-summary.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:pagelove="https://pagelove.org/1.0">
            <body>
              <div id="sum" e:total="${[itemtype='https://example.test${P}/Product'] [itemprop='price']}.sum()"
                   e:count="${[itemtype='https://example.test${P}/Product'] [itemprop='price']}.count()"
                   pagelove:template="text/liquid">
                <p>Count: {{ count }}</p>
                <p>Sum: {{ total }}</p>
                <p>{{ count }} products totalling ${{ total }}</p>
              </div>
            </body>
            </html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/sessel-expr-summary.html", headers: {Range: "selector=#sum"}}
        expect:
          status: 206
          body_contains: ["<p>Count: 2</p>", "<p>Sum: 100", "2 products totalling $100"]
          body_not_contains: ["e:total", "{{"]

  - id: liquid.bind.expression-declaration-order
    title: "A later e: binding reads earlier ones; the template sees all three"
    feature: expression binding in templates
    evidence: documented
    source: "docs reference/composing-pages/Expression-Binding §Declaration-order evaluation (e:average=\"total / count\", 'Average price: ${{ average }}')"
    confidence: medium
    live: true
    requires: [liquid, sessel]
    notes: R-LIQ-21, R-LIQ-40.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/p1.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://example.test${P}/Product"><meta itemprop="price" content="40"></div></body></html>
        - path: "${P}/p2.html"
          body: |
            <!DOCTYPE html>
            <html><body><div itemscope itemtype="https://example.test${P}/Product"><meta itemprop="price" content="60"></div></body></html>
        - path: "${P}/avg.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:pagelove="https://pagelove.org/1.0"><body>
              <div id="avg" e:total="${[itemtype='https://example.test${P}/Product'] [itemprop='price']}.sum()"
