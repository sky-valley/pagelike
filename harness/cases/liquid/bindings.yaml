  - id: liquid.bind.sees-stored-template-source
    title: Bindings read other documents as stored, so a template document's items carry raw Liquid
    feature: bindings vs templates
    evidence: demo-source
    source: "pagelove-polls/site/templates/new-poll.html@c9270e5:34 (itemtype computed in Liquid so the template is not a Poll); pagelove-cursor SKILL.md@b97c3ef:422-431 ('resource binding will include it with raw Liquid tags as property values')"
    confidence: medium
    live: true
    notes: R-LIQ-25. Output is not auto-escaped (R-LIQ-90), so the raw braces and quotes appear as written.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/tpl-doc.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body p:template="text/liquid">
              <div itemscope itemtype="https://example.test${P}/Thing"><span itemprop="name">{{ 'rendered' | upcase }}</span></div>
            </body></html>
        - path: "${P}/lister.html"
          body: |
            <!DOCTYPE html>
