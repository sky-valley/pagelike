    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/none.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS"><body>
              <p id="o" r:xs="[itemtype='https://example.test${P}/Absent']" p:template="text/liquid">{{ xs.size }}|{% for x in xs %}item{% else %}none{% endfor %}|{% if xs == empty %}empty{% endif %}</p>
