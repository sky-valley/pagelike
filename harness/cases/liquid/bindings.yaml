  - id: liquid.bind.expression-scope-siblings
    title: An ancestor's binding is visible to nested templates; a sibling's binding is not
    feature: binding scope
    evidence: documented
    source: "docs reference/composing-pages/Expression-Binding §Scope (sitecount visible in both divs, localcount only in the declaring div)"
    confidence: medium
    live: true
    requires: [liquid, sessel]
    notes: "R-LIQ-40, R-LIQ-41, R-LIQ-203 (the invisible name renders empty). The docs' e:localcount expression has unbalanced parentheses (spec C-16); a valid one is used."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/scope.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:e="https://pagelove.org/Binding/Sessel" xmlns:pagelove="https://pagelove.org/1.0"><body>
            <section e:sitecount="5">
              <div id="d1" e:localcount="2" pagelove:template="text/liquid"><p>{{ localcount }} of {{ sitecount }} items</p></div>
              <div id="d2" pagelove:template="text/liquid"><p>[{{ localcount }}] {{ sitecount }} total items</p></div>
            </section>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: declaring element
        as: anonymous
        request: {method: GET, path: "${P}/scope.html", headers: {Range: "selector=#d1"}}
        expect:
          status: 206
          body_contains: ["<p>2 of 5 items</p>"]
      - name: sibling
        as: anonymous
        request: {method: GET, path: "${P}/scope.html", headers: {Range: "selector=#d2"}}
        expect:
          status: 206
          body_contains: ["<p>[] 5 total items</p>"]

