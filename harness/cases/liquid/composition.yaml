# Templates in the composition pipeline: what runs before and after them,
# XML documents, the authoring plane, and writes into rendered output.
# Spec: docs/spec/liquid.md §3 (R-LIQ-20..26), §4, §21 (R-LIQ-220..225).
defaults:
  area: liquid
  requires: [liquid]
cases:
  - id: liquid.compose.range-over-rendered-output
    title: A selector read addresses elements generated by the template (composition runs first)
    feature: composition order
    evidence: documented
    source: "docs reference/composing-pages/Pagination §With Range selectors ('the full document is composed first (pagination, templates, bindings), then the selector extracts')"
    confidence: high
    live: true
    notes: >-
      R-LIQ-20, R-LIQ-24. The loop runs over a split list, not a range literal: live PageLove's Liquid
      parser rejects every range literal (500 "Liquid parse error … expected RParen, got Dot",
      harness/observations/live-2026-09-29/liquid-compose-range-over-rendered-outpu.json), which has
      nothing to do with composition order. pagelike keeps ranges (docs/compat/decisions-2026-09-29/composing-liquid.md,
      keep-standard); liquid.compose.range-over-rendered-output.live measures the difference.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/gen.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body>
              <ul id="gen" p:template="text/liquid">{% assign ns = "1,2,3" | split: "," %}{% for i in ns %}<li class="n{{ i }}">item {{ i }}</li>{% endfor %}</ul>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: first generated item
        as: anonymous
        request: {method: GET, path: "${P}/gen.html", headers: {Range: "selector=#gen li"}}
        expect:
          status: 206
          body: '<li class="n1">item 1</li>'
      - name: a later generated item
        as: anonymous
        request: {method: GET, path: "${P}/gen.html", headers: {Range: "selector=#gen .n3"}}
        expect:
          status: 206
          body: '<li class="n3">item 3</li>'

  - id: liquid.compose.range-over-rendered-output.live
    title: Live PageLove rejects a range literal in a template with 500 (Liquid parse error)
    feature: composition order
    status: live-divergence
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/liquid-compose-range-over-rendered-outpu.json; harness/observations/live-2026-09-29-reconcile-composing-liquid/run1-probes/liquid-compose-probe-0929-range-literal.json (live 2026-09-29)"
    confidence: high
    live: true
    notes: >-
      Measures a deliberate divergence (docs/compat/decisions-2026-09-29/composing-liquid.md, keep-standard):
      pagelike accepts (a..b) ranges (R-LIQ-70, R-LIQ-74, standard Liquid). Runs only against --target live.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/gen.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body>
              <ul id="gen" p:template="text/liquid">{% for i in (1..3) %}<li class="n{{ i }}">item {{ i }}</li>{% endfor %}</ul>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: the whole page fails
        as: anonymous
        request: {method: GET, path: "${P}/gen.html", headers: {Range: "selector=#gen li"}}
        expect:
          status: 500
          body_contains: ["Liquid syntax error: Liquid parse error at None (node None): expected RParen, got Dot"]

  - id: liquid.compose.jsonld-after-templating
    title: JSON-LD negotiation of a templated page reflects the rendered microdata
    feature: composition order
    evidence: documented
    source: "docs reference/reading-and-writing/Content-Negotiation §See also ('Templating — server-side rendering that runs before negotiation')"
    confidence: medium
    live: true
    notes: R-LIQ-24, R-LIQ-225 (cross-area reading-writing JSON-LD).
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/ld.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body>
              <div itemscope itemtype="https://example.test/Calc" p:template="text/liquid"><span itemprop="answer">{{ 2 | plus: 2 }}</span><span itemprop="label">{{ "four" | upcase }}</span></div>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: json-ld
        as: anonymous
        request: {method: GET, path: "${P}/ld.html", headers: {Accept: "application/ld+json"}}
        expect:
          status: 200
          header_matches: {Content-Type: "^application/ld\\+json"}
          body_matches: '"answer" *: *"4"'
          body_contains: ["FOUR"]
          body_not_contains: ["{{"]

  - id: liquid.compose.pagination-after-templates
    title: p:paginate inside template output paginates the rendered children
    feature: composition order
    evidence: documented
    source: "docs reference/composing-pages/Pagination §When to reach for it ('runs after includes, expression bindings, and templates … operates on the fully-resolved DOM')"
    confidence: medium
    live: true
    notes: R-LIQ-23, R-LIQ-24 (cross-area composing X-2).
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/pages.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><head><title>Pages</title></head><body>
              <div p:template="text/liquid"><ul id="nums" p:paginate="2">{% for i in (1..5) %}<li>n{{ i }}</li>{% endfor %}</ul></div>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: page 2
        as: anonymous
        request: {method: GET, path: "${P}/pages.html?paginate:page=2", headers: {Range: "selector=#nums"}}
        expect:
          status: 206
          body_contains: ["<li>n3</li>", "<li>n4</li>"]
          body_not_contains: ["<li>n1</li>", "<li>n5</li>"]

  - id: liquid.compose.include-in-output-resolved
    title: A <p:include> emitted by a template is resolved after rendering
    feature: composition order
    evidence: inferred
    source: "docs reference/composing-pages/Method-Elements §How the result becomes HTML ('Composition recurses into the spliced fragment'); languages/liquid/templating §Includes and templates together"
    confidence: low
    live: true
    notes: R-LIQ-23, P-LIQ-10.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/partials.html"
          body: |
            <!DOCTYPE html>
            <html><body><header id="nav">Navigation</header></body></html>
        - path: "${P}/withinc.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body>
              <div id="o" p:template="text/liquid">{% if true %}<p:include selector="#nav" resource="${P}/partials.html"></p:include>{% endif %}</div>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/withinc.html", headers: {Range: "selector=#o"}}
        expect:
          status: 206
          body_contains: ['<header id="nav">Navigation</header>']
          body_not_contains: ["p:include", "{%"]

  - id: liquid.compose.xml-atom-feed
    title: "Build-a-blog Atom feed: a template on an XML root renders entries; xmlns kept, directives stripped"
    feature: XML documents
    evidence: documented
    source: "docs learn/build-a-blog §The feed; reference/composing-pages/XML-Documents §Composition and §Differences from HTML composition (xmlns preserved)"
    confidence: high
    live: true
    notes: R-LIQ-6, R-LIQ-33. Post itemtype carries ${P} for isolation; feed URLs shortened.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/data/posts/hello-world.html"
          body: |
            <!DOCTYPE html>
            <html lang="en"><body>
              <article itemscope itemtype="https://blog.example${P}/Post" id="post-hello-world">
                <meta itemprop="slug" content="hello-world"><meta itemprop="status" content="Published">
                <meta itemprop="excerpt" content="Tea &amp; biscuits">
                <h1 itemprop="title">Hello, world</h1>
                <time itemprop="publishedAt" datetime="2026-08-03">3 August 2026</time> <span itemprop="author">Sam</span>
              </article>
            </body></html>
        - path: "${P}/data/posts/draft.html"
          body: |
            <!DOCTYPE html>
            <html lang="en"><body>
              <article itemscope itemtype="https://blog.example${P}/Post" id="post-draft">
                <meta itemprop="slug" content="draft"><meta itemprop="status" content="Draft">
                <h1 itemprop="title">Not yet</h1><time itemprop="publishedAt" datetime="2026-09-01">1 Sep</time>
              </article>
            </body></html>
        - path: "${P}/feed.xml"
          content_type: application/atom+xml
          body: |
            <?xml version="1.0" encoding="UTF-8"?>
            <feed xmlns="http://www.w3.org/2005/Atom" xmlns:p="https://pagelove.org/1.0" xmlns:r="https://pagelove.org/Binding/CSS" p:template="text/liquid" r:posts="[itemtype='https://blog.example${P}/Post']"><title>Field Notes</title><id>https://field-notes.example/</id>{% assign pub = posts | where: "status", "Published" | sort: "publishedAt" | reverse %}{% if pub.size > 0 %}<updated>{{ pub.first.publishedAt }}T00:00:00Z</updated>{% endif %}{% for post in pub %}<entry><title>{{ post.title | escape }}</title><id>https://field-notes.example/posts/{{ post.slug }}.html</id><updated>{{ post.publishedAt }}T00:00:00Z</updated><summary>{{ post.excerpt | escape }}</summary><author><name>{{ post.author | escape }}</name></author></entry>{% endfor %}</feed>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: feed
        as: anonymous
        request: {method: GET, path: "${P}/feed.xml"}
        expect:
          status: 200
          header_matches: {Content-Type: "^application/atom\\+xml"}
          body_contains: ["<updated>2026-08-03T00:00:00Z</updated>", "<entry><title>Hello, world</title>", "<summary>Tea &amp; biscuits</summary>", "<name>Sam</name>", 'xmlns:p="https://pagelove.org/1.0"']
          body_not_contains: ["Not yet", "p:template=", "r:posts=", "{%"]

  - id: liquid.compose.dav-serves-raw-template
    title: The authoring plane returns the stored template source, unrendered
    feature: authoring plane
    evidence: documented
    source: "docs reference/protocol/QUERY (authoring endpoint queries raw stored markup; edge queries the composed page); spec protocol.md dav rows"
    confidence: high
    live: true
    notes: R-LIQ-20 (cross-area protocol X-10).
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/raw.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body>
              <p id="o" p:template="text/liquid">{{ 2 | plus: 3 }}</p>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: author reads the source
        as: author
        plane: dav
        request: {method: GET, path: "${P}/raw.html"}
        expect:
          status: 200
          body_contains: ['<p id="o" p:template="text/liquid">{{ 2 | plus: 3 }}</p>']
      - name: the public plane renders it
        as: anonymous
        request: {method: GET, path: "${P}/raw.html"}
        expect:
          status: 200
          body_contains: ['<p id="o">5</p>']

  - id: liquid.compose.write-into-rendered-output
    title: A selector write whose target exists only in template output has no writable origin (416)
    feature: writes vs templates
    evidence: inferred
    source: "docs reference/composing-pages/Parameterized-Routes §Resolution (a matched element 'that is not stamped/included, so it has no writable origin' → 416); pagelike decision R-LIQ-222"
    confidence: low
    live: true
    notes: P-LIQ-16. The stored template must be unchanged afterwards.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/w.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body>
              <ul id="l" p:template="text/liquid">{% for i in (1..2) %}<li id="i{{ i }}">{{ i }}</li>{% endfor %}</ul>
            </body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}]
    steps:
      - name: write to a generated element
        as: anonymous
        request:
          method: PUT
          path: "${P}/w.html"
          headers: {Range: "selector=#i1", Content-Type: "text/html"}
          body: '<li id="i1">changed</li>'
        expect:
          status: 416
      - name: template source untouched
        as: author
        plane: dav
        request: {method: GET, path: "${P}/w.html"}
        expect:
          status: 200
          body_contains: ['<li id="i{{ i }}">{{ i }}</li>']
          body_not_contains: ["changed"]

  - id: liquid.compose.head-matches-get
    title: HEAD of a templated page composes like GET and returns the same status and headers without a body
    feature: composition order
    evidence: documented
    source: "docs reference/reading-and-writing/GET-method (HEAD); spec reading-writing.md R-RW-24"
    confidence: high
    live: true
    notes: R-LIQ-224.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/h.html"
          body: |
            <!DOCTYPE html>
            <html xmlns:p="https://pagelove.org/1.0"><body><p p:template="text/liquid">{{ "x" | upcase }}</p></body></html>
      rules: [{actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}]
    steps:
      - name: head
        as: anonymous
        request: {method: HEAD, path: "${P}/h.html"}
        expect:
          status: 200
          header_matches: {Content-Type: "^text/html"}
          headers_present: [ETag]
          body_empty: true
