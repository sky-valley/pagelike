# SSE: the mutation event and its Microdata article, per write method.
# Spec: docs/spec/sse.md R-SSE-7..17.
# data_microdata reads the first item in the payload; `null` = property absent,
# "" = present and empty. Writers are anonymous (no cookie jar), so they are
# never in the subscriber's session and nothing is echo-suppressed.
cases:
  - id: sse.mutation.doc-live-roundtrip
    title: "Documented live example: subscribe, PUT h1, receive a mutation mentioning PUT and the new text"
    area: sse
    feature: mutation event
    evidence: documented
    source: "docs reference/reading-and-writing/Server-Sent-Events §Live example (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "Mirrors the docs' own round-trip test (its SUBSCRIBE line is GET + Accept: text/event-stream)."
    site:
      files:
        - path: "${P}/sse-roundtrip-test.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>Original</h1><p>Content here.</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, PUT], action: Allow}
    steps:
      - sse_open: {name: s1, path: "${P}/sse-roundtrip-test.html", as: anonymous}
      - sse_expect: {name: s1, event: pagelove-connection, within_ms: 3000}
      - name: replace the heading
        as: anonymous
        request:
          method: PUT
          path: "${P}/sse-roundtrip-test.html"
          headers: {Range: "selector=h1", Content-Type: "text/html"}
          body: "<h1>Updated</h1>"
        expect: {status: 206}
      - sse_expect:
          name: s1
          event: mutation
          within_ms: 3000
          data_contains: ['itemprop="method"', "PUT", "Updated"]
      - sse_close: {name: s1}

  - id: sse.mutation.put-properties
    title: A selector PUT produces a Mutation article with method, request selector, etag, path, host and body, and no placement
    area: sse
    feature: mutation event fields (PUT)
    evidence: documented
    source: "docs reference/reading-and-writing/Server-Sent-Events §Mutation events, §Mutation event fields (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "R-SSE-8..14. ETag and host literals are not compared; only presence is asserted."
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>Original</h1><p>Content here.</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, PUT], action: Allow}
    steps:
      - sse_open: {name: s1, path: "${P}/doc.html", as: anonymous}
      - sse_expect: {name: s1, event: pagelove-connection, within_ms: 3000}
      - name: replace the heading
        as: anonymous
        request:
          method: PUT
          path: "${P}/doc.html"
          headers: {Range: "selector=h1", Content-Type: "text/html"}
          body: "<h1>Updated</h1>"
        expect: {status: 206}
      - sse_expect:
          name: s1
          event: mutation
          within_ms: 3000
          data_microdata: {method: PUT, selector: h1, path: "${P}/doc.html", placement: null, destination: null}
          data_contains:
            - 'itemtype="https://pagelove.org/Mutation"'
            - 'itemprop="etag"'
            - 'itemprop="host"'
            - '<div itemprop="body">'
            - "<h1>Updated</h1>"
      - sse_close: {name: s1}

  - id: sse.mutation.id-format
    title: Mutation events carry a server-assigned id shaped v1~<12 hex>.<milliseconds>-<counter>
    area: sse
    feature: event ids
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/sse-mutation-put-properties.json and sse-replay-last-event-id.json (ids such as v1~ad7e4f97b66d.1790634867705-0; the hex part is per document); docs reference/reading-and-writing/Server-Sent-Events §Mutation events (example id 1709942400000-0) (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "R-SSE-29 as reconciled with the live run: the documented <ms>-<n> example is the tail of the id (docs/compat/decisions.md). id_matches is applied to the raw id."
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>Original</h1></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, PUT], action: Allow}
    steps:
      - sse_open: {name: s1, path: "${P}/doc.html", as: anonymous}
      - sse_expect: {name: s1, event: pagelove-connection, within_ms: 3000}
      - name: write
        as: anonymous
        request:
          method: PUT
          path: "${P}/doc.html"
          headers: {Range: "selector=h1", Content-Type: "text/html"}
          body: "<h1>With id</h1>"
        expect: {status: 206}
      - sse_expect:
          name: s1
          event: mutation
          within_ms: 3000
          id_matches: '^v1~[0-9a-f]{12}\.[0-9]+-[0-9]+$'
      - sse_close: {name: s1}

  - id: sse.mutation.put-etag-matches-response
    title: The event etag is the document's new tag, unquoted (not the element tag of the write response)
    area: sse
    feature: mutation event fields (etag)
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/sse-mutation-put-etag-matches-response.json, sse-mutation-delete.json and sse-mutation-whole-document-put.json (the event etag is a bare hash, equal to the document tag a DELETE or whole PUT answers); beta-js/pagelove/sse.mjs@c204746:247-249; docs/spec/sse.md R-SSE-13"
    confidence: medium
    requires: []
    live: true
    notes: >-
      The id keeps its original name. Probe Q4 settled against R-SSE-13: the event carries the
      document's tag without quotes (C6's unquoted placeholder was right), so it never equals the
      element tag of a selector write's response (docs/compat/decisions.md).
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><h1>Original</h1></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, PUT], action: Allow}
    steps:
      - sse_open: {name: s1, path: "${P}/doc.html", as: anonymous}
      - sse_expect: {name: s1, event: pagelove-connection, within_ms: 3000}
      - name: write and keep the response ETag
        as: anonymous
        request:
          method: PUT
          path: "${P}/doc.html"
          headers: {Range: "selector=h1", Content-Type: "text/html"}
          body: "<h1>Tagged</h1>"
        expect: {status: 206, headers_present: [ETag]}
        capture: {put_etag: header.ETag}
      - name: the document's new tag
        as: anonymous
        request: {method: HEAD, path: "${P}/doc.html"}
        expect: {status: 200}
        capture: {doc_etag: "header.ETag|unquote"}
      - sse_expect:
          name: s1
          event: mutation
          within_ms: 3000
          data_microdata: {etag: "${doc_etag}"}
          data_not_contains: ["${put_etag}"]
      - sse_close: {name: s1}

  - id: sse.mutation.selector-verbatim
    title: The event selector is the request's Range selector verbatim, not a canonical path
    area: sse
    feature: mutation event fields (selector)
    evidence: client-source
    source: "beta-js/pagelove/sse.mjs@c204746:166-172 (echo matching compares event selector with the request Range value); beta-js/pagelove/primitives.mjs@c204746:286-287"
    confidence: medium
    requires: []
    live: true
    notes: "R-SSE-10. Probe Q3 covers whitespace normalization."
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><main><h1>Hello</h1><p>Text</p></main></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, PUT], action: Allow}
    steps:
      - sse_open: {name: s1, path: "${P}/doc.html", as: anonymous}
      - sse_expect: {name: s1, event: pagelove-connection, within_ms: 3000}
      - name: write with a child combinator selector
        as: anonymous
        request:
          method: PUT
          path: "${P}/doc.html"
          headers: {Range: "selector=main > h1", Content-Type: "text/html"}
          body: "<h1>Hello again</h1>"
        expect: {status: 206}
      - sse_expect:
          name: s1
          event: mutation
          within_ms: 3000
          data_microdata: {method: PUT, selector: "main > h1"}
      - sse_close: {name: s1}

  - id: sse.mutation.multi-match-selector
    title: A multi-match selector is reported as sent and the write lands on the first match
    area: sse
    feature: mutation event fields (selector)
    evidence: inferred
    source: "docs reference/permissions/AuthorizationRule §Selectors that match several elements (writes change only the first match); docs/spec/sse.md R-SSE-10"
    confidence: medium
    requires: []
    live: true
    notes: "Subscribers resolve the same selector to their own first match, so the verbatim selector stays correct."
    site:
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><ul><li>first</li><li>second</li></ul></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, PUT], action: Allow}
    steps:
      - sse_open: {name: s1, path: "${P}/doc.html", as: anonymous}
      - sse_expect: {name: s1, event: pagelove-connection, within_ms: 3000}
      - name: replace the first li
        as: anonymous
        request:
          method: PUT
          path: "${P}/doc.html"
          headers: {Range: "selector=li", Content-Type: "text/html"}
          body: "<li>FIRST</li>"
        expect: {status: 206}
      - sse_expect:
          name: s1
          event: mutation
          within_ms: 3000
          data_microdata: {method: PUT, selector: li}
          data_contains: ["<li>FIRST</li>"]
      - name: document shows only the first match replaced
        as: anonymous
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 200, body_contains: ["<li>FIRST</li><li>second</li>"]}
      - sse_close: {name: s1}

