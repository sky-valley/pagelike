  - id: sse.mutation.move-append
    title: An element MOVE produces one MOVE event with source selector, destination selector and placement
    area: sse
    feature: mutation event fields (MOVE)
    evidence: client-source
    source: "beta-js/pagelove/sse.mjs@c204746:132-133,220-239; docs reference/reading-and-writing/Server-Sent-Events §Mutation event fields (placement row mentions MOVE)"
    confidence: medium
    requires: []
    live: true
    notes: "R-SSE-9, R-SSE-15, R-SSE-16. `destination` is not in the HTTP reference (contradiction C2). MOVE needs MOVE on the document plus DELETE/POST element grants; one unscoped rule covers all three checks."
    site:
      files:
        - path: "${P}/board.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <section id="lane-todo"><div class="card" id="card-3">Card 3</div></section>
              <section id="lane-done"><div class="card" id="card-1">Card 1</div></section>
            </body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, POST, DELETE, MOVE], action: Allow}
    steps:
      - sse_open: {name: s1, path: "${P}/board.html", as: anonymous}
      - sse_expect: {name: s1, event: pagelove-connection, within_ms: 3000}
      - name: move card 3 to the end of the done lane
        as: anonymous
        request:
          method: MOVE
          path: "${P}/board.html"
          headers:
            Range: "selector=#card-3"
            Destination: "${P}/board.html"
            Destination-Range: "selector=#lane-done; placement=append"
        expect: {status: 204}
      - sse_expect:
          name: s1
          event: mutation
          within_ms: 3000
          data_microdata: {method: MOVE, selector: "#card-3", destination: "#lane-done", placement: append, path: "${P}/board.html"}
      - sse_expect_none: {name: s1, event: mutation, for_ms: 1500}
      - sse_close: {name: s1}

