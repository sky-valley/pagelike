  - id: "javascript.methods.this-is-host-element"
    title: "this in a dispatched method is the host element (read-only), usable with getAttribute"
    feature: "method elements (JavaScript)"
    source: "docs reference/composing-pages/Method-Elements §JavaScript implementations ('this is the dispatched element'); docs languages/javascript/server/javascript-in-schemas §Method bodies (snapshot 2026-09-28)"
    confidence: "low"
    live: true
    notes: "spec: R-JS-18. The docs call this 'a microdata object'; pagelike gives a read-only Element handle. Probe P-JS-12."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/m.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:t="https://pagelike.test${P}/Who"><body>
            <main>
            <t:who data-k="v1"></t:who>
            </main>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Who">
            <ul>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="who">
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function () { return 'WHO:' + (this !== undefined && this !== null) + ':' + (typeof this.getAttribute === 'function' ? this.getAttribute('data-k') : 'n/a'); }
            </script>
            </div>
            </li>
            </ul>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET the composed page"
