    title: "Context assignments made by a dispatched method are visible to the host subtree only"
    feature: "method elements (JavaScript)"
    source: "docs reference/composing-pages/Method-Elements §Attribute form, §JavaScript implementations (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-18; contradiction C-JS-4."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/m.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:t="https://pagelike.test${P}/Ctx" xmlns:p="https://pagelove.org/1.0"><body>
            <main>
            <div id="host" t:set="hi"><span id="inside"><p:stamp greeting></p:stamp></span></div>
            <div id="after"><p:stamp greeting></p:stamp></div>
            </main>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Ctx">
            <ul>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="set">
            <div itemprop="parameter" itemscope itemtype="https://pagelove.org/Parameter"><meta itemprop="name" content="value"><meta itemprop="type" content="https://schema.host/Text"></div>
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function (value) { Context.greeting = 'CTX-' + value; return null; }
            </script>
            </div>
            </li>
            </ul>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "inside the host: the stamp sees the value; the dispatching attribute is removed"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/m.html"
          headers:
            Range: "selector=#host"
        expect:
          status: 206
          body_contains: ["CTX-hi"]
          body_not_contains: ["t:set"]
      - name: "a later sibling does not see it"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/m.html"
          headers:
            Range: "selector=#after"
        expect:
          status: 206
          body_not_contains: ["CTX-hi"]
