# JavaScript area: JavaScript method bodies dispatched by page composition
# (docs/spec/javascript.md R-JS-18..R-JS-20, R-JS-58, R-JS-60, R-JS-61). Each case PUTs one page
# that carries its schema inline (a single PUT registers it, as in the docs examples) and reads
# <main> back with Range: selector=main.
# Spec: docs/spec/javascript.md. Generated; edit by hand freely.
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "medium"
  requires: ["server-js"]
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
  - id: "javascript.methods.docs-js-method-element"
    title: "Documented example: a JavaScript Method builds a <p> with DOMParser and it is spliced in place of <j:hello>"
    feature: "method elements (JavaScript)"
    source: "docs reference/composing-pages/Method-Elements §JavaScript example (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-18, R-JS-60, R-JS-74. The docs response shows only the text; the element is asserted because an element result is spliced (Method-Elements result table). The schema type URL is per-case instead of urn:JsDemo so runs do not collide."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/js-method-element-demo.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:j="https://pagelike.test${P}/JsDemo">
              <body>
                <main>
                  <j:hello></j:hello>
                </main>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/JsDemo">
            <ul>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="hello">
            <meta itemprop="returns" content="https://pagelove.org/Element">
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default () => { const d = new DOMParser().parseFromString("<p>hello from JavaScript</p>", "text/html"); return d.querySelector("p"); };
            </script>
            </div>
            </li>
            </ul>
            </div>
              </body>
            </html>
        expect:
          status: [200, 201, 204]
      - name: "GET the composed page"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/js-method-element-demo.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          headers:
            Content-Range: "selector main"
          body_contains: ["<p>hello from JavaScript</p>"]
          body_not_contains: ["j:hello"]
  - id: "javascript.methods.params-positional-by-declaration"
    title: "Parameters are passed positionally in declared order, matched to host attributes by name"
    feature: "method elements (JavaScript)"
    source: "docs reference/composing-pages/Method-Elements §JavaScript implementations, §Passing arguments; docs reference/modeling-data/Methods §Parameters (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-18; contradiction C-JS-3 (JSS says 'by name ... rather than positionally'). Parameters are declared with <div itemprop=parameter> because a nested <li> inside the Method <li> would be closed by the HTML parser (see R-JS-18 authoring note)."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/m.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:t="https://pagelike.test${P}/Pair"><body>
            <main>
            <t:pair second="B" first="A" ignored="Z"></t:pair>
            </main>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Pair">
            <ul>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="pair">
            <div itemprop="parameter" itemscope itemtype="https://pagelove.org/Parameter"><meta itemprop="name" content="first"><meta itemprop="type" content="https://schema.host/Text"></div>
            <div itemprop="parameter" itemscope itemtype="https://pagelove.org/Parameter"><meta itemprop="name" content="second"><meta itemprop="type" content="https://schema.host/Text"></div>
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function (p, q) { return 'PAIR:' + p + '-' + q; }
            </script>
            </div>
            </li>
            </ul>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET the composed page"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/m.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          body_contains: ["PAIR:A-B"]
