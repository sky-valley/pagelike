  - id: "javascript.t1123.values-are-stored-as-iso"
    title: "A Temporal value or a Date returned by JavaScript is stored in its ISO 8601 form; an invalid Date is refused with return-type"
    feature: "Temporal"
    source: "docs languages/javascript/server/temporal §Examples (a default that stores next Monday's date), §Values that cross between Sessel and JavaScript (snapshot 2026-11-23)"
    notes: "spec: R-JS-42, R-JS-43. Supersedes the 2026-09-28 marshalling page, where a returned Date was an empty dictionary. live: false because the schema type URLs name the test host."
    live: false
    steps:
      - name: "PUT schema.html"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/schema.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Tmonday">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="d">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            <div itemprop="default" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default () => { const today = Temporal.Now.plainDateISO(); return today.add({ days: 8 - today.dayOfWeek }); };
            </script>
            </div>
            </div>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Tdate">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="d">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            <div itemprop="default" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default () => new Date(0);
            </script>
            </div>
            </div>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Tmd">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="d">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            <div itemprop="default" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default () => Temporal.PlainMonthDay.from('09-30');
            </script>
            </div>
            </div>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Tbad">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="d">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            <div itemprop="default" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default () => new Date(NaN);
            </script>
            </div>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "PUT a.html"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Tmonday">
            <meta itemprop="other" content="o">
            </div>
            <div itemscope itemtype="https://pagelike.test${P}/Tdate">
            <meta itemprop="other" content="o">
            </div>
            <div itemscope itemtype="https://pagelike.test${P}/Tmd">
            <meta itemprop="other" content="o">
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored a.html (authoring plane, raw)"
        as: "author"
        plane: "dav"
        request:
          method: "GET"
          path: "${P}/a.html"
        expect:
          status: 200
          body_matches: "content=\"20[0-9]{2}-[0-9]{2}-[0-9]{2}\""
          body_contains: ["content=\"1970-01-01T00:00:00Z\"", "content=\"--09-30\""]
      - name: "PUT b.html"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/b.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Tbad">
            <meta itemprop="other" content="o">
            </div>
            </body></html>
        expect:
          status: [422, 500]
          body_contains: ["https://pagelove.org/BindingFailure", "content=\"return-type\""]
