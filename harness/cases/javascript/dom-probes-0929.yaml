            const T = (f) => { try { return H(f()); } catch (e) { return 'E:' + e.name; } };
            const J = (x) => JSON.stringify(x);
            const X = (n) => new XMLSerializer().serializeToString(n);
            const N = (n) => (n === null ? 'null' : n === undefined ? 'undef' : typeof n === 'object' ? 'node:' + n.nodeName : typeof n + ':' + n);
            export default function () {
            const P = new DOMParser();
            const d = P.parseFromString('<p id="p" class="k m">x</p>', 'text/html');
            const p = d.querySelector('#p');
            const cl = [T(() => String(p.classList)), T(() => p.classList.value), T(() => p.className)];
            const sc = [T(() => X(P.parseFromString('<foo><bar/><baz>t</baz></foo>', 'text/html'))), T(() => X(P.parseFromString('<foo><bar/><baz>t</baz></foo>', 'application/xml'))),
              T(() => X(P.parseFromString('<div><span/><i>t</i></div>', 'text/html'))), T(() => X(P.parseFromString('<my-el/><i>t</i>', 'text/html'))),
              T(() => X(P.parseFromString('<p>a<p>b<table><tr><td>x</td></tr></table>', 'text/html')))];
            return ['R:', cl.join('|'), ' ## ', sc.join(' ## ')].join('');
            }
            </script>
            </div>
            </li>
            </ul>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET <main>: the method result is inserted as text"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/probe.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          body_contains: ["R:[object Object]|k m|k m ## [foo][bar][/bar][baz]t[/baz][/foo] ## [foo][bar][/bar][baz]t[/baz][/foo] ## [div][span][/span][i]t[/i][/div] ## [my-el][/my-el][i]t[/i] ## [p]a[p]b[table][tr][td]x[/td][/tr][/table][/p][/p]"]
