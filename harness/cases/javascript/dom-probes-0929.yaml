  - id: "javascript.dom.probe-0929.kept-divergences"
    title: "Live PageLove: classList stringifies as [object Object]; DOMParser honours self-closing syntax on every element, lets a p contain a p and inserts no tbody"
    feature: "DOM parsing"
    source: "harness/observations/live-2026-09-29-reconcile-javascript/javascript-dom-probe-0929-kept-divergenc.json; first seen in harness/observations/live-2026-09-29-reconcile-javascript/exploratory/javascript-dom-probe-0929-classlist-dupl.json (toString), exploratory/javascript-dom-probe-0929-domparser-xml.json (<Bar/>) and exploratory/javascript-dom-probe-0929-domparser-shap-run3.json (<p>a<p>b<table>)"
    status: "live-divergence"
    live: true
    notes: >-
      Measures divergences pagelike keeps (docs/compat/decisions-2026-09-29/javascript.md, keep-
      standard): String(classList) is the class string in pagelike; pagelike's DOMParser builds trees
      with the WHATWG tree builder (<span/> is not closed, <p> closes an open p, tables get a tbody),
      and only leaves out the html, head and body the markup does not write. Runs only against
      --target live.
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/probe.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:t="https://pagelike.test${P}/Pkeptdivergences"><body>
