    source: "harness/observations/live-2026-09-29-reconcile-javascript/javascript-dom-probe-0929-document-child.json"
    live: true
    notes: >-
      Probe for R-JS-66, R-JS-69, R-JS-71 (docs/compat/decisions-2026-09-29/javascript.md, adopt-
      live). One group per operation on '<p id=a>a</p><p id=b>b</p>'.
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
