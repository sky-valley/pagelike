# JavaScript area: minimised probes written while reconciling the server DOM with the live PageLove
# run of 2026-09-29 (docs/compat/decisions-2026-09-29/javascript.md). Each probe isolates one DOM
# behaviour, wraps every read in T() so one failure cannot hide the others, and returns a
# '|'-joined string that is inserted into <main> as text (same method-element scaffold as dom.yaml).
# Helpers: H(x) replaces < > " with [ ] ' ; T(f) is H(f()) or 'E:<error name>'; J is JSON.stringify;
# X serializes a node with XMLSerializer; N(n) names a node ('null', 'undef' or 'node:' + nodeName).
defaults:
  area: "javascript"
  evidence: "live-observed"
  confidence: "high"
  requires: ["server-js"]
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
  - id: "javascript.dom.probe-0929.domparser-shape"
    title: "Probe: DOMParser keeps what the markup wrote and leaves out implied html, head and body (fragments, explicit head/body/html, text, prefixed elements)"
    feature: "DOM parsing"
    source: "harness/observations/live-2026-09-29-reconcile-javascript/javascript-dom-probe-0929-domparser-shap.json; first seen in harness/observations/live-2026-09-29/javascript-dom-domparser-ignores-type.json, javascript-dom-tree-operations.json and javascript-dom-inner-outer-adjacent-html.json (d.body and parentElement were null)"
    live: true
    notes: >-
      Probe for R-JS-74 (docs/compat/decisions-2026-09-29/javascript.md, adopt-live). First group: the
      child names of a parsed fragment, the parentNode type and parentElement of a top-level element,
      instanceof Document. Then one group per input: serialization / documentElement / head / body /
      childNodes.length ('-' is null).
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/probe.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:t="https://pagelike.test${P}/Pdomparsershape"><body>
            <main>
            <t:probe></t:probe>
            </main>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Pdomparsershape">
            <ul>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="probe">
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            const H = (x) => String(x).replace(/[<>"]/g, (c) => ({ '<': '[', '>': ']', '"': "'" })[c]);
            const T = (f) => { try { return H(f()); } catch (e) { return 'E:' + e.name; } };
            const J = (x) => JSON.stringify(x);
            const X = (n) => new XMLSerializer().serializeToString(n);
            const N = (n) => (n === null ? 'null' : n === undefined ? 'undef' : typeof n === 'object' ? 'node:' + n.nodeName : typeof n + ':' + n);
            export default function () {
            const P = new DOMParser();
            const K = (n) => (n === null ? '-' : n.nodeName);
            const G = (m) => T(() => { const d = P.parseFromString(m, 'text/html'); return X(d) + '/' + K(d.documentElement) + '/' + K(d.head) + '/' + K(d.body) + '/' + d.childNodes.length; });
            const d1 = P.parseFromString('<ul id="l"><li>a</li></ul><p>x</p>', 'text/html');
            const l = d1.querySelector('#l');
            const a = [T(() => Array.from(d1.childNodes, (n) => n.nodeName).join(',')), T(() => l.parentNode.nodeType), T(() => N(l.parentElement)), T(() => d1 instanceof Document)];
            const g = [G('<ul id="l"><li>a</li></ul><p>x</p>'), G('<!DOCTYPE html><html><head><title>t</title></head><body><p>x</p></body></html>'), G('<title>t</title><p>x</p>'), G('<body><p>x</p></body>'),
              G('<head><title>t</title></head><p>x</p>'), G('<html><p>x</p></html>'), G(''), G('text <b>bold</b>'), G('<t:x/><i>t</i>')];
            return ['R:', a.join('|'), ' ## ', g.join(' ## ')].join('');
            }
            </script>
            </div>
            </li>
            </ul>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET <main>: the method result is inserted as text"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/probe.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          body_contains: ["R:UL,P|9|null|true ## [ul id='l'][li]a[/li][/ul][p]x[/p]/UL/-/-/2 ## [!DOCTYPE html][html][head][title]t[/title][/head][body][p]x[/p][/body][/html]/HTML/HEAD/BODY/2 ## [title]t[/title][p]x[/p]/TITLE/-/-/2 ## [body][p]x[/p][/body]/BODY/-/BODY/1 ## [head][title]t[/title][/head][p]x[/p]/HEAD/HEAD/-/2 ## [html][p]x[/p][/html]/HTML/-/-/1 ## /-/-/-/0 ## text [b]bold[/b]/B/-/-/2 ## [t:x][/t:x][i]t[/i]/T:X/-/-/2"]
  - id: "javascript.dom.probe-0929.document-children"
    title: "Probe: a parsed document may hold several elements and text; its top-level elements accept insertion conveniences, insertAdjacentHTML and outerHTML"
