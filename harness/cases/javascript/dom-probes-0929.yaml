            <meta itemprop="name" content="probe">
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            const H = (x) => String(x).replace(/[<>"]/g, (c) => ({ '<': '[', '>': ']', '"': "'" })[c]);
            const T = (f) => { try { return H(f()); } catch (e) { return 'E:' + e.name; } };
            const J = (x) => JSON.stringify(x);
            const X = (n) => new XMLSerializer().serializeToString(n);
            const N = (n) => (n === null ? 'null' : n === undefined ? 'undef' : typeof n === 'object' ? 'node:' + n.nodeName : typeof n + ':' + n);
            export default function () {
            const P = new DOMParser();
            const mk = () => P.parseFromString('<p id="a">a</p><p id="b">b</p>', 'text/html');
            const r = [];
            r.push(T(() => { const d = mk(); d.appendChild(d.createElement('i')); return X(d); }));
            r.push(T(() => { const d = mk(); d.appendChild(d.createTextNode('t')); return X(d); }));
            r.push(T(() => { const d = mk(); d.insertBefore(d.createElement('i'), d.firstChild); return X(d) + '/' + N(d.documentElement); }));
            r.push(T(() => { const d = mk(); d.querySelector('#a').before('s', d.createElement('u')); return X(d); }));
            r.push(T(() => { const d = mk(); d.querySelector('#a').after(d.createElement('u')); return X(d); }));
            r.push(T(() => { const d = mk(); d.querySelector('#a').replaceWith(d.createElement('u')); return X(d) + '/' + N(d.documentElement); }));
            r.push(T(() => { const d = mk(); d.querySelector('#a').remove(); return X(d) + '/' + N(d.documentElement); }));
            r.push(T(() => { const d = mk(); d.removeChild(d.firstChild); return X(d); }));
            r.push(T(() => { const d = mk(); d.querySelector('#b').insertAdjacentHTML('afterend', '<i>i</i>'); return X(d); }));
            r.push(T(() => { const d = mk(); d.querySelector('#a').outerHTML = '<b>1</b><b>2</b>'; return X(d); }));
            r.push(T(() => J(mk().textContent)));
            r.push(T(() => { const d = P.parseFromString('', 'text/html'); d.appendChild(d.createElement('p')); return X(d) + '/' + N(d.documentElement); }));
            r.push(T(() => { const d = mk(); const f = d.createDocumentFragment(); f.appendChild(d.createElement('i')); f.appendChild(d.createElement('u')); d.appendChild(f); return X(d); }));
            r.push(T(() => { const d = mk(); return N(d.querySelector('#a').parentNode) + '/' + N(d.querySelector('#a').parentElement) + '/' + d.contains(d.querySelector('#b')) + '/' + d.getElementsByTagNameNS('*', 'p').length + '/' + d.querySelectorAll('*').length; }));
            return ['R:', r.join(' ## ')].join('');
            }
            </script>
            </div>
            </li>
            </ul>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET <main>: the method result is inserted as text"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/probe.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          body_contains: ["R:[p id='a']a[/p][p id='b']b[/p][i][/i] ## [p id='a']a[/p][p id='b']b[/p]t ## [i][/i][p id='a']a[/p][p id='b']b[/p]/node:I ## s[u][/u][p id='a']a[/p][p id='b']b[/p] ## [p id='a']a[/p][u][/u][p id='b']b[/p] ## [u][/u][p id='b']b[/p]/node:U ## [p id='b']b[/p]/node:P ## [p id='b']b[/p] ## [p id='a']a[/p][p id='b']b[/p][i]i[/i] ## [b]1[/b][b]2[/b][p id='b']b[/p] ## 'ab' ## [p][/p]/node:P ## [p id='a']a[/p][p id='b']b[/p][i][/i][u][/u] ## node:#document/null/true/2/2"]
  - id: "javascript.dom.probe-0929.classlist-duplicates"
