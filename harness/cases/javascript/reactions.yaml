        expect:
          status: [200, 201, 204]
      - name: "control: a thrown response takes effect (triggers run)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/control/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: 418
          body_contains: ["control-thrown"]
      - name: "the returned object is ignored and the write proceeds"
