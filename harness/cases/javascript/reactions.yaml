# JavaScript area: JavaScript in Trigger and Processor when/action/otherwise
# (docs/spec/javascript.md R-JS-21, R-JS-22, R-JS-24, R-JS-53). Every trigger/processor is scoped by
# resource to paths under ${P}, so live runs affect nothing else. Cross-area: reactions.
# Spec: docs/spec/javascript.md. Generated; edit by hand freely.
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "medium"
  requires: ["server-js"]
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
  - id: "javascript.reactions.trigger-docs-when-and-action"
    title: "Documented examples: a JavaScript when gate on ctx.request.method and an action that throws a 403 HTTPResponse"
    feature: "triggers (JavaScript)"
    source: "docs reference/reacting-to-changes/Trigger §when, §action (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-21, R-JS-53. The docs' '/admin/' prefix is placed under ${P}."
    steps:
      - name: "register the trigger/processor (public plane)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/reactions.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Trigger">
            <meta itemprop="resource" content="${P}/guarded/*">
            <meta itemprop="method" content="PUT">
            <div itemprop="when" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function(ctx) {
              return ctx.request.method === "PUT";
            }
            </script>
            </div>
            <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function(ctx) {
              if (ctx.request.path.startsWith("${P}/guarded/admin/")) {
                throw {
                  schema_url: "https://pagelove.org/HTTPResponse",
                  status: 403,
                  message: "Admin area is restricted"
                };
              }
              return true;
            }
            </script>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "admin path is refused"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/guarded/admin/x.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: 403
          body_contains: ["Admin area is restricted"]
      - name: "other paths pass (the action's return value is discarded)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/guarded/ok.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: [200, 201, 204]
  - id: "javascript.reactions.trigger-ctx-request-shape"
    title: "A JavaScript trigger receives ctx.request with method, path, host, headers, query and body"
    feature: "triggers (JavaScript)"
    source: "docs reference/reacting-to-changes/Trigger §Context (JavaScript table) (snapshot 2026-09-28)"
    confidence: "medium"
    live: true
    notes: "spec: R-JS-21. path excludes the query string (R-JS-21 table)."
    steps:
      - name: "register the trigger/processor (public plane)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/reactions.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Trigger">
            <meta itemprop="resource" content="${P}/guarded/*">
            <meta itemprop="method" content="PUT">
            <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function(ctx) {
              const r = ctx.request;
              throw { schema_url: 'https://pagelove.org/HTTPResponse', status: 418,
                message: 'CTX:' + [r.method, r.path, typeof r.host, typeof r.headers, typeof r.query, r.query.k, typeof r.body].join('|') };
            }
            </script>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "PUT with a query string"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/guarded/x.html?k=v1"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: 418
          body_contains: ["CTX:PUT|${P}/guarded/x.html|string|object|object|v1|string"]
  - id: "javascript.reactions.trigger-header-lookup"
    title: "Header lookup in ctx.request.headers (docs Authorization example, with a custom header, capitalized lookup)"
    feature: "triggers (JavaScript)"
    source: "docs reference/reacting-to-changes/Trigger §Chain termination (JavaScript example) (snapshot 2026-09-28)"
    confidence: "medium"
    live: true
    notes: "spec: R-JS-24 (case-insensitive header view is inferred). A custom header replaces Authorization so the request is not treated as a login attempt."
    steps:
      - name: "register the trigger/processor (public plane)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/reactions.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Trigger">
            <meta itemprop="resource" content="${P}/guarded/*">
            <meta itemprop="method" content="PUT">
            <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function(ctx) {
              if (ctx.request.headers["X-Case-Token"] == null) {
                throw { schema_url: "https://pagelove.org/HTTPResponse", status: 403, message: "Forbidden" };
              }
            }
            </script>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "no header: refused"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/guarded/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: 403
          body_contains: ["Forbidden"]
      - name: "header present (sent lower-case by HTTP/2 clients): allowed"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/guarded/b.html"
          headers:
            Content-Type: "text/html"
            x-case-token: "t1"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: [200, 201, 204]
  - id: "javascript.reactions.trigger-when-truthiness"
    title: "A JavaScript when gate uses JavaScript truthiness: 0 runs otherwise, 'yes' runs action"
    feature: "triggers (JavaScript)"
    source: "docs reference/reacting-to-changes/Trigger §when, §otherwise (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-21."
    steps:
      - name: "register the trigger/processor (public plane)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/reactions.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Trigger">
            <meta itemprop="resource" content="${P}/g1/*">
            <meta itemprop="method" content="PUT">
            <div itemprop="when" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function() { return 0; }
            </script>
            </div>
            <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function() { throw { schema_url: 'https://pagelove.org/HTTPResponse', status: 418, message: 'action-ran' }; }
            </script>
            </div>
            <div itemprop="otherwise" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function() { throw { schema_url: 'https://pagelove.org/HTTPResponse', status: 409, message: 'otherwise-ran' }; }
            </script>
            </div>
            </div>
            <div itemscope itemtype="https://pagelove.org/Trigger">
            <meta itemprop="resource" content="${P}/g2/*">
            <meta itemprop="method" content="PUT">
            <div itemprop="when" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function() { return 'yes'; }
            </script>
            </div>
            <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function() { throw { schema_url: 'https://pagelove.org/HTTPResponse', status: 418, message: 'action-ran' }; }
            </script>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "falsy gate: otherwise"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/g1/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: 409
          body_contains: ["otherwise-ran"]
      - name: "truthy non-boolean gate: action"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/g2/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: 418
          body_contains: ["action-ran"]
