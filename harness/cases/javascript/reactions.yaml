  - id: "javascript.reactions.processor-rethrow-with-headers"
    title: "The beta-js CORS processor pattern: rethrow ctx.response.body with added headers; the bytes survive"
    feature: "processors (JavaScript)"
    evidence: "client-source"
    source: "beta-js/cors.html@c204746:48-70; docs reference/reacting-to-changes/Processor §Response-mutation asymmetry (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-22, R-JS-53, R-JS-101. The body contains && and => to show the string passes through unescaped."
    steps:
      - name: "register the trigger/processor (public plane)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/reactions.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Processor">
            <meta itemprop="resource" content="${P}/js/*">
            <meta itemprop="method" content="GET">
            <meta itemprop="status" content="2xx">
            <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function (ctx) {
              throw {
                schema_url: "https://pagelove.org/HTTPResponse",
                status: ctx.response.status,
                body: ctx.response.body,
                headers: {
                  "Access-Control-Allow-Origin": "*",
                  "Content-Type": "text/javascript"
                }
              };
            }
            </script>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "upload a module"
