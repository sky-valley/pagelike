  - id: "javascript.reactions.processor-response-assignment-ignored"
    title: "Assigning to ctx.response in a JavaScript processor action has no effect"
    feature: "processors (JavaScript)"
    source: "docs reference/reacting-to-changes/Processor §Response-mutation asymmetry (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-22."
    steps:
      - name: "register the trigger/processor (public plane)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/reactions.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelove.org/Processor">
            <meta itemprop="resource" content="${P}/pm/*">
            <meta itemprop="method" content="GET">
            <meta itemprop="status" content="2xx">
            <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function (ctx) { ctx.response.status = 418; ctx.response.body = 'changed-by-js'; }
            </script>
            </div>
            </div>
            <div itemscope itemtype="https://pagelove.org/Processor">
            <meta itemprop="resource" content="${P}/pc/*">
            <meta itemprop="method" content="GET">
            <meta itemprop="status" content="2xx">
            <div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function (ctx) { throw { schema_url: 'https://pagelove.org/HTTPResponse', status: 200, body: 'control-' + 'replaced' }; }
            </script>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "store a control page"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/pc/page.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>control-original</p>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "control: a thrown response replaces it (processors run)"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/pc/page.html"
        expect:
          status: 200
          body_contains: ["control-replaced"]
      - name: "store a page"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/pm/page.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>original-body</p>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "unchanged"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/pm/page.html"
        expect:
          status: 200
          body_contains: ["original-body"]
          body_not_contains: ["changed-by-js"]
