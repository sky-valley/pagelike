            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "the request fails"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/guarded/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <p>content</p>
            </body></html>
        expect:
          status: 500
          header_matches:
            Content-Type: "^text/html"
      - name: "nothing was stored"
        as: "author"
        plane: "dav"
        request:
          method: "GET"
          path: "${P}/guarded/a.html"
        expect:
          status: 404
      - name: "no side-effect write happened"
