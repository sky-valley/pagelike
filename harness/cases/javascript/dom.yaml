# JavaScript area: the server DOM API (docs/spec/javascript.md A10, R-JS-61..R-JS-80).
# Each case dispatches one JavaScript method element (<t:probe>) whose body exercises the DOM,
# mostly on a writable document from DOMParser, and returns a '|'-joined string that is
# inserted into <main> as text. Helpers in every probe: S(...) joins String(x) with '|';
# H(x) replaces < > " with [ ] ' so markup can be returned as plain text.
# Spec: docs/spec/javascript.md. Generated; edit by hand freely.
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "medium"
  requires: ["server-js"]
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
