    live: true
    notes: "spec: R-JS-64; contradiction C-JS-11."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/probe.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:t="https://pagelike.test${P}/Dinstanceofhierarchy"><body>
            <main>
            <t:probe></t:probe>
            </main>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Dinstanceofhierarchy">
            <ul>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="probe">
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            const S = (...a) => a.map(String).join('|');
            const H = (x) => String(x).replace(/[<>"]/g, (c) => ({ '<': '[', '>': ']', '"': "'" })[c]);
            const tryName = (f) => { try { f(); return 'ok'; } catch (e) { return e.name + ':' + e.code; } };
            export default function () {
            const d = new DOMParser().parseFromString('<a href="/x">x</a><input><section></section><video></video><audio></audio><foo-bar></foo-bar>', 'text/html');
            const q = (s) => d.querySelector(s);
            const a = q('a'), i = q('input'), s = q('section'), v = q('video'), au = q('audio'), c = q('foo-bar');
            const t = d.createTextNode('x'), m = d.createComment('y');
            const ns = d.createElementNS('http://www.w3.org/2000/svg', 'g');
            return 'R:' + S(a instanceof HTMLAnchorElement, a instanceof HTMLElement, a instanceof Element, a instanceof Node, a.constructor.name,
