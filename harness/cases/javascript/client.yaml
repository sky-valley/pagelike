  - id: "javascript.client.generated-root-path-selector"
    title: "A beta-js path selector anchored at the root (html:nth-child(1) > body:nth-child(2) > ...) addresses the element"
    feature: "client contract: selectors"
    evidence: "client-source"
    source: "beta-js/pagelove/primitives.mjs@c204746:8-64 (generateSelector) "
    confidence: "high"
    requires: []
    live: true
    notes: "spec: R-JS-104. html:nth-child(1) must match the root element (its parent is the document)."
    site:
      settings:
        default_get: "allow"
      files:
        - path: "${P}/board.html"
          body: |
            <!DOCTYPE html>
            <html><head><title>board</title></head><body>
            <main id="board" itemscope itemtype="https://pagelike.test${P}/Board">
            <h1>Board</h1>
            <p>second child</p>
            <ul id="123"><li>escaped-id-target</li></ul>
            <article id="card" itemscope itemtype="https://pagelike.test${P}/Card" itemprop="card"><meta itemprop="title" content="T"><span itemprop="body">card-body</span></article>
            <ul id="list"><li id="item-1">one</li></ul>
            </main>
            </body></html>
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
          action: "Allow"
        - actor: "*"
          resource: "${P}/*/*"
          method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
          action: "Allow"
        - actor: "*"
          resource: "${P}/*/*/*"
          method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
          action: "Allow"
    steps:
      - name: "GET with the generated root path"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/board.html"
          headers:
            Range: "selector=html:nth-child(1) > body:nth-child(2) > main:nth-child(1) > p:nth-child(2)"
        expect:
          status: 206
          body_html: "<p>second child</p>"
