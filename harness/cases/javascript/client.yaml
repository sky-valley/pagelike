# JavaScript area, Part B: the HTTP contract of the official browser client (beta-js @c204746),
# docs/spec/javascript.md R-JS-100..R-JS-119. Each case replays requests exactly as beta-js builds
# them (header spelling, generated selectors, bodies) and asserts only the response properties the
# client reads. Overlaps with reading-writing R-RW-140/141 and protocol R-PROTO-21 are intentional:
# these cases pin the client-facing sequence end to end. Also: a QUERY with a JavaScript body.
# Spec: docs/spec/javascript.md. Generated; edit by hand freely.
defaults:
  area: "javascript"
  evidence: "client-source"
  confidence: "high"
  requires: []
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
