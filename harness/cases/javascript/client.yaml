  - id: "javascript.query.javascript-body-415"
    title: "QUERY with a JavaScript body is not a supported query type (the Sessel path's 400, no Accept-Query)"
    feature: "QUERY"
    evidence: "live-observed"
    source: "harness/observations/live-2026-09-28/protocol-query-sessel-415-unsupported-type.json and protocol-query-edge-415-unsupported-type.json (a non-css type is authorized as QUERY, then 400 'QUERY method requires Content-Type: text/sessel'); docs languages/javascript/server/javascript-in-schemas §When to reach for it ('HTTP queries' are Sessel-only); docs reference/protocol/QUERY (snapshot 2026-09-28) claims 415"
    confidence: "medium"
    requires: ["server-js"]
    live: true
    notes: >-
      spec: R-JS-4; protocol R-PROTO-43 as reconciled with live PageLove (C-9 reversed,
      docs/compat/decisions.md). The id keeps its original name. The rules grant QUERY, because
      without that grant the answer is the QUERY denial (401).
    site:
      settings:
        default_get: "allow"
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE", "QUERY"]
          action: "Allow"
    steps:
      - name: "store a page"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/q.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <h1>q</h1>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "QUERY text/javascript"
        as: "anonymous"
        request:
          method: "QUERY"
          path: "${P}/q.html"
          headers:
            Content-Type: "text/javascript"
          body: "document.querySelector('h1')"
        expect:
          status: 400
          headers_absent: ["Accept-Query"]
          body_contains: ["QUERY method requires Content-Type: text/sessel"]
