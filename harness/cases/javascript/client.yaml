  - id: "javascript.client.head-etag-then-conditional-writes"
    title: "The lazy-ETag sequence: HEAD with Range returns an ETag; PUT with If-Match uses it; a stale tag gets 412 on writes and is ignored on GET"
    feature: "client contract: ETags"
    evidence: "client-source"
    source: "beta-js/pagelove/primitives.mjs@c204746:258-273, 474-501; harness/observations/live-2026-09-28/rw-cond-get-if-match-stale.json (a GET with a stale If-Match is 206)"
    confidence: "high"
    requires: []
    live: true
    notes: >-
      spec: R-JS-102 (R2, R4, R5), R-JS-105, R-JS-107, R-JS-108; reading-writing R-RW-140/141. The GET
      step followed RFC 9110 (412) until the live reconciliation of 2026-09-28: PageLove ignores
      If-Match on reads, and so does pagelike (rw.cond.get-if-match-stale, docs/compat/decisions.md).
    site:
      settings:
        default_get: "allow"
      files:
        - path: "${P}/board.html"
          body: |
            <!DOCTYPE html>
            <html><head><title>board</title></head><body>
            <main id="board" itemscope itemtype="https://pagelike.test${P}/Board">
            <h1>Board</h1>
            <p>second child</p>
            <ul id="123"><li>escaped-id-target</li></ul>
            <article id="card" itemscope itemtype="https://pagelike.test${P}/Card" itemprop="card"><meta itemprop="title" content="T"><span itemprop="body">card-body</span></article>
            <ul id="list"><li id="item-1">one</li></ul>
            </main>
            </body></html>
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
          action: "Allow"
        - actor: "*"
          resource: "${P}/*/*"
          method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
          action: "Allow"
        - actor: "*"
          resource: "${P}/*/*/*"
          method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
          action: "Allow"
    steps:
      - name: "HEAD #list (IntersectionObserver path)"
        as: "anonymous"
        request:
          method: "HEAD"
          path: "${P}/board.html"
          headers:
            Range: "selector=#list"
        expect:
          status: 206
          headers_present: ["ETag"]
        capture:
          t1: "header.ETag"
      - name: "element PUT with If-Match (Content-Type text/html;charset=UTF-8)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/board.html"
          headers:
            Range: "selector=#list"
            Content-Type: "text/html;charset=UTF-8"
            If-Match: "${t1}"
          body: "<ul id=\"list\"><li id=\"item-1\">one</li><li id=\"item-2\">two</li></ul>"
        expect:
          status: [200, 204, 206]
          headers_present: ["ETag"]
          etag_differs: "${t1}"
      - name: "element GET with the stale If-Match (beta-js sends If-Match on GET): ignored"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/board.html"
          headers:
            Range: "selector=#list"
            If-Match: "${t1}"
        expect:
          status: 206
          body_contains: ["item-2"]
      - name: "element PUT with the stale If-Match"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/board.html"
          headers:
            Range: "selector=#list"
            Content-Type: "text/html;charset=UTF-8"
            If-Match: "${t1}"
          body: "<ul id=\"list\"></ul>"
        expect:
          status: 412
