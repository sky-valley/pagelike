# JavaScript area: JavaScript in schema slots (docs/spec/javascript.md A2, A3, A6-A8, A11;
# R-JS-5..R-JS-17, R-JS-40..R-JS-57, R-JS-85..R-JS-87). Pattern: PUT a declarations page on the
# public plane (registers the schema), PUT an instance page, then read the stored bytes on the
# authoring plane or observe the rejection. Only statuses, the BindingFailure variant and stored
# values are asserted; messages are engine-specific (docs show V8 wording, QuickJS differs).
# Spec: docs/spec/javascript.md. Generated; edit by hand freely.
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "medium"
  requires: ["server-js"]
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
  - id: "javascript.slots.default-fresh-context"
    title: "Each default evaluation gets a fresh module instance (module state is not shared between writes)"
    feature: "default slot"
    source: "docs languages/javascript/server/javascript-in-schemas §The export default contract ('Evaluates the module in a fresh context') (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-5, R-JS-11."
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/schema.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Dfdefaultfreshcontext">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="d">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            <div itemprop="default" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            let n = 0;
            export default () => 'seq-' + (++n);
            </script>
            </div>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "PUT an instance (a.html)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Dfdefaultfreshcontext">
            <meta itemprop="other" content="o">
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "PUT an instance (b.html)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/b.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Dfdefaultfreshcontext">
            <meta itemprop="other" content="o">
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state (authoring plane, raw)"
        as: "author"
        plane: "dav"
        request:
          method: "GET"
          path: "${P}/a.html"
        expect:
          status: 200
          body_contains: ["content=\"seq-1\""]
      - name: "stored state (authoring plane, raw)"
        as: "author"
        plane: "dav"
        request:
          method: "GET"
          path: "${P}/b.html"
        expect:
          status: 200
          body_contains: ["content=\"seq-1\""]
          body_not_contains: ["content=\"seq-2\""]
