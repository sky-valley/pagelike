  - id: "javascript.slots.validate-docs-example-hostname"
    title: "Documented example: a @validate throws an HTTPResponse with its own status and message"
    feature: "thrown HTTPResponse"
    source: "docs languages/javascript/server/javascript-in-schemas §Explaining why a value was rejected (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-14, R-JS-53. The docs snippet omits allowed/hostname; they are defined here."
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/schema.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Vvalidatedocsexamplehostname">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="v">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="1..1">
            <div itemprop="@validate" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default (v) => {
              const allowed = ['example.com'];
              const hostname = String(v).replace(/^https?:\/\//, '').split('/')[0];
              if (!allowed.includes(hostname)) {
                throw {
                  schema_url: "https://pagelove.org/HTTPResponse",
                  status: 422,
                  message: `$${hostname} is not on this platform`,
                };
              }
              return true;
            };
            </script>
            </div>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "PUT an instance (a.html)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Vvalidatedocsexamplehostname">
            <meta itemprop="v" content="https://evil.test/x">
            </div>
            </body></html>
        expect:
          status: 422
          body_contains: ["evil.test is not on this platform"]
      - name: "an allowed host is accepted"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/ok.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Vvalidatedocsexamplehostname">
            <meta itemprop="v" content="https://example.com/a">
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
