            <div j:c="'C:' + await crypto.subtle.verify({name: 'ECDSA', hash: 'SHA-384'}, await crypto.subtle.importKey('spki', Uint8Array.fromBase64('MHYwEAYHKoZIzj0CAQYFK4EEACIDYgAEthKouBGdDVpp0bRfQpEGQezvmLvr1XeWtHVT3cZFGUD35lPuXGl4Glti9LuBmsM0OaRj4+P0czdT8ZFmYyD2QR0qxXt4cadtKvoUqj7hUvizDss2Fr0DnpRjjZkINzGC'), {name: 'ECDSA', namedCurve: 'P-384'}, false, ['verify']), Uint8Array.fromBase64('cI3MQvTyC9x1so10ck+fdZFOztSVKcCIL5qesaDz7mR/eb0eUFI0dyQ9fHxp4mzbd9SHqTNjsBTsl/Ya60v/xpbaX+1xTlr3kz7A4xVlo7Cs4bBLtbnnNbdDgb0feIJc'), Uint8Array.fromBase64('aGVsbG8gcGFnZWxpa2U='))"><p:stamp c></p:stamp></div>
