# JavaScript area: WebCrypto signature checks (docs snapshot 2026-11-23; spec R-JS-39c).
# The keys and signatures were made once with Go's standard library over the
# message "hello pagelike".
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "high"
  requires: ["server-js"]
  live: true
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
