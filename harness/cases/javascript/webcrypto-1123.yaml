            <div j:f="'F:' + await (async () => { const r = (p) => p.then(() => 'ok', (e) => e.name + (e instanceof DOMException ? '' : '!')); const pw = new TextEncoder().encode('p'); return [await r(crypto.subtle.importKey('raw', pw, 'Argon2id', false, ['deriveBits'])), await r(crypto.subtle.importKey('raw-secret', pw, 'Argon2id', true, ['deriveBits'])), await r(crypto.subtle.importKey('raw-secret', pw, 'Argon2id', false, [])), await r(crypto.subtle.importKey('raw-secret', pw, 'Argon2id', false, ['verify'])), await r(crypto.subtle.importKey('raw-secret', pw, 'bcrypt', false, ['deriveKey']))].join(','); })()"><p:stamp f></p:stamp></div>
