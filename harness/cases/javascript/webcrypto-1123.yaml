            <div j:k="'K:' + await (async () => { const k = await crypto.subtle.importKey('spki', Uint8Array.fromBase64('MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEUbfovxMmmTDigJB9tatYY6v0fR5Lw9JsDeZcNJebQoUPtq3sd6ysRu1dty25E66PHbdf7y/ROGquGI6v4c9ulw=='), {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify']); const r = (p) => p.then(() => 'ok', (e) => e.name + (e instanceof DOMException ? '' : '!')); return [await r(crypto.subtle.verify('Ed25519', k, new Uint8Array(64), new Uint8Array(1))), await r(crypto.subtle.verify({name: 'ECDSA', hash: 'SHA-384'}, k, new Uint8Array(64), new Uint8Array(1))), await r(crypto.subtle.verify({name: 'ECDSA'}, k, new Uint8Array(64), new Uint8Array(1))), k.type, k.extractable, k.algorithm.name, k.algorithm.namedCurve, k.usages.join('+')].join(','); })()"><p:stamp k></p:stamp></div>
