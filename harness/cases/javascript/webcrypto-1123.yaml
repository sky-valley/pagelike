# JavaScript area: WebCrypto signature checks (docs snapshot 2026-11-23; spec R-JS-39c).
# The keys and signatures were made once with Go's standard library over the
# message "hello pagelike".
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "high"
  requires: ["server-js"]
  live: true
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
  - id: "javascript.wc1123.import-and-verify"
    title: "crypto.subtle.importKey takes a public key and verify checks a signature with it"
    feature: "WebCrypto"
    source: "docs languages/javascript/server/webcrypto §Accepted keys, §Signature encoding, §Hash and salt length, §Error cases; base64 ('Uint8Array.fromHex, toHex, setFromBase64 and setFromHex are not available') (snapshot 2026-11-23)"
    notes: "spec: R-JS-39c, R-JS-39b. Before this snapshot crypto.subtle had digest only."
