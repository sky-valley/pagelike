            <div j:g="'G:' + await ((p) => p.then(() => 'ok', (e) => e.name + (e instanceof DOMException ? '' : '!')))(crypto.subtle.importKey('spki', new Uint8Array([1, 2, 3]), {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify']))"><p:stamp g></p:stamp></div>
            <div j:h="'H:' + await ((p) => p.then(() => 'ok', (e) => e.name + (e instanceof DOMException ? '' : '!')))(crypto.subtle.importKey('jwk', {}, {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify'])) + ',' + await ((p) => p.then(() => 'ok', (e) => e.name + (e instanceof DOMException ? '' : '!')))(crypto.subtle.importKey('spki', Uint8Array.fromBase64('MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEUbfovxMmmTDigJB9tatYY6v0fR5Lw9JsDeZcNJebQoUPtq3sd6ysRu1dty25E66PHbdf7y/ROGquGI6v4c9ulw=='), {name: 'ECDSA', namedCurve: 'P-521'}, false, ['verify'])) + ',' + await ((p) => p.then(() => 'ok', (e) => e.name + (e instanceof DOMException ? '' : '!')))(crypto.subtle.importKey('raw', Uint8Array.fromBase64(''), {name: 'RSA-PSS', hash: 'SHA-256'}, false, ['verify']))"><p:stamp h></p:stamp></div>
