        expect:
          status: [200, 201, 204]
      - name: "GET the composed page"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/j.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          body_contains:
            - "A:true"
            - "B:false"
            - "C:true"
            - "D:true"
            - "E:true"
            - "F:truefalse"
            - "G:DataError"
            - "H:NotSupportedError,NotSupportedError,NotSupportedError"
            - "I:TypeError!,SyntaxError,TypeError!,TypeError!"
