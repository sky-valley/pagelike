# JavaScript area: imported schema classes and cross-language method calls
# (docs/spec/javascript.md R-JS-9, R-JS-16, R-JS-17, R-JS-85..R-JS-87). Class behaviour is
# observed through a JavaScript default whose string result is stored; computed properties and
# methods are observed through an edge Sessel QUERY (needs a QUERY grant and a named actor).
# Spec: docs/spec/javascript.md. Generated; edit by hand freely.
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "medium"
  requires: ["server-js"]
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
  - id: "javascript.classes.import-class-behaviour"
    title: "A schema import yields a class named after the schema with constructor, accessors and instanceof"
    feature: "schema imports"
    source: "docs languages/javascript/server/javascript-in-schemas §Importing schemas, §Working with imported classes (snapshot 2026-09-28)"
    confidence: "medium"
    live: true
    notes: "spec: R-JS-9, R-JS-85, R-JS-86."
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/schema.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Note">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="title">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            </div>
            </div>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Board">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="probe">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            <div itemprop="default" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            import Note from "https://pagelike.test${P}/Note" with { type: "https://pagelove.org/Schema" };
            export default () => {
              const n = new Note({ title: 't' });
              const before = n.title;
              n.title = 'u';
              return [Note.name, n instanceof Note, before, n.title, typeof Note].join('|');
            };
            </script>
            </div>
            </div>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "PUT an instance (a.html)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Board">
            <meta itemprop="other" content="o">
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state (authoring plane, raw)"
        as: "author"
        plane: "dav"
        request:
          method: "GET"
          path: "${P}/a.html"
        expect:
          status: 200
          body_contains: ["content=\"Note|true|t|u|function\""]
