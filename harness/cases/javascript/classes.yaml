        email_verified: true
        roles: []
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/schema.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div hidden itemscope itemtype="https://pagelove.org/Schema">
            <meta itemprop="type" content="https://pagelike.test${P}/Person">
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="firstName">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            </div>
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="lastName">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            </div>
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="name">
            <meta itemprop="type" content="https://schema.host/Text">
            <meta itemprop="cardinality" content="0..1">
            </div>
            <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
            <meta itemprop="name" content="fullName">
            <div itemprop="@computed" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function() { return this.firstName + " " + this.lastName; }
            </script>
            </div>
            </div>
            <ul>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="greet">
            <div itemprop="parameter" itemscope itemtype="https://pagelove.org/Parameter"><meta itemprop="name" content="greeting"><meta itemprop="type" content="https://schema.host/Text"></div>
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function(greeting) { return greeting + ", " + this.name + "!"; }
            </script>
            </div>
            </li>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="probe">
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function () { return typeof document + ':' + typeof Context; }
            </script>
            </div>
            </li>
            <li itemprop="property" itemscope itemtype="https://pagelove.org/Method">
            <meta itemprop="name" content="kind">
            <meta itemprop="static" content="true">
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            export default function () { return 'CLS:' + this.name; }
            </script>
            </div>
            </li>
            </ul>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "PUT an instance (a.html)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/a.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html><body>
            <div itemscope itemtype="https://pagelike.test${P}/Person">
            <meta itemprop="firstName" content="Ada">
            <meta itemprop="lastName" content="Lovelace">
            <meta itemprop="name" content="Ada">
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "QUERY"
        as: "alice"
        request:
          method: "QUERY"
          path: "${P}/a.html"
          headers:
            Content-Type: "text/sessel"
          body: |-
            @schema Person url("https://pagelike.test${P}/Person");
            Person.search().first().fullName
        expect:
          status: [200, 206]
          body_contains: ["Ada Lovelace"]
