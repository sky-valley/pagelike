  - id: "javascript.globals.crypto-subtle-digest"
    title: "crypto.subtle.digest is an awaitable built-in in j: expressions"
    feature: "globals"
    source: "docs reference/composing-pages/JavaScript-Expression-Binding §Sessel or JavaScript? ('awaiting a Promise-returning built-in (for example crypto.subtle)') (snapshot 2026-09-28)"
    confidence: "low"
    live: true
    notes: "spec: R-JS-39a. The docs name crypto.subtle only as an example; TextEncoder is assumed. Probe P-JS-5."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/j.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:j="https://pagelove.org/Binding/JavaScript" xmlns:p="https://pagelove.org/1.0"><body>
            <main>
            <div j:h="'SHA:' + Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('abc')))).map((b) => b.toString(16).padStart(2, '0')).join('')"><p:stamp h></p:stamp></div>
            </main>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET the composed page"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/j.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          body_contains: ["SHA:ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"]
