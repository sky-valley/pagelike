# JavaScript area: global environment and language features (docs/spec/javascript.md A2, A5,
# R-JS-5, R-JS-37..R-JS-39). Checks run either in a j: binding (surfaced with <p:stamp>) or in a
# JavaScript method element whose string result is inserted into <main>.
# Spec: docs/spec/javascript.md. Generated; edit by hand freely.
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "medium"
  requires: ["server-js"]
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
  - id: "javascript.globals.host-io-absent"
    title: "fetch, process, require, setTimeout, setInterval and HTTPResponse are not defined"
    feature: "globals"
    source: "docs languages/javascript/server/javascript-in-schemas §Supported language features (Not supported), §Explaining why a value was rejected (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-38."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/j.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:j="https://pagelove.org/Binding/JavaScript" xmlns:p="https://pagelove.org/1.0"><body>
            <main>
            <div j:g="'G1:' + [typeof fetch, typeof process, typeof require, typeof setTimeout, typeof setInterval, typeof HTTPResponse].join('|')"><p:stamp g></p:stamp></div>
            </main>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET the composed page"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/j.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          body_contains: ["G1:undefined|undefined|undefined|undefined|undefined|undefined"]
