            <meta itemprop="name" content="probe">
            <div itemprop="implementation" itemscope itemtype="https://pagelove.org/JavaScript/Module">
            <script itemprop="source" type="module">
            const S = (...a) => a.map(String).join('|');
            const H = (x) => String(x).replace(/[<>"]/g, (c) => ({ '<': '[', '>': ']', '"': "'" })[c]);
            const tryName = (f) => { try { f(); return 'ok'; } catch (e) { return e.name + ':' + e.code; } };
            const topThis = this;
            export default function () {
            const inner = function () { return this; };
            let r = 'no-throw';
            try { undeclaredGlobalZ = 1; } catch (e) { r = e.name; }
            return 'STRICT:' + [topThis === undefined, inner() === undefined, r].join('|');
            }
            </script>
            </div>
            </li>
            </ul>
            </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET <main>: the method result is inserted as text"
