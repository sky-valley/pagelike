# JavaScript area: j: expression bindings (docs/spec/javascript.md A4, R-JS-30..R-JS-36).
# Values are surfaced with <p:stamp name> (docs reference/composing-pages/Stamp) and read
# back with Range: selector=main. JS template literals inside bodies are written $${...}
# so the harness does not expand them.
# Spec: docs/spec/javascript.md. Generated; edit by hand freely.
defaults:
  area: "javascript"
  evidence: "documented"
  confidence: "medium"
  requires: ["server-js"]
  site:
    settings:
      default_get: "allow"
    rules:
      - actor: "*"
        resource: "${P}/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
      - actor: "*"
        resource: "${P}/*/*/*"
        method: ["GET", "HEAD", "PUT", "POST", "DELETE", "MOVE"]
        action: "Allow"
cases:
  - id: "javascript.jbind.docs-example-liquid"
    title: "Documented example: j:total reduces an array, j:doubled reads it as a bare identifier, Liquid renders both"
    feature: "j: bindings"
    source: "docs reference/composing-pages/JavaScript-Expression-Binding §Attribute form, §In action (snapshot 2026-09-28)"
    confidence: "high"
    requires: ["server-js", "liquid"]
    live: true
    notes: "spec: R-JS-31, R-JS-32, R-JS-33. The docs page omits the setup document (unrendered {% example %} placeholder); it is reconstructed from the snippet. xmlns:pagelove is declared defensively (the snippet does not show it)."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/js-expr-summary.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:j="https://pagelove.org/Binding/JavaScript" xmlns:pagelove="https://pagelove.org/1.0">
            <body>
            <ul j:total="[10, 20, 30].reduce((a, b) => a + b, 0)"
                j:doubled="total * 2"
                pagelove:template="text/liquid">
              <li>Total: {{ total }}</li>
              <li>Doubled: {{ doubled }}</li>
            </ul>
            </body>
            </html>
        expect:
          status: [200, 201, 204]
      - name: "GET renders the computed values; binding attributes are stripped"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/js-expr-summary.html"
        expect:
          status: 200
          body_contains: ["<li>Total: 60</li>", "<li>Doubled: 120</li>"]
          body_not_contains: ["j:total", "j:doubled", "pagelove:template", "{{"]
  - id: "javascript.jbind.stamp-value"
    title: "A j: value is written to Context and emitted by a descendant <p:stamp>"
    feature: "j: bindings"
    source: "docs reference/composing-pages/JavaScript-Expression-Binding §Attribute form; docs reference/composing-pages/Stamp §Form (snapshot 2026-09-28)"
    confidence: "high"
    live: true
    notes: "spec: R-JS-33."
    steps:
      - name: "PUT the page (public plane; registers inline declarations)"
        as: "anonymous"
        request:
          method: "PUT"
          path: "${P}/j.html"
          headers:
            Content-Type: "text/html"
          body: |
            <!DOCTYPE html>
            <html xmlns:j="https://pagelove.org/Binding/JavaScript" xmlns:p="https://pagelove.org/1.0"><body>
            <main>
            <div j:greeting="'hello from ' + 'JavaScript'"><p:stamp greeting></p:stamp></div>
            </main>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET the composed page"
        as: "anonymous"
        request:
          method: "GET"
          path: "${P}/j.html"
          headers:
            Range: "selector=main"
        expect:
          status: 206
          body_contains: ["hello from JavaScript"]
          body_not_contains: ["p:stamp"]
