# Modeling: required combinations (GroupConstraint).
# Spec: docs/spec/modeling.md §13 (R-MOD-54..R-MOD-57).
cases:
  - id: modeling.groups.exactly-one-auth-method
    title: "Exactly one of password / oauth-token must be present (docs UserAuth example)"
    area: modeling
    feature: "group constraints"
    evidence: documented
    source: "docs reference/modeling-data/GroupConstraint §Examples (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-54, R-MOD-57. Documented message format: group '<name>' constraint violated: <cardinality error>."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/UserAuth">
                <meta itemprop="name" content="UserAuth">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="password">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="0..1">
                  <meta itemprop="group" content="auth-method">
                </div>
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="oauth-token">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="0..1">
                  <meta itemprop="group" content="auth-method">
                </div>
                <div itemprop="constraint" itemscope itemtype="https://schema.host/GroupConstraint">
                  <meta itemprop="group" content="auth-method">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "alice with password only accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/alice.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/UserAuth">
                <meta itemprop="password" content="hashed-secret">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "bob with both rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/bob.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/UserAuth">
                <meta itemprop="password" content="hashed-secret">
                <meta itemprop="oauth-token" content="token123">
              </div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://pagelove.org/SchemaViolation", group, auth-method]
      - name: "carol with neither rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/carol.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/UserAuth"></div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://pagelove.org/SchemaViolation", group]
