  - id: modeling.write-paths.failed-write-changes-nothing
    title: "A rejected write leaves the document and its ETag unchanged"
    area: modeling
    feature: atomicity
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/modeling-write-paths-failed-write-change.json (atomicity as documented in docs reference/modeling-data/ShapeConstraint §Error cases, snapshot 2026-09-28: 'No partial modification is applied on failure'; the refusal of a selector write is PageLove's Cardinality problems item)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-16, R-MOD-70. Adopt-live 2026-09-29 for the body of a selector write that breaks a cardinality."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "valid tag"
        as: anonymous
        request:
          method: PUT
          path: "${P}/t.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag" id="t1">
                <meta itemprop="label" content="a">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "read and capture the ETag"
        as: anonymous
        request:
          method: GET
          path: "${P}/t.html"
        expect:
          status: 200
          headers_present: [ETag]
        capture:
          etag1: header.ETag
      - name: "invalid selector delete refused"
        as: anonymous
        request:
          method: DELETE
          path: "${P}/t.html"
          headers:
            Range: "selector=#t1 > meta[itemprop=\"label\"]"
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body: "<div itemscope itemtype=\"https://dombase.pagelove.team/ns/error/Cardinality\"><ul itemprop=\"problems\"><li itemprop=\"problem\"><span itemprop=\"message\">https://pagelike.test${P}/Tag /label: cardinality 1..1 violated: expected exactly 1 value, found 0 (cardinality)</span></li></ul></div>"
      - name: "document unchanged"
        as: anonymous
        request:
          method: GET
          path: "${P}/t.html"
        expect:
          status: 200
          body_contains: ["content=\"a\""]
          etag_equals: "${etag1}"
