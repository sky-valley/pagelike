# Modeling: which operations are validated, which instances a write affects, atomicity.
# Spec: docs/spec/modeling.md §3 (R-MOD-13..R-MOD-16).
cases:
  - id: modeling.write-paths.webdav-put-validated-by-schema
    title: "WebDAV authoring writes are validated against schemas"
    area: modeling
    feature: "validated operations"
    evidence: documented
    source: "docs reference/protocol/WebDAV §When something goes wrong (snapshot 2026-09-28); pagelove-shop/worker/src/index.js@d887054:250-256"
    confidence: medium
    requires: [webdav]
    live: true
    notes: "spec: R-MOD-13, R-MOD-75. The WebDAV error body is https://pagelove.org/Error with the pipeline document under 'detail' (not asserted). Kept (keep-documented-security, docs/compat/decisions-2026-09-29/serialization.md, \"Integration\"): live PageLove stores a WebDAV PUT without schema or shape checks; pagelike keeps the documented check, which apps such as the shop rely on to keep scripts out of documents their workers write. Sibling: .live."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "author PUT of an invalid instance refused"
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/t.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
        expect:
          status: 422
      - name: "t.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/t.html"
        expect:
          status: 404

  - id: modeling.write-paths.webdav-put-validated-by-schema.live
    title: "WebDAV authoring PUTs are not validated against schemas (the id predates the live answer)"
    area: modeling
    feature: "validated operations"
    status: live-divergence
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/modeling-write-paths-webdav-put-validate.json; harness/observations/live-2026-09-29-reconcile-modeling/modeling-probe-0929-webdav-after-propaga.json (still stored 65 s after the schema was stored, so no propagation delay explains it)"
    confidence: high
    requires: [webdav]
    live: true
    notes: "spec: R-MOD-13. Adopt-live 2026-09-29: the docs (WebDAV §When something goes wrong) and the shop demo implied a 422; PageLove stores the instance as sent, and the public plane still refuses it."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "author PUT of an invalid instance is stored"
        as: author
        plane: dav
        request:
          method: PUT
          path: "${P}/t.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
        expect:
          status: 201
      - name: "t.html was stored as sent"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/t.html"
        expect:
          status: 200
          body_contains: ["<div itemscope itemtype=\"https://pagelike.test${P}/Tag\"></div>"]
      - name: "the same instance is refused on the public plane"
        as: anonymous
        request:
          method: PUT
          path: "${P}/t2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
        expect:
          status: 422
          body_contains: ["https://pagelove.org/SchemaViolation", "Tag].label: cardinality 1..1 violated: expected exactly 1 value, found 0"]
