    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-5, R-MOD-13."
    site:
      settings:
        default_get: allow
      files:
        - path: "${P}/old.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "GET the pre-existing invalid document"
        as: anonymous
        request:
          method: GET
          path: "${P}/old.html"
        expect:
          status: 200
          body_contains: [itemscope]
  - id: modeling.write-paths.unaffected-siblings-not-rechecked
    title: "A selector write validates only affected instances; an invalid sibling does not block it"
    area: modeling
    feature: "affected instances"
    evidence: inferred
    source: "pagelike decision (docs/spec/modeling.md R-MOD-14); docs reference/reading-and-writing/MOVE-method §When to reach for it (snapshot 2026-09-28)"
    confidence: low
    requires: []
    live: true
    notes: "spec: R-MOD-14. Probe P-MOD-14."
    site:
      settings:
        default_get: allow
      files:
        - path: "${P}/pair.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag" id="t1">
                <meta itemprop="label" content="a">
              </div>
              <div itemscope itemtype="https://pagelike.test${P}/Tag" id="t2"></div>
            </body></html>
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "replace the valid first tag with another valid tag"
        as: anonymous
        request:
          method: PUT
          path: "${P}/pair.html"
          headers:
            Range: "selector=#t1"
            Content-Type: text/html
          body: |
            <div itemscope itemtype="https://pagelike.test${P}/Tag" id="t1">
              <meta itemprop="label" content="a2">
            </div>
        expect:
          status: [200, 204, 206]
