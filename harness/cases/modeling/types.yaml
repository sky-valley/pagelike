# Modeling: primitive types, enums, nested schema types, unknown types, value extraction.
# Spec: docs/spec/modeling.md §4-5 (R-MOD-19..R-MOD-26).
cases:
  - id: modeling.types.text-accepts-anything
    title: "Text accepts any string"
    area: modeling
    feature: "primitive types"
    evidence: documented
    source: "docs reference/modeling-data/Types §Primitive types (snapshot 2026-09-28); docs reference/modeling-data/Types §Validation examples (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-21."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Value">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="v">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "valid: \"\""
        as: anonymous
        request:
          method: PUT
          path: "${P}/ok-0.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Value">
                <meta itemprop="v" content="">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "valid: \"hello\""
        as: anonymous
        request:
          method: PUT
          path: "${P}/ok-1.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Value">
                <meta itemprop="v" content="hello">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "valid: \"<b>bold</b>\""
        as: anonymous
        request:
          method: PUT
          path: "${P}/ok-2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Value">
                <meta itemprop="v" content="&lt;b&gt;bold&lt;/b&gt;">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
