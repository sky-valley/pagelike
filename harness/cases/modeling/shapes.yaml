# Modeling: ShapeConstraint (open shapes: required structure), scope, statuses 422/409 and the error body.
# Spec: docs/spec/modeling.md §15-16 (R-MOD-61..R-MOD-64, R-MOD-68, R-MOD-71).
# Every shape declares a resource under ${P} so it cannot affect other data on a live host.
# Error bodies (live 2026-09-29, docs/compat/decisions-2026-09-29/modeling.md): a 422 is the bare problems
# item https://dombase.pagelove.team/ns/error/ShapeConstraint ("Shape constraints violated", then one
# "https://pagelove.org/ShapeConstraint <selector>: <message>" problem per violation); a 409 (DELETE) is
# a CascadeBlocked item. The documented ConstraintViolation page is not what PageLove serves.
cases:
  - id: modeling.shapes.required-properties-user
    title: "Shape requiring username and email on User items (docs example)"
    area: modeling
    feature: "shape constraints"
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/modeling-shapes-required-properties-user.json (status as documented in docs reference/modeling-data/ShapeConstraint §Examples, snapshot 2026-09-28; the body is PageLove's problems item, not the documented page)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-63, R-MOD-64, R-MOD-71. Adopt-live 2026-09-29 (error vocabulary)."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/shapes.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/ShapeConstraint">
                <meta itemprop="resource" content="${P}/people/*">
                <code itemprop="selector">[itemtype*=User]</code>
                <code itemprop="constraint">:has([itemprop="username"])</code>
                <code itemprop="constraint">:has([itemprop="email"])</code>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "complete user accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/people/complete-user.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://example.org/User">
                <span itemprop="username">alice</span>
                <span itemprop="email">alice@example.com</span>
              </div>
            </body></html>
        expect:
          status: [200, 201]
      - name: "user missing email rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/people/missing-email.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://example.org/User">
                <span itemprop="username">bob</span>
              </div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains:
            - "<div itemscope itemtype=\"https://dombase.pagelove.team/ns/error/ShapeConstraint\"><ul itemprop=\"problems\">"
            - "<li itemprop=\"problem\"><span itemprop=\"message\">Shape constraints violated</span></li>"
            - "<li itemprop=\"problem\"><span itemprop=\"message\">https://pagelove.org/ShapeConstraint [itemtype*=User]: Element matching '[itemtype*=User]' does not satisfy constraint ':has([itemprop=\"email\"])'</span></li>"
          body_not_contains: ["username"]
      - name: "missing-email.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/people/missing-email.html"
        expect:
          status: 404
