  - id: modeling.shapes.post-into-container-checks-new-children
    title: "A POST into a list is checked against a shape whose selector matches the new child (descendant selector)"
    area: modeling
    feature: "shape constraints"
    evidence: demo-source
    source: "pagelove-cursor/plugins/pagelove/skills/pagelove-dev/SKILL.md@b97c3ef:141-150,473-479; pagelove-ats/site/admin/auth.html@8f200fc:340-348"
    confidence: medium
    requires: []
    live: true
    notes: "spec: R-MOD-63. Contradiction C8: the docs algorithm says the request target is checked against the selector; that reading never fires here."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/shapes.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/ShapeConstraint">
                <meta itemprop="resource" content="${P}/lists/*">
                <code itemprop="selector">#my-list li</code>
                <code itemprop="constraint">:has([itemprop=name])</code>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "seed a list"
        as: anonymous
        request:
          method: PUT
          path: "${P}/lists/l.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <ul id="my-list"></ul>
            </body></html>
        expect:
          status: [200, 201]
      - name: "malformed item rejected"
        as: anonymous
        request:
          method: POST
          path: "${P}/lists/l.html"
          headers:
            Range: "selector=#my-list"
            Content-Type: text/html
          body: "<li>malformed</li>"
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://dombase.pagelove.team/ns/error/ShapeConstraint", "Shape constraints violated"]
      - name: "well-formed item accepted"
        as: anonymous
        request:
          method: POST
          path: "${P}/lists/l.html"
          headers:
            Range: "selector=#my-list"
            Content-Type: text/html
          body: "<li><span itemprop=\"name\">ok</span></li>"
        expect:
          status: [200, 204, 206]
      - name: "stored state of l.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/lists/l.html"
        expect:
          status: 200
          body_contains: [ok]
          body_not_contains: [malformed]
