# Modeling: property cardinality and which writes validate it (PUT, POST, DELETE and MOVE with selectors).
# Spec: docs/spec/modeling.md §3-4 (R-MOD-13..R-MOD-18).
cases:
  - id: modeling.cardinality.minimal-tag-example
    title: "Docs minimal Tag schema: label is required (1..1)"
    area: modeling
    feature: cardinality
    evidence: documented
    source: "docs reference/modeling-data/Schema §Examples > Minimal (snapshot 2026-09-28); docs reference/modeling-data/Property §Cardinality values (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-18."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <meta itemprop="unique" content="true">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "Tag without label rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/t1.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://pagelove.org/SchemaViolation", cardinality]
      - name: "t1.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/t1.html"
        expect:
          status: 404
      - name: "Tag with label accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/t2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag">
                <meta itemprop="label" content="urgent">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
