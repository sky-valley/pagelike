  - id: modeling.validators.js-throw-httpresponse
    title: "A JS @validate that throws an HTTPResponse-shaped object chooses the status and message"
    area: modeling
    feature: validators
    evidence: documented
    source: "docs languages/javascript/server/javascript-in-schemas §Explaining why a value was rejected (snapshot 2026-09-28)"
    confidence: high
    requires: [server-js]
    live: true
    notes: "spec: R-MOD-47. The docs example uses a template literal; this case concatenates strings because the harness reserves ${...}."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Site">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="hostname">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <div itemprop="@validate" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                    <script itemprop="source" type="module">export default function (hostname) {
                        const allowed = ["a.example.com"];
                        if (!allowed.includes(hostname)) {
                          throw { schema_url: "https://pagelove.org/HTTPResponse", status: 422, message: hostname + " is not on this platform" };
                        }
                        return true;
                      }</script>
                  </div>
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "allowed hostname accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/a.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Site">
                <meta itemprop="hostname" content="a.example.com">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "other hostname rejected with the thrown message"
        as: anonymous
        request:
          method: PUT
          path: "${P}/b.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Site">
                <meta itemprop="hostname" content="b.example.com">
              </div>
            </body></html>
        expect:
          status: 422
          body_contains: ["b.example.com is not on this platform"]
