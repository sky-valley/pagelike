# Modeling: property-level and schema-level @validate (Sessel and JavaScript), HTTPResponse refusals,
# compile failures, and validation stage order.
# Spec: docs/spec/modeling.md §11 (R-MOD-45..R-MOD-48) and R-MOD-15.
cases:
  - id: modeling.validators.property-sessel-email
    title: "A property-level Sessel @validate rejects values that fail the expression"
    area: modeling
    feature: validators
    evidence: documented
    source: "docs reference/modeling-data/Property §Validators (snapshot 2026-09-28); docs reference/modeling-data/Property §Shape (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-MOD-45."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Account">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="email">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <div itemprop="@validate" itemscope itemtype="https://pagelove.org/Sessel">
                    <script itemprop="source" type="text/sessel">self.all((el) => el.text().matches("^[^@]+@[^@]+\\.[^@]+$"))</script>
                  </div>
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "valid email accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/a.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Account">
                <span itemprop="email">alice@example.com</span>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "invalid email rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/b.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Account">
                <span itemprop="email">not-an-email</span>
              </div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://pagelove.org/SchemaViolation", "@validate"]
      - name: "b.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/b.html"
        expect:
          status: 404
