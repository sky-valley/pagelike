        request:
          method: PUT
          path: "${P}/p2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Person">
                <span itemprop="name">Alice</span>
                <div itemscope itemtype="https://pagelike.test${P}/Address" itemprop="address">
                  <meta itemprop="street" content="1 Main">
                  <meta itemprop="city" content="Shelbyville">
                </div>
              </div>
            </body></html>
