# Modeling: nested schema types and typed items inside other items.
# Spec: docs/spec/modeling.md R-MOD-14, R-MOD-24.
# Live 2026-09-29 (docs/compat/decisions-2026-09-29/modeling.md): PageLove validates only outermost items. An item
# inside another item's markup is not validated against its schema, whether it is a property value or not, and a
# property typed with a schema is not type-checked. The documented recursive validation is not what PageLove does.
cases:
  - id: modeling.nested.recursive-validation
    title: "A nested item is not validated against its own schema (docs Person/Address; the id predates the live answer)"
    area: modeling
    feature: "nested types"
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/modeling-nested-recursive-validation.json; harness/observations/live-2026-09-29-reconcile-modeling/modeling-probe-0929-nested-scope.json (documented as recursive: docs reference/modeling-data/Types §Nested schema types and Property §Type, snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-14, R-MOD-24. Adopt-live 2026-09-29."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Address">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="street">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="city">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Person">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="name">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="address">
                  <meta itemprop="type" content="https://pagelike.test${P}/Address">
                  <meta itemprop="cardinality" content="0..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "complete nested address accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p1.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Person">
                <span itemprop="name">Alice</span>
                <div itemscope itemtype="https://pagelike.test${P}/Address" itemprop="address">
                  <span itemprop="street">123 Main St</span>
                  <span itemprop="city">Springfield</span>
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "nested address missing city accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Person">
                <span itemprop="name">Alice</span>
                <div itemscope itemtype="https://pagelike.test${P}/Address" itemprop="address">
                  <span itemprop="street">123 Main St</span>
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "absent optional address accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p3.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Person">
                <span itemprop="name">Alice</span>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
