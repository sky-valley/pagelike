              <div itemscope itemtype="https://pagelike.test${P}/Person">
                <span itemprop="name">Alice</span>
                <div itemscope itemtype="https://pagelike.test${P}/Elsewhere" itemprop="address">
                  <span itemprop="street">1 Road</span>
