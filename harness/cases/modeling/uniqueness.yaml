# Modeling: individual and composite uniqueness.
# Spec: docs/spec/modeling.md §7 (R-MOD-30..R-MOD-32). Uniqueness failures were documented as the
# ConstraintViolation page ('the same shape as' transition violations); live 2026-09-29 PageLove answers the bare
# problems item https://dombase.pagelove.team/ns/error/ConstraintViolation with a "Constraint violation: 1
# violation(s):" list whose lines start "[uniqueness]" (docs/compat/decisions-2026-09-29/modeling.md). Demo apps
# match /uniqueness/i on the body, which still holds.
cases:
  - id: modeling.uniqueness.duplicate-across-documents
    title: "A second Project with an existing slug is rejected and the first is unaffected"
    area: modeling
    feature: uniqueness
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/modeling-uniqueness-duplicate-across-doc.json (behaviour as documented in docs reference/modeling-data/Property §Uniqueness and recipes/linking-related-data §Unique constraints, snapshot 2026-09-28; the body is PageLove's problems item)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-30, R-MOD-72. Adopt-live 2026-09-29 for the body, except that pagelike does not name the document already holding the value (PageLove appends \" at '<path>'\"; keep-documented-security, measured by modeling.uniqueness.duplicate-across-documents.live)."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Project">
                <li itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="slug">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <meta itemprop="unique" content="true">
                </li>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "first project"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p1.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Project">
                <meta itemprop="slug" content="launch">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "second project with the same slug"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Project">
                <meta itemprop="slug" content="launch">
              </div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains:
            - "<div itemscope itemtype=\"https://dombase.pagelove.team/ns/error/ConstraintViolation\"><ul itemprop=\"problems\"><li itemprop=\"problem\"><span itemprop=\"message\">Constraint violation: 1 violation(s):"
            - "\n  - [uniqueness] [itemprop='slug'] (unique(slug)): Uniqueness violation: value already exists for property 'slug'"
      - name: "p2.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/p2.html"
        expect:
          status: 404
      - name: "stored state of p1.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/p1.html"
        expect:
          status: 200
          body_contains: ["content=\"launch\""]
  - id: modeling.uniqueness.duplicate-across-documents.live
    title: "Live PageLove names the document that already holds a unique value"
    area: modeling
    feature: uniqueness
    status: live-divergence
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/modeling-uniqueness-duplicate-across-doc.json (\"... already exists for property 'slug' at '/_pl/.../p1.html'\")"
    confidence: high
    requires: []
    live: true
    notes: "Measures a deliberate divergence (docs/compat/decisions-2026-09-29/modeling.md, keep-documented-security): pagelike withholds the path, which could name a document the writer cannot read. Runs only against --target live."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT]
          action: Allow
    steps:
      - name: "register a Project schema with a unique slug"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Project">
                <li itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="slug">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="unique" content="true">
                </li>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "first project"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p1.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Project"><meta itemprop="slug" content="launch"></div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "the refusal names the first project's document"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Project"><meta itemprop="slug" content="launch"></div>
            </body></html>
        expect:
          status: 422
          body_contains: ["Uniqueness violation: value already exists for property 'slug' at '${P}/p1.html'"]
