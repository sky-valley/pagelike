  - id: modeling.uniqueness.post-append-duplicate
    title: "Appending a duplicate into a list with a selector POST is rejected (demo RSVP pattern)"
    area: modeling
    feature: uniqueness
    evidence: demo-source
    source: "demo-apps/demo-01-event/schema/event.html@c4dd883:35-45; demo-apps/demo-01-event/app.js@c4dd883:44-58"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-30, R-MOD-32. The demo apps detect this failure by matching /uniqueness/i on the 422 body (demo-01 app.js:54)."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/RSVP">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="rsvpKey">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <meta itemprop="unique" content="true">
                </div>
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="attendee">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "seed the list"
        as: anonymous
        request:
          method: PUT
          path: "${P}/event.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <ul id="rsvps">
                <li itemscope itemtype="https://pagelike.test${P}/RSVP" id="rsvp-alice">
                  <meta itemprop="rsvpKey" content="ev:alice">
                  <meta itemprop="attendee" content="alice">
                </li>
              </ul>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "duplicate RSVP rejected"
        as: anonymous
        request:
          method: POST
          path: "${P}/event.html"
          headers:
            Range: "selector=#rsvps"
            Content-Type: text/html
          body: |
            <li itemscope itemtype="https://pagelike.test${P}/RSVP" id="rsvp-alice2">
              <meta itemprop="rsvpKey" content="ev:alice">
              <meta itemprop="attendee" content="alice">
            </li>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://dombase.pagelove.team/ns/error/ConstraintViolation", "[uniqueness]"]
      - name: "different attendee accepted"
        as: anonymous
        request:
          method: POST
          path: "${P}/event.html"
          headers:
            Range: "selector=#rsvps"
            Content-Type: text/html
          body: |
            <li itemscope itemtype="https://pagelike.test${P}/RSVP" id="rsvp-ben">
              <meta itemprop="rsvpKey" content="ev:ben">
              <meta itemprop="attendee" content="ben">
            </li>
        expect:
          status: [200, 204, 206]
      - name: "stored state of event.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/event.html"
        expect:
          status: 200
          body_contains: [rsvp-ben]
          body_not_contains: [rsvp-alice2]
