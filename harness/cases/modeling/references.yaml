                  <meta itemprop="cascade" content="restrict">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "org acme"
        as: anonymous
        request:
          method: PUT
          path: "${P}/org.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Org">
                <meta itemprop="identifier" content="acme">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "member of acme"
        as: anonymous
        request:
          method: PUT
          path: "${P}/m.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Member">
                <meta itemprop="org" content="acme">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "delete the org document"
        as: anonymous
        request:
          method: DELETE
          path: "${P}/org.html"
        expect:
          status: 409
      - name: "stored state of org.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/org.html"
        expect:
          status: 200
          body_contains: ["content=\"acme\""]
      - name: "stored state of m.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/m.html"
        expect:
          status: 200
          body_contains: ["content=\"acme\""]
