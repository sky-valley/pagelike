# Modeling: references (foreign keys), cascade and restrict.
# Spec: docs/spec/modeling.md §9 (R-MOD-37..R-MOD-43).
cases:
  - id: modeling.references.unresolved-rejected
    title: "A referencing value must match an existing value on the target type"
    area: modeling
    feature: references
    evidence: documented
    source: "docs reference/modeling-data/Property §References and cascade (snapshot 2026-09-28); docs recipes/linking-related-data §Referential integrity (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-38."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Org">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="identifier">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <meta itemprop="unique" content="true">
                </div>
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Member">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="org">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <meta itemprop="references" content="https://pagelike.test${P}/Org#identifier">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "member pointing at a missing org"
        as: anonymous
        request:
          method: PUT
          path: "${P}/m.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Member">
                <meta itemprop="org" content="acme">
              </div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
      - name: "m.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/m.html"
        expect:
          status: 404
      - name: "create org acme"
        as: anonymous
        request:
          method: PUT
          path: "${P}/org.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Org">
                <meta itemprop="identifier" content="acme">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "member now resolves"
        as: anonymous
        request:
          method: PUT
          path: "${P}/m.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Member">
                <meta itemprop="org" content="acme">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
