          status: [200, 201]
      - name: "plain li accepted"
        as: anonymous
        request:
          method: POST
          path: "${P}/list/l.html"
          headers:
            Range: "selector=#items"
            Content-Type: text/html
          body: "<li>ok</li>"
        expect:
          status: [200, 204, 206]
      - name: "li with bold text rejected"
        as: anonymous
        request:
          method: POST
          path: "${P}/list/l.html"
          headers:
