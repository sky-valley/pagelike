    live: true
    notes: "spec: R-MOD-65, R-MOD-66. The root <ul>'s itemprop, id and class are covered by the shape selector itself."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/constraints.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/ShapeConstraint">
                <meta itemprop="resource" content="${P}/posts/*">
                <code itemprop="selector">[itemprop='comments'][id][class]</code>
                <code itemprop="permit">li[class="comment"][itemscope][itemtype="https://blog.example/Comment"]</code>
                <code itemprop="permit">p[class="comment-meta"]</code>
                <code itemprop="permit">strong[itemprop="author"]</code>
                <code itemprop="permit">time[itemprop="createdAt"][datetime]</code>
                <code itemprop="permit">div[itemprop="body"]</code>
                <code itemprop="permit">p</code>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "seed a post with a comments list"
        as: anonymous
        request:
          method: PUT
          path: "${P}/posts/hello.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <ul itemprop="comments" id="comments-hello" class="comments"></ul>
            </body></html>
        expect:
          status: [200, 201]
      - name: "script comment refused"
        as: anonymous
        request:
          method: POST
          path: "${P}/posts/hello.html"
          headers:
            Range: "selector=#comments-hello"
            Content-Type: text/html
          body: "<li class=\"comment\"><script>alert(\"gotcha\")</script></li>"
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://dombase.pagelove.team/ns/error/ShapeConstraint", "Shape constraints violated"]
      - name: "honest comment accepted"
        as: anonymous
        request:
          method: POST
          path: "${P}/posts/hello.html"
          headers:
            Range: "selector=#comments-hello"
            Content-Type: text/html
          body: "<li class=\"comment\" itemscope itemtype=\"https://blog.example/Comment\"><p class=\"comment-meta\"><strong itemprop=\"author\">Ann</strong> <time itemprop=\"createdAt\" datetime=\"2026-09-28\">just now</time></p><div itemprop=\"body\"><p>Nice post.</p></div></li>"
        expect:
          status: [200, 204, 206]
      - name: "stored state of hello.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/posts/hello.html"
        expect:
          status: 200
          body_contains: ["Nice post."]
          body_not_contains: [gotcha]
