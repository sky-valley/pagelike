# Modeling: closed ShapeConstraints (permit), attribute coverage, composed shapes, pre-existing content.
# Spec: docs/spec/modeling.md §15 (R-MOD-65..R-MOD-67, R-MOD-69).
# Error bodies (live 2026-09-29, docs/compat/decisions-2026-09-29/modeling.md): PageLove answers the bare
# problems item https://dombase.pagelove.team/ns/error/ShapeConstraint, not the documented page.
cases:
  - id: modeling.shapes-closed.note-worked-example
    title: "Closed Note shape: only id, title and content are allowed (docs worked example)"
    area: modeling
    feature: "closed shapes"
    evidence: live-observed
    source: "harness/observations/live-2026-09-29/modeling-shapes-closed-note-worked-examp.json (statuses as documented in docs reference/modeling-data/ShapeConstraint §Closed shapes > Worked example, snapshot 2026-09-28; bodies and messages are PageLove's)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-65, R-MOD-71. Adopt-live 2026-09-29 (error vocabulary and closed-shape messages)."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/shapes.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/ShapeConstraint">
                <meta itemprop="resource" content="${P}/notes/*">
                <code itemprop="selector">article[itemtype*=Note]</code>
                <code itemprop="permit">[id]</code>
                <code itemprop="permit">[itemprop="title"]</code>
                <code itemprop="permit">[itemprop="content"]</code>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "fully permitted note accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/notes/n1.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <article itemtype="https://schema.org/Note" id="n1">
                <h2 itemprop="title">My Note</h2>
                <p itemprop="content">Some text.</p>
              </article>
            </body></html>
        expect:
          status: [200, 201]
      - name: "note with an img rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/notes/n2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <article itemtype="https://schema.org/Note" id="n1">
                <h2 itemprop="title">My Note</h2>
                <p itemprop="content">Some text.</p>
                <img src="x.png">
              </article>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains:
            - "https://dombase.pagelove.team/ns/error/ShapeConstraint"
            - "Shape constraints violated"
            - "https://pagelove.org/ShapeConstraint article[itemtype*=Note]: Element &lt;img&gt; inside 'article[itemtype*=Note]' is not permitted by any permit"
      - name: "note with onclick on the title rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/notes/n3.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <article itemtype="https://schema.org/Note" id="n1">
                <h2 itemprop="title" onclick="x()">My Note</h2>
                <p itemprop="content">Some text.</p>
              </article>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains:
            - "https://dombase.pagelove.team/ns/error/ShapeConstraint"
            - "Shape constraints violated"
            - "https://pagelove.org/ShapeConstraint article[itemtype*=Note]: Attribute &lt;onclick&gt; on &lt;h2&gt; inside 'article[itemtype*=Note]' is not permitted by any matching permit"
      - name: "note with a class on the root rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/notes/n4.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <article itemtype="https://schema.org/Note" id="n4" class="x">
                <h2 itemprop="title">My Note</h2>
                <p itemprop="content">Some text.</p>
              </article>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains:
            - "https://dombase.pagelove.team/ns/error/ShapeConstraint"
            - "Shape constraints violated"
            - "https://pagelove.org/ShapeConstraint article[itemtype*=Note]: Attribute &lt;class&gt; on &lt;article&gt; matched by 'article[itemtype*=Note]' is not permitted by the selector or any matching permit"
      - name: "n2.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/notes/n2.html"
        expect:
          status: 404
  - id: modeling.shapes-closed.tag-only-permit-covers-no-attributes
    title: "A tag-only permit allows the element but none of its attributes"
    area: modeling
    feature: "closed shapes"
    evidence: documented
    source: "docs reference/modeling-data/ShapeConstraint §Closed shapes > What each permit pattern covers (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-66."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/shapes.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/ShapeConstraint">
                <meta itemprop="resource" content="${P}/box/*">
                <code itemprop="selector">#box</code>
                <code itemprop="permit">p</code>
                <code itemprop="permit">[lang]</code>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "plain p accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/box/a.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div id="box">
                <p>hi</p>
              </div>
            </body></html>
        expect:
          status: [200, 201]
      - name: "p with lang accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/box/b.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div id="box">
                <p lang="en">hi</p>
              </div>
            </body></html>
        expect:
          status: [200, 201]
      - name: "p with class rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/box/c.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div id="box">
                <p class="x">hi</p>
              </div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://dombase.pagelove.team/ns/error/ShapeConstraint", "Shape constraints violated"]
