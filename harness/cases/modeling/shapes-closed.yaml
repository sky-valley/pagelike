                <div><span title="s">x</span></div>
              </div>
            </body></html>
        expect:
          status: [200, 201]
      - name: "title on the div is not covered by the :has(> span[title]) permit"
        as: anonymous
        request:
          method: PUT
          path: "${P}/box/b.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div id="box">
                <div title="t"><span title="s">x</span></div>
              </div>
