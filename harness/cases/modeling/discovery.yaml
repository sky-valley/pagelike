        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "store an ungoverned item with arbitrary properties"
        as: anonymous
        request:
          method: PUT
          path: "${P}/free.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Ungoverned">
                <meta itemprop="count" content="not-a-number">
                <meta itemprop="count" content="twice">
                <span itemprop="whatever"></span>
