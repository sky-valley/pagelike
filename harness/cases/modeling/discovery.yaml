  - id: modeling.discovery.same-write-not-self-validated
    title: "A write that carries a new schema is validated against the registry as it was before the write"
    area: modeling
    feature: "schema registration timing"
    evidence: inferred
    source: "docs reference/reacting-to-changes/TransitionConstraint §Taking effect (snapshot 2026-09-28); docs reference/modeling-data/Methods §Declaration (snapshot 2026-09-28)"
    confidence: medium
    requires: []
    live: true
    notes: "spec: R-MOD-4. Inferred from 'the very next write validates against the new rules' (TransitionConstraint). Probe P-MOD-3."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "one PUT declares the schema and an invalid instance"
        as: anonymous
        request:
          method: PUT
          path: "${P}/both.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "the next write is validated against the new schema"
        as: anonymous
        request:
          method: PUT
          path: "${P}/next.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://pagelove.org/SchemaViolation", cardinality]
