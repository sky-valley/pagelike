  - id: modeling.discovery.webdav-authored-schema-within-60s
    title: "A schema authored over WebDAV is enforced within 60 seconds"
    area: modeling
    feature: "schema registration timing"
    evidence: documented
    source: "docs reference/reacting-to-changes/TransitionConstraint §Taking effect (snapshot 2026-09-28); docs recipes/declaring-a-state-machine §The repair path (snapshot 2026-09-28)"
    confidence: medium
    requires: [slow]
    live: true
    notes: "spec: R-MOD-4. The 60 s bound is documented for TransitionConstraint rules edited over WebDAV and inferred for schemas (same host cache). Probe P-MOD-1 measures the actual delay."
    site:
      settings:
        default_get: allow
      files:
        - path: "${P}/schema.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - sleep_ms: 61000
      - name: "write after the propagation window is validated"
        as: anonymous
        request:
          method: PUT
          path: "${P}/late.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://pagelove.org/SchemaViolation", cardinality]
