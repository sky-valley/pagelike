# Modeling: where schema declarations live, when they take effect.
# Spec: docs/spec/modeling.md §1 (R-MOD-2..R-MOD-6). Type URLs embed ${P} so live runs never collide.
# Declarations are registered through a public-plane PUT (documented: a schema "is registered with the
# host's cache when the document containing it is PUT/POST'd"), which avoids the up-to-60 s WebDAV lag.
cases:
  - id: modeling.discovery.schema-anywhere
    title: "A schema declared in any document, at any depth, governs instances host-wide"
    area: modeling
    feature: "schema discovery"
    evidence: documented
    source: "docs reference/modeling-data/Methods §Declaration (snapshot 2026-09-28); demo-apps/README.md@c4dd883:101; pagelove-shop/README.md@d887054:42"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-2, R-MOD-4, R-MOD-18."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/deep/definitions.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Tag">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="label">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "instance missing the required label is rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/tag-missing.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag"></div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://pagelove.org/SchemaViolation", cardinality]
      - name: "tag-missing.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/tag-missing.html"
        expect:
          status: 404
      - name: "valid instance in another directory is accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/tag-ok.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Tag">
                <meta itemprop="label" content="urgent">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state of tag-ok.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/tag-ok.html"
        expect:
          status: 200
          body_contains: ["content=\"urgent\""]
