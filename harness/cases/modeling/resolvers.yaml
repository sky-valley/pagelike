  - id: modeling.resolvers.recipe-date-format-read
    title: "Recipe: @read formats a stored timestamp while keeping the datetime attribute"
    area: modeling
    feature: resolvers
    evidence: documented
    source: "docs recipes/transforming-data §Formatting a date on read (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-MOD-50."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Entry">
                <li itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="createdAt">
                  <meta itemprop="type" content="https://schema.host/DateTime">
                  <meta itemprop="cardinality" content="1..1">
                  <script type="text/sessel" itemprop="@read">
                    self.map((el) => {
                      let stamp = el.value().parseDateTime();
                      new time[itemprop="createdAt"][datetime=el.value()] {
                        stamp.format("d MMMM yyyy")
                      }
                    })
                  </script>
                </li>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "store a raw timestamp"
        as: anonymous
        request:
          method: PUT
          path: "${P}/e.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Entry">
                <time itemprop="createdAt" datetime="2026-04-08T09:15:00Z"></time>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "public GET shows the formatted date"
        as: anonymous
        request:
          method: GET
          path: "${P}/e.html"
        expect:
          status: 200
          body_contains: ["8 April 2026", "datetime=\"2026-04-08T09:15:00Z\""]
      - name: "stored state of e.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/e.html"
        expect:
          status: 200
          body_contains: ["datetime=\"2026-04-08T09:15:00Z\""]
          body_not_contains: ["8 April 2026"]
  - id: modeling.resolvers.chain-order
    title: "@write runs child-first and @read runs ancestor-first across the inheritance chain"
    area: modeling
    feature: resolvers
    evidence: documented
    source: "docs reference/modeling-data/Resolvers §Inheritance ordering (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-MOD-11, R-MOD-51."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Entity">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="code">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <script type="text/sessel" itemprop="@write">self.map((el) => el.set_text(el.text() + "a"))</script>
                  <script type="text/sessel" itemprop="@read">self.map((el) => el.set_text(el.text() + "1"))</script>
                </div>
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Person">
                <meta itemprop="parent" content="https://pagelike.test${P}/Entity">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="code">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <script type="text/sessel" itemprop="@write">self.map((el) => el.set_text(el.text() + "b"))</script>
                  <script type="text/sessel" itemprop="@read">self.map((el) => el.set_text(el.text() + "2"))</script>
                </div>
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Employee">
                <meta itemprop="parent" content="https://pagelike.test${P}/Person">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="code">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <script type="text/sessel" itemprop="@write">self.map((el) => el.set_text(el.text() + "c"))</script>
                  <script type="text/sessel" itemprop="@read">self.map((el) => el.set_text(el.text() + "3"))</script>
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "store an Employee with code x"
        as: anonymous
        request:
          method: PUT
          path: "${P}/e.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Employee">
                <span itemprop="code">x</span>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state of e.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/e.html"
        expect:
          status: 200
          body_contains: [">xcba<"]
      - name: "public GET applies @read root to leaf"
        as: anonymous
        request:
          method: GET
          path: "${P}/e.html"
        expect:
          status: 200
          body_contains: [">xcba123<"]
