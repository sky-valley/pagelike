# Modeling: @write and @read resolvers (property pipelines), their chain order and errors.
# Spec: docs/spec/modeling.md §12 (R-MOD-49..R-MOD-53).
cases:
  - id: modeling.resolvers.sessel-write-normalise-email
    title: "A Sessel @write trims and lowercases before storage (docs example, in the form PageLove runs)"
    area: modeling
    feature: resolvers
    evidence: live-observed
    source: "docs reference/modeling-data/Resolvers §Examples (snapshot 2026-09-28); harness/observations/live-2026-09-29/modeling-resolvers-sessel-write-normalis.json (the documented el.set_text(...) fails: 500 'unknown function: set_text'); harness/observations/live-2026-09-29-reconcile-modeling/modeling-probe-0929-resolver-forms.json (form C, a constructed element with .lower(), works)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-MOD-49. Harness artifact 2026-09-29: the docs example calls set_text and lowercase(), which PageLove does not have, and the .text(x) setter refuses stored elements ('requires a constructed element'). The case now builds a new element, as the slug recipe does. pagelike still accepts the documented forms (modeling.probe-0929.resolver-forms, deferred to the Sessel area)."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Account">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="email">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <div itemprop="@write" itemscope itemtype="https://pagelove.org/Sessel">
                    <script itemprop="source" type="text/sessel">self.map((el) => new span[itemprop="email"] { el.text().trim().lower() })</script>
                  </div>
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "submit a messy email"
        as: anonymous
        request:
          method: PUT
          path: "${P}/a.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Account">
                <span itemprop="email"> Alice@Example.COM </span>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state of a.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/a.html"
        expect:
          status: 200
          body_contains: ["alice@example.com"]
          body_not_contains: ["Alice@Example.COM"]
