              <div itemscope itemtype="https://pagelike.test${P}/Account">
                <meta itemprop="email" content=" Alice@Example.COM ">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state of a.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/a.html"
        expect:
          status: 200
          body_contains: ["content=\"alice@example.com\""]
  - id: modeling.resolvers.recipe-slug-lowercase
    title: "Recipe: @write replaces the slug meta with a lowercased one"
    area: modeling
    feature: resolvers
    evidence: documented
    source: "docs recipes/transforming-data §Lowercasing a slug on write (snapshot 2026-09-28)"
    confidence: high
    requires: [sessel]
    live: true
    notes: "spec: R-MOD-49."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Project">
                <li itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="slug">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <script type="text/sessel" itemprop="@write">
                    self.map((el) => {
                      let normalized = el.value().lowercase();
                      new meta[itemprop="slug"][content=normalized] {}
                    })
                  </script>
                </li>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "PUT My-Project"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Project">
                <meta itemprop="slug" content="My-Project">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state of p.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/p.html"
        expect:
          status: 200
          body_contains: [my-project]
          body_not_contains: [My-Project]
      - name: "public GET returns the lowercase form"
        as: anonymous
        request:
          method: GET
          path: "${P}/p.html"
        expect:
          status: 200
          body_contains: [my-project]
          body_not_contains: [My-Project]
