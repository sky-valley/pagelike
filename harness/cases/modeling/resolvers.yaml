  - id: modeling.resolvers.js-write-httpresponse-postcode
    title: "A JS @write can refuse the write with a thrown HTTPResponse, or transform it (postcode example)"
    area: modeling
    feature: resolvers
    evidence: documented
    source: "docs languages/javascript/server/javascript-in-schemas §Explaining why a value was rejected (snapshot 2026-09-28)"
    confidence: high
    requires: [server-js]
    live: true
    notes: "spec: R-MOD-47, R-MOD-49."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Address">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="postcode">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <div itemprop="@write" itemscope itemtype="https://pagelove.org/JavaScript/Module">
                    <script itemprop="source" type="module">export default function (value) {
                        if (!/^[A-Z]{1,2}[0-9]/.test(value)) {
                          throw { schema_url: "https://pagelove.org/HTTPResponse", status: 422, message: value + " is not a valid postcode" };
                        }
                        return value.toUpperCase();
                      }</script>
                  </div>
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "valid prefix is uppercased"
        as: anonymous
        request:
          method: PUT
          path: "${P}/a.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Address">
                <meta itemprop="postcode" content="SW1A 1aa">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state of a.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/a.html"
        expect:
          status: 200
          body_contains: ["content=\"SW1A 1AA\""]
      - name: "invalid postcode refused with the thrown message"
        as: anonymous
        request:
          method: PUT
          path: "${P}/b.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Address">
                <meta itemprop="postcode" content="zz">
              </div>
            </body></html>
        expect:
          status: 422
          body_contains: ["zz is not a valid postcode"]
      - name: "b.html was not stored"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/b.html"
        expect:
          status: 404
