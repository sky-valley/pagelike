# Modeling: static and dynamic defaults, @key primary keys and the auto-generated key default.
# Spec: docs/spec/modeling.md §6 and §8 (R-MOD-27..R-MOD-29, R-MOD-33..R-MOD-35).
cases:
  - id: modeling.defaults.static-injected
    title: "A static default is injected as <meta itemprop content> when the property is absent"
    area: modeling
    feature: defaults
    evidence: documented
    source: "docs reference/modeling-data/Property §Defaults (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-27. Placement (last child of the item) is a pagelike decision; only presence is asserted."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Post">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="title">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="status">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="0..1">
                  <meta itemprop="default" content="draft">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "post without status"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Post">
                <meta itemprop="title" content="Hello">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "stored state of p.html (authoring plane, raw)"
        as: author
        plane: dav
        request:
          method: GET
          path: "${P}/p.html"
        expect:
          status: 200
          body_contains: ["<meta itemprop=\"status\" content=\"draft\">"]
      - name: "public read shows the injected value"
        as: anonymous
        request:
          method: GET
          path: "${P}/p.html"
        expect:
          status: 200
          body_contains: ["content=\"draft\""]
