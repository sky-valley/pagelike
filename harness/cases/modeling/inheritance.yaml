  - id: modeling.inheritance.schema-validate-chain-runs-all
    title: "Every schema-level @validate in the chain runs; a failing ancestor validator rejects the child item"
    area: modeling
    feature: inheritance
    evidence: documented
    source: "docs reference/modeling-data/Schema §How inherited members combine (snapshot 2026-09-28)"
    confidence: medium
    requires: [sessel]
    live: true
    notes: "spec: R-MOD-11, R-MOD-46. Contradiction C3: Property/JS pages say validators do not chain; resolved as schema-level chain vs property-level most-derived."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Strict">
                <script type="text/sessel" itemprop="@validate">false</script>
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Lenient">
                <meta itemprop="parent" content="https://pagelike.test${P}/Strict">
                <script type="text/sessel" itemprop="@validate">true</script>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "child item rejected by the ancestor's validator"
        as: anonymous
        request:
          method: PUT
          path: "${P}/l.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Lenient"></div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
