# Modeling: schema inheritance (parent chains and how inherited members combine).
# Spec: docs/spec/modeling.md §2 (R-MOD-10..R-MOD-12).
cases:
  - id: modeling.inheritance.parent-property-enforced-on-child
    title: "A child schema inherits the parent's properties (docs Entity/Person example)"
    area: modeling
    feature: inheritance
    evidence: documented
    source: "docs reference/modeling-data/Schema §Inheritance (snapshot 2026-09-28); docs reference/modeling-data/Schema §Examples (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: "spec: R-MOD-10, R-MOD-11."
    site:
      settings:
        default_get: allow
      rules:
        - actor: "*"
          resource: "${P}/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
        - actor: "*"
          resource: "${P}/*/*"
          method: [GET, HEAD, PUT, POST, DELETE, MOVE]
          action: Allow
    steps:
      - name: "register declarations through the public plane (takes effect for the next request)"
        as: anonymous
        request:
          method: PUT
          path: "${P}/schema.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Entity">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="identifier">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                  <meta itemprop="unique" content="true">
                </div>
              </div>
              <div hidden itemscope itemtype="https://pagelove.org/Schema">
                <meta itemprop="type" content="https://pagelike.test${P}/Person">
                <meta itemprop="parent" content="https://pagelike.test${P}/Entity">
                <div itemprop="property" itemscope itemtype="https://pagelove.org/Property">
                  <meta itemprop="name" content="email">
                  <meta itemprop="type" content="https://schema.host/Text">
                  <meta itemprop="cardinality" content="1..1">
                </div>
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
      - name: "Person without the inherited identifier is rejected"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p1.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Person">
                <meta itemprop="email" content="ada@example.com">
              </div>
            </body></html>
        expect:
          status: 422
          header_matches:
            Content-Type: "^text/html"
          body_contains: ["https://pagelove.org/SchemaViolation", cardinality]
      - name: "Person with identifier and email is accepted"
        as: anonymous
        request:
          method: PUT
          path: "${P}/p2.html"
          headers:
            Content-Type: text/html
          body: |
            <!DOCTYPE html>
            <html><body>
              <div itemscope itemtype="https://pagelike.test${P}/Person">
                <meta itemprop="identifier" content="ada">
                <meta itemprop="email" content="ada@example.com">
              </div>
            </body></html>
        expect:
          status: [200, 201, 204]
  - id: modeling.inheritance.child-overrides-property-by-name
    title: "A child property with the same name overrides the parent's declaration"
    area: modeling
    feature: inheritance
