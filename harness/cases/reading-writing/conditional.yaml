        expect: {status: 204}
      - name: gone
        as: anonymous
        request: {method: GET, path: "${P}/del.html"}
        expect: {status: 404}

  - id: rw.cond.post-if-match-document-tag
    title: A conditional append is compared with the anchor's tag; the document's tag is 412
    area: reading-writing
    feature: Conditional POST
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/rw-cond-post-if-match-document-tag.json (a document tag on a selector POST is 412 carrying the anchor #l's tag); docs reference/reading-and-writing/POST-method §Concurrency (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    notes: >-
      Q-1 settled by the live run of 2026-09-28: PageLove compares a selector write's If-Match with
      the addressed element's tag only (the anchor for POST), so R-RW-89's "document or element tag"
      is superseded (docs/compat/decisions.md). Element tags change with every write to the document.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/cpost.html"
          body: |
            <!DOCTYPE html>
            <html><body><ul id="l"><li>base</li></ul></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, POST], action: Allow}
    steps:
      - name: read the document
        as: anonymous
        request: {method: GET, path: "${P}/cpost.html"}
        expect: {status: 200}
        capture: {d: header.ETag}
      - name: read the anchor's tag
        as: anonymous
        request:
          method: HEAD
          path: "${P}/cpost.html"
          headers: {Range: "selector=#l"}
        expect: {status: 206, headers_present: [ETag]}
        capture: {a: header.ETag}
      - name: the document tag is stale for a selector write
        as: anonymous
        request:
          method: POST
          path: "${P}/cpost.html"
          headers: {Range: "selector=#l", If-Match: "${d}", Content-Type: "text/html"}
          body: "<li>document-tag append</li>"
        expect:
          status: 412
          etag_equals: "${a}"
          header_matches: {Content-Type: "^text/html$"}
          body_contains: ['<span itemprop="message">Precondition Failed: ETag does not match</span>']
      - name: conditional append with the anchor's tag
        as: anonymous
        request:
          method: POST
          path: "${P}/cpost.html"
          headers: {Range: "selector=#l", If-Match: "${a}", Content-Type: "text/html"}
          body: "<li>first conditional</li>"
        expect: {status: 206}
      - name: same tag again is stale
        as: anonymous
        request:
          method: POST
          path: "${P}/cpost.html"
          headers: {Range: "selector=#l", If-Match: "${a}", Content-Type: "text/html"}
          body: "<li>second conditional</li>"
        expect: {status: 412}
      - name: only the first landed
        as: anonymous
        request:
          method: GET
          path: "${P}/cpost.html"
          headers: {Range: "selector=#l"}
        expect:
          status: 206
          body_contains: ["first conditional"]
          body_not_contains: ["second conditional", "document-tag append"]

  - id: rw.cond.selector-put-element-etag
    title: beta-js flow - HEAD element tag, conditional selector PUTs chain via response ETags, stale tag is 412
    area: reading-writing
    feature: Conditional selector PUT
    evidence: client-source
    source: "beta-js/pagelove/primitives.mjs@c204746:258-273 (If-Match element.etag), :296-297 (response ETag replaces element.etag), :474-501 (HEAD for tags)"
    confidence: medium
    requires: []
    live: true
    notes: "pagelove-kanban/site/app.js@85109ab:29-38 reports conditional writes failing on an older build (spec §23 C-2)."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/notes.html"
          body: |
            <!DOCTYPE html>
            <html><body><article id="note-42"><h2>Draft</h2></article><article id="note-43"><h2>Other</h2></article></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: lazy tag fetch
        as: anonymous
        request:
          method: HEAD
          path: "${P}/notes.html"
          headers: {Range: "selector=#note-42"}
        expect: {status: 206, headers_present: [ETag]}
        capture: {e1: header.ETag}
      - name: first edit
        as: anonymous
        request:
          method: PUT
          path: "${P}/notes.html"
          headers:
            Range: "selector=#note-42"
            If-Match: "${e1}"
            Content-Type: "text/html;charset=UTF-8"
          body: '<article id="note-42"><h2>Edit one</h2></article>'
        expect: {status: 206, headers_present: [ETag]}
        capture: {e2: header.ETag}
      - name: second edit chained on the response tag
        as: anonymous
        request:
          method: PUT
          path: "${P}/notes.html"
          headers:
            Range: "selector=#note-42"
            If-Match: "${e2}"
            Content-Type: "text/html;charset=UTF-8"
          body: '<article id="note-42"><h2>Edit two</h2></article>'
        expect: {status: 206, headers_present: [ETag]}
        capture: {e3: header.ETag}
      - name: stale tag
        as: anonymous
        request:
          method: PUT
          path: "${P}/notes.html"
          headers:
            Range: "selector=#note-42"
            If-Match: "${e1}"
            Content-Type: "text/html;charset=UTF-8"
          body: '<article id="note-42"><h2>Lost update</h2></article>'
        expect:
          status: 412
          headers_present: [ETag]
      - name: edit two survived
        as: anonymous
        request:
          method: GET
          path: "${P}/notes.html"
          headers: {Range: "selector=#note-42"}
        expect:
          status: 206
          etag_equals: "${e3}"
          body_contains: ["Edit two"]
          body_not_contains: ["Lost update"]

