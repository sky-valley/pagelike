    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/del.html"
          body: |
            <!DOCTYPE html>
            <html><body><p>v1</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT, DELETE], action: Allow}
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/del.html"}
        expect: {status: 200}
        capture: {e1: header.ETag}
      - name: someone else edits
        as: anonymous
        request:
          method: PUT
