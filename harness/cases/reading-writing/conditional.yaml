    title: A whole DELETE with a stale If-Match is 412 with the current ETag; with the current tag it deletes
    area: reading-writing
    feature: Conditional DELETE
    evidence: documented
    source: "docs reference/reading-and-writing/DELETE-method §Concurrency (snapshot 2026-09-28)"
    confidence: high
    requires: []
