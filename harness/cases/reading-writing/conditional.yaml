# ETags, If-Match / If-None-Match, 304 and 412.
# Spec: docs/spec/reading-writing.md §12, §13 (R-RW-85..100).
# etag_equals / etag_differs compare the response ETag header with the given value.
cases:
  - id: rw.cond.get-if-none-match-304
    title: GET with If-None-Match of the current ETag is 304 with no body
    area: reading-writing
    feature: Conditional GET
    evidence: documented
    source: "docs reference/reading-and-writing/GET-method §Caching (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/c.html"
          body: |
            <!DOCTYPE html>
            <html><body><p>cache me</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD], action: Allow}
    steps:
      - name: first read
        as: anonymous
        request: {method: GET, path: "${P}/c.html"}
        expect: {status: 200, headers_present: [ETag]}
        capture: {e: header.ETag}
      - name: revalidate
        as: anonymous
        request:
          method: GET
          path: "${P}/c.html"
          headers: {If-None-Match: "${e}"}
        expect:
          status: 304
          body: ""
          etag_equals: "${e}"
      - name: list form containing the current tag
        as: anonymous
        request:
          method: GET
          path: "${P}/c.html"
          headers: {If-None-Match: '"pagelike-not-a-tag", ${e}'}
        expect: {status: 304}
      - name: non-matching tag returns the full representation
        as: anonymous
        request:
          method: GET
          path: "${P}/c.html"
          headers: {If-None-Match: '"pagelike-not-a-tag"'}
        expect:
          status: 200
          body_contains: ["cache me"]

