          body: |
            <!DOCTYPE html>
            <html><body><p>v2</p></body></html>
        expect: {status: [200, 201, 204]}
      - name: current tag
        as: anonymous
        request: {method: GET, path: "${P}/del.html"}
        expect: {status: 200}
        capture: {e2: header.ETag}
      - name: stale delete refused
        as: anonymous
        request:
          method: DELETE
          path: "${P}/del.html"
          headers: {If-Match: "${e1}"}
        expect:
          status: 412
          etag_equals: "${e2}"
