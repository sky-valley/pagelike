  - id: rw.cond.put-if-match-current
    title: A whole-document PUT with the current ETag in If-Match succeeds and changes the ETag
    area: reading-writing
    feature: Conditional PUT
    evidence: documented
    source: "docs reference/reading-and-writing/PUT-method §Concurrency (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><p>version 1</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: read
        as: anonymous
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 200}
        capture: {e1: header.ETag}
      - name: conditional write
        as: anonymous
        request:
          method: PUT
          path: "${P}/doc.html"
          headers: {If-Match: "${e1}", Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html><body><p>version 2</p></body></html>
        expect: {status: [200, 201, 204]}
      - name: new version, new tag
        as: anonymous
        request: {method: GET, path: "${P}/doc.html"}
        expect:
          status: 200
          etag_differs: "${e1}"
          body_contains: ["version 2"]

  - id: rw.cond.put-if-match-stale-412
    title: A PUT with a stale If-Match is 412, carries the current ETag, and writes nothing
    area: reading-writing
    feature: Conditional PUT
    evidence: documented
    source: "docs reference/reading-and-writing/PUT-method §Concurrency ('The 412 response carries the document's current ETag') (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/doc.html"
          body: |
            <!DOCTYPE html>
            <html><body><p>version 1</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: client A reads
        as: anonymous
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 200}
        capture: {e1: header.ETag}
      - name: client B saves first
        as: anonymous
        request:
          method: PUT
          path: "${P}/doc.html"
          headers: {Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html><body><p>version B</p></body></html>
        expect: {status: [200, 201, 204]}
      - name: current tag
        as: anonymous
        request: {method: GET, path: "${P}/doc.html"}
        expect: {status: 200}
        capture: {e2: header.ETag}
      - name: client A's conditional save is rejected
        as: anonymous
        request:
          method: PUT
          path: "${P}/doc.html"
          headers: {If-Match: "${e1}", Content-Type: "text/html"}
          body: |
            <!DOCTYPE html>
            <html><body><p>version A</p></body></html>
        expect:
          status: 412
          headers_present: [ETag]
          etag_equals: "${e2}"
      - name: B's version survived
        as: anonymous
        request: {method: GET, path: "${P}/doc.html"}
        expect:
          status: 200
          body_contains: ["version B"]
          body_not_contains: ["version A"]

