  - id: rw.up.extension-inference
    title: Without a Content-Type the type is inferred from the extension
    area: reading-writing
    feature: Content type resolution
    evidence: documented
    source: "docs reference/reading-and-writing/Uploading-Files §Content type rule 3 ('.css -> text/css, .png -> image/png') (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: CSS without header
        as: anonymous
        request:
          method: PUT
          path: "${P}/style.css"
          body: "h1 { color: blue; }"
        expect: {status: [200, 201, 204]}
      - name: CSS served as text/css
        as: anonymous
        request: {method: GET, path: "${P}/style.css"}
        expect:
          status: 200
          header_matches: {Content-Type: "^text/css"}
      - name: PNG without header
        as: anonymous
        request:
          method: PUT
          path: "${P}/pic.png"
          body: "not-really-png-bytes"
        expect: {status: [200, 201, 204]}
      - name: PNG served as image/png
        as: anonymous
        request: {method: GET, path: "${P}/pic.png"}
        expect:
          status: 200
          header_matches: {Content-Type: "^image/png"}
          body: "not-really-png-bytes"

