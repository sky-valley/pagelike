# Uploading files: blobs, content-type resolution, serving, caching.
# Spec: docs/spec/reading-writing.md §9 R-RW-60, §14, §15.
# The runner must not add a default Content-Type to request bodies.
cases:
  - id: rw.up.json-roundtrip
    title: A PUT JSON blob is served back byte-for-byte with its stored content type
    area: reading-writing
    feature: Blob upload
    evidence: documented
    source: "docs reference/reading-and-writing/Uploading-Files §Uploading (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: upload
        as: anonymous
        request:
          method: PUT
          path: "${P}/data.json"
          headers: {Content-Type: "application/json"}
          body: '{"name":"widget","price":29.99}'
        expect: {status: [200, 201, 204]}
      - name: fetch
        as: anonymous
        request: {method: GET, path: "${P}/data.json"}
        expect:
          status: 200
          header_matches: {Content-Type: "^application/json"}
          headers_present: [ETag]
          body: '{"name":"widget","price":29.99}'

  - id: rw.up.byte-fidelity
    title: Blob bytes are preserved exactly, including CRLF and markup-like text
    area: reading-writing
    feature: Blob upload
    evidence: documented
    source: "docs reference/reading-and-writing/Uploading-Files intro ('served back byte-for-byte'), §Serving ('No composition') (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: upload text with template-like content
        as: anonymous
        request:
          method: PUT
          path: "${P}/raw.txt"
          headers: {Content-Type: "text/plain"}
          body: "line one\r\nline two {{ 1 | plus: 1 }} <p:include selector=\"#x\" /> e:x=\"y\"\r\n"
        expect: {status: [200, 201, 204]}
      - name: fetch unchanged
        as: anonymous
        request: {method: GET, path: "${P}/raw.txt"}
        expect:
          status: 200
          header_matches: {Content-Type: "^text/plain"}
          body_contains: ["line one\r\nline two {{ 1 | plus: 1 }} <p:include selector=\"#x\" /> e:x=\"y\""]

  - id: rw.up.html-extension-forces-text-html
    title: A .html or .htm path is always stored as text/html, whatever Content-Type says
    area: reading-writing
    feature: Content type resolution
    evidence: documented
    source: "docs reference/reading-and-writing/Uploading-Files §Content type rule 1 (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, PUT], action: Allow}
    steps:
      - name: .html sent as octet-stream
        as: anonymous
        request:
          method: PUT
          path: "${P}/forced.html"
          headers: {Content-Type: "application/octet-stream"}
          body: |
            <!DOCTYPE html>
            <html><body><h1>Forced HTML</h1></body></html>
        expect: {status: [200, 201, 204]}
      - name: served as HTML
        as: anonymous
        request: {method: GET, path: "${P}/forced.html"}
        expect:
          status: 200
          header_matches: {Content-Type: "^text/html"}
      - name: selector-addressable, so it is an HTML document
        as: anonymous
        request:
          method: GET
          path: "${P}/forced.html"
          headers: {Range: "selector=h1"}
        expect:
          status: 206
          body_html: "<h1>Forced HTML</h1>"
      - name: .htm sent as text/plain
        as: anonymous
        request:
          method: PUT
          path: "${P}/legacy.htm"
          headers: {Content-Type: "text/plain"}
          body: |
            <!DOCTYPE html>
            <html><body><h1>Legacy</h1></body></html>
        expect: {status: [200, 201, 204]}
      - name: .htm served as HTML
        as: anonymous
        request: {method: GET, path: "${P}/legacy.htm"}
        expect:
          status: 200
          header_matches: {Content-Type: "^text/html"}

