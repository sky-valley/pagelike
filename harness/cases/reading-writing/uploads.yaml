      - name: served as text/plain
        as: anonymous
        request: {method: GET, path: "${P}/data.css"}
        expect:
          status: 200
          header_matches: {Content-Type: "^text/plain"}
          body: "body { color: red; }"

  - id: rw.up.wrong-header-stored-verbatim
