  - id: rw.post.parentless-anchor-400
    title: before/after against the parentless <html> anchor is 422 with a problems item
    area: reading-writing
    feature: POST placement
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/rw-post-parentless-anchor-400.json (422, https://pagelove.org/Error problems item); docs reference/reading-and-writing/POST-method §Placement (snapshot 2026-09-28) claims 400"
    confidence: high
    requires: []
    live: true
    notes: "The id keeps its original name; the documented 400 is superseded (docs/compat/decisions.md)."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/root.html"
          body: |
            <!DOCTYPE html>
            <html><body><p>root test</p></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, POST], action: Allow}
    steps:
      - name: before html
        as: anonymous
        request:
          method: POST
          path: "${P}/root.html"
          headers: {Range: "selector=html; placement=before", Content-Type: "text/html"}
          body: "<p>outside before</p>"
        expect:
          status: 422
          header_matches: {Content-Type: "^text/html$"}
          headers: {Vary: "Host, Range"}
          body: '<div itemscope itemtype="https://pagelove.org/Error"><ul itemprop="problems"><li itemprop="problem"><span itemprop="message">placement=Before relative to the document root is not possible: the root has no siblings</span></li></ul></div>'
      - name: after html
        as: anonymous
        request:
          method: POST
          path: "${P}/root.html"
          headers: {Range: "selector=html; placement=after", Content-Type: "text/html"}
          body: "<p>outside after</p>"
        expect:
          status: 422
          body: '<div itemscope itemtype="https://pagelove.org/Error"><ul itemprop="problems"><li itemprop="problem"><span itemprop="message">placement=After relative to the document root is not possible: the root has no siblings</span></li></ul></div>'
      - name: nothing was written
        as: anonymous
        request: {method: GET, path: "${P}/root.html"}
        expect:
          status: 200
          body_not_contains: ["outside before", "outside after"]

