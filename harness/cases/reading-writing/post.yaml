  - id: rw.post.etag-is-anchor-tag
    title: The POST ETag is the inserted child's tag, not the anchor's, with no Content-Location
    area: reading-writing
    feature: POST response headers
    evidence: live-observed
    source: "harness/observations/live-2026-09-28/rw-post-etag-is-anchor-tag.json (ETag = sha256('<li>two</li>') twice and the document version 2; the anchor's tag differs); beta-js/pagelove/primitives.mjs@c204746:355-396"
    confidence: high
    requires: []
    live: true
    notes: >-
      The id keeps its original name. Q-4 settled: without Content-Location PageLove still tags
      the POST answer as the child ("<sha256 of the fragment>-<same>-<document version>"), so
      R-RW-73 (the anchor's tag, per beta-js) is superseded (docs/compat/decisions.md). The
      literal tag below is byte-for-byte PageLove's.
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/anchor.html"
          body: |
            <!DOCTYPE html>
            <html><body><ul id="anchor"><li>one</li></ul></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, POST], action: Allow}
    steps:
      - name: append
        as: anonymous
        request:
          method: POST
          path: "${P}/anchor.html"
          headers: {Range: "selector=#anchor", Content-Type: "text/html;charset=UTF-8"}
          body: "<li>two</li>"
        expect:
          status: 206
          headers:
            ETag: '"6de25f78336cb76acda5abdabd9849c8b091de4f14d8075637c260310542c97b-6de25f78336cb76acda5abdabd9849c8b091de4f14d8075637c260310542c97b-2"'
            Vary: "Host, Range"
          headers_present: [Last-Modified]
          headers_absent: [Content-Location]
        capture: {post_etag: header.ETag}
      - name: the new child's tag equals the POST tag
        as: anonymous
        request:
          method: HEAD
          path: "${P}/anchor.html"
          headers: {Range: "selector=#anchor > li:last-child"}
        expect:
          status: 206
          etag_equals: "${post_etag}"
      - name: the anchor's tag is different
        as: anonymous
        request:
          method: HEAD
          path: "${P}/anchor.html"
          headers: {Range: "selector=#anchor"}
