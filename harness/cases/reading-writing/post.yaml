# POST with a selector range: append (default) and placement.
# Spec: docs/spec/reading-writing.md §10 (R-RW-70..79).
cases:
  - id: rw.post.append
    title: POST with a selector appends the body as the last child and answers 206 with the new child
    area: reading-writing
    feature: POST selector append
    evidence: documented
    source: "docs reference/reading-and-writing/POST-method §Append to a list (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/post-append-test.html"
          body: |
            <!DOCTYPE html>
            <html><body><ul><li>Existing item</li></ul></body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, POST], action: Allow}
    steps:
      - name: append a list item
        as: anonymous
        request:
          method: POST
          path: "${P}/post-append-test.html"
          headers: {Range: "selector=ul", Content-Type: "text/html"}
          body: "<li>New item</li>"
        expect:
          status: 206
          body_html: "<li>New item</li>"

  - id: rw.post.append-verify
    title: An append preserves existing children and adds the new one last
    area: reading-writing
    feature: POST selector append
    evidence: documented
    source: "docs reference/reading-and-writing/POST-method §Verify the append (snapshot 2026-09-28)"
    confidence: high
    requires: []
    live: true
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/post-verify-test.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <ul>
                <li>Existing item</li>
              </ul>
            </body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, POST], action: Allow}
    steps:
      - name: append
        as: anonymous
        request:
          method: POST
          path: "${P}/post-verify-test.html"
          headers: {Range: "selector=ul", Content-Type: "text/html"}
          body: "<li>Appended item</li>"
        expect: {status: 206}
      - name: read the list
        as: anonymous
        request:
          method: GET
          path: "${P}/post-verify-test.html"
          headers: {Range: "selector=ul"}
        expect:
          status: 206
          body_html: "<ul><li>Existing item</li><li>Appended item</li></ul>"

  - id: rw.post.getting-started-example
    title: The getting-started append names the updated element in Content-Range and keeps source whitespace
    area: reading-writing
    feature: POST selector append
    evidence: documented
    source: "docs index §A minimal example (POST /getting-started-demo.html Range selector=#items; read-back output) (snapshot 2026-09-28)"
    confidence: medium
    requires: []
    live: true
    notes: "The exact read-back body reproduces the docs output byte-for-byte (the request body's trailing newline is inserted too). Content-Range spelling tolerated either way (spec §23 C-1)."
    site:
      settings: {default_get: allow}
      files:
        - path: "${P}/getting-started-demo.html"
          body: |
            <!DOCTYPE html>
            <html><body>
              <h1>My Page</h1>
              <ul id="items">
                <li>First item</li>
              </ul>
            </body></html>
      rules:
        - {actor: "*", resource: "${P}/*", method: [GET, HEAD, POST], action: Allow}
    steps:
      - name: add an item
        as: anonymous
        request:
          method: POST
          path: "${P}/getting-started-demo.html"
          headers: {Range: "selector=#items", Content-Type: "text/html"}
          body: |
            <li>Second item</li>
        expect:
          status: 206
          body: "<li>Second item</li>"
          header_matches: {Content-Range: "^selector[ =]#items$"}
      - name: read back just the list
        as: anonymous
        request:
          method: GET
          path: "${P}/getting-started-demo.html"
          headers: {Range: "selector=#items"}
        expect:
          status: 206
          body: |-
            <ul id="items">
                <li>First item</li>
              <li>Second item</li>
            </ul>

