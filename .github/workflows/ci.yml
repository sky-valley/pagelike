name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go test (unit, integration, durability, compatibility harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal harness test tools)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: harness (local target)
        run: go run ./harness/cmd/harness run

  e2e:
    name: browser suites (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        working-directory: e2e
        run: npm ci
      - name: playwright
        working-directory: e2e
        run: npx playwright test
