<!DOCTYPE html>
<html lang="en" xmlns:p="https://pagelove.org/1.0">
<head><meta charset="utf-8"><title>Board partials</title></head>
<body>
<header id="board-header" class="board-header">
  <h1>Team board</h1>
  <p class="me" p:template="text/liquid">{% if request.auth.username %}Signed in as <strong data-me="{{ request.auth.username }}">{{ request.auth.claims.name | default: request.auth.username }}</strong>{% else %}<a href="/auth/login?redirect=/">Sign in to move cards</a>{% endif %}</p>
  <p class="hint">Cards move one step at a time: To do → Doing → Done (and back from Doing).</p>
</header>
</body>
</html>
