<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed (iframe host)</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
main { max-width: 820px; margin: 0 auto; padding: 16px; display: grid; gap: 20px; }
figure { margin: 0; }
iframe { width: 100%; height: 560px; border: 1px solid #8884; border-radius: 14px; background: #fff; }
figcaption { font-size: 13px; opacity: .7; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>A feed of experiences</h1>
  <!-- Experiences play inside iframes from their own origins. The ?port
       query (e.g. ?port=8787) is appended to reach a local pagelike. -->
  <figure><iframe id="sky" title="Show me your sky"></iframe><figcaption>Original experience</figcaption></figure>
  <figure><iframe id="dog" title="Show me your dog (remix)"></iframe><figcaption>A remix with its own participation space</figcaption></figure>
</main>
<script>
  const port = new URLSearchParams(location.search).get("port") || location.port;
  const origin = (site) => `${location.protocol}//${site}.localhost${port ? ":" + port : ""}/`;
  document.querySelector("#sky").src = origin(new URLSearchParams(location.search).get("a") || "sky");
  document.querySelector("#dog").src = origin(new URLSearchParams(location.search).get("b") || "dog");
</script>
</body>
</html>
